<meta charset="utf-8">
<title>Only Profit</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:ital,wght@0,400..900;1,400..900&family=Share+Tech+Mono&family=Fraunces:opsz,wght@9..144,600..900&family=Nunito:wght@800..900&family=Caveat:wght@700&display=swap">
<style>
/* Layout: a green card table (public board, left) beside your desk (right, sticky), which ends in a desk calculator.
   Look: Draft A. Cards and baize from 7, grotesk + pictograms from 2, calculator from 4, stripe wipes from 5. One committed look, no dark variant. */
:root {
  color-scheme: light;
  --baize: #35574A; --baize-hi: #46705F; --baize-lo: #284338;
  --stock: #F1E9D4;      /* card stock */
  --stock-2: #E7DCC0;    /* flap, spares */
  --stock-3: #D9CCAA;
  --ink: #141414; --ink-2: #4E4A40; --ink-3: #857D6B;
  --on-table: #F1E9D4; --on-table-2: rgba(241,233,212,.62); --table-rule: rgba(241,233,212,.22);
  --red: #D9261C; --red-lo: #8E160F;
  --good: #2C6A4E;
  --sunset: #E0732C; --gold: #E9A23B; --rust: #C0472A; --teak: #6E3420;
  --lcd: #AEBB9E; --lcd-ink: #1E261A; --housing: #2B2C2A; --key: #4A4B47;
  --env-manila: #E5D3A4; --env-salmon: #EDC6B4; --env-carbon: #C8D3E2; --env-mint: #CEDFCF; --env-gold: #EDD57F;
  --lift: 0 1px 0 rgba(0,0,0,.18), 0 8px 18px -10px rgba(0,0,0,.6);
  --f-body: "Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif;
  --f-seg: "Share Tech Mono", ui-monospace, Menlo, monospace;
  --bounce: cubic-bezier(.34, 1.56, .64, 1);
  --brand: var(--red); --brand-hi: #EF4A37; --brand-lo: var(--red-lo); --brand-ink: #fff; --mono: "OP";
}

* { box-sizing: border-box }
table { color: inherit; font-size: inherit }
html { background: var(--baize-lo) }
body { background: radial-gradient(90% 70% at 40% 0%, var(--baize-hi), var(--baize) 45%, var(--baize-lo) 100%) no-repeat, var(--baize-lo); color: var(--on-table); font: 15px/1.5 var(--f-body); -webkit-font-smoothing: antialiased; min-height: 100vh }
button { font: inherit; color: inherit; cursor: pointer }
button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px }
.wrap { max-width: 1260px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.mono, .num { font-family: var(--f-seg); font-variant-numeric: tabular-nums }
.pos { color: var(--good) } .gold { color: var(--sunset) } .neg { color: var(--red) } .zero { color: var(--ink-3) }
.label { font: 700 11px/1.2 var(--f-body); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2) }
h1, h2, h3 { text-wrap: balance; margin: 0 }
h2 { font-size: 15px; font-weight: 800; letter-spacing: -.005em }
.muted { color: var(--ink-2) }

/* ---------- masthead: black band, phase tab, profit calculator ---------- */
.mast { background: var(--ink); color: var(--stock); position: relative; z-index: 2 }
.mast .wrap { display: flex; align-items: center; gap: 18px 22px; padding-block: 10px; flex-wrap: wrap }
.logo { display: flex; align-items: center; gap: 10px }
.logo-mark { width: 34px; height: 34px; border-radius: 50%; background: radial-gradient(circle at 38% 32%, var(--brand-hi), var(--brand) 45%, var(--brand-lo)); display: grid; place-items: center; color: var(--brand-ink); opacity: 1; font: 900 13px/1 var(--f-body); letter-spacing: -.04em; box-shadow: 0 2px 5px rgba(0,0,0,.5) }
.logo-type { font: 900 21px/1 var(--f-body); letter-spacing: -.03em }
.logo-type small { display: block; font: 600 10.5px/1.3 var(--f-body); letter-spacing: .08em; color: rgba(241,233,212,.5); text-transform: uppercase; margin-top: 3px }
.tab { display: inline-flex; align-items: stretch; font: 800 13px/1 var(--f-body); border-radius: 2px; overflow: hidden }
.tab b { background: var(--red); color: #fff; padding: 7px 9px; font-weight: 900 }
.tab span { background: var(--stock); color: var(--ink); padding: 7px 10px; letter-spacing: .01em }
.mast-stats { display: flex; gap: 18px; align-items: center; margin-left: auto; flex-wrap: wrap }
.stat { display: grid; gap: 2px }
.stat .label { color: rgba(241,233,212,.5); font-size: 10px }
.stat b { font: 800 16px/1.1 var(--f-body) }
.meter { display: flex; align-items: center; gap: 10px; background: var(--housing); padding: 6px 8px 6px 6px; border-radius: 6px; box-shadow: inset 0 1px 0 rgba(255,255,255,.07) }
.meter-lcd { background: var(--lcd); color: var(--lcd-ink); font-family: var(--f-seg); padding: 3px 9px 2px; border-radius: 3px; box-shadow: inset 0 2px 4px rgba(0,0,0,.35); min-width: 132px; display: grid }
.meter-lcd .ann { font-size: 9.5px; letter-spacing: .12em; display: flex; justify-content: space-between; gap: 8px }
.meter-lcd .ann .off { opacity: .25 }
.meter-lcd .v { font-size: 25px; line-height: 1; text-align: right; font-variant-numeric: tabular-nums }
.meter-lcd .v .ghost { opacity: .13 }
.meter-lcd .v small { font-size: 13px; opacity: .7 }
.meter-track { position: relative; width: 92px; height: 32px; display: grid; align-content: center }
.meter-track .bar { position: relative; height: 8px; background: #1C1D1B; border-radius: 4px; overflow: hidden }
.meter-fill { position: absolute; top: 0; bottom: 0; background: var(--gold); transition: left .7s ease, width .7s ease }
.meter-fill.neg { background: var(--red) }
.meter-zero { position: absolute; top: 0; bottom: 0; width: 1px; background: rgba(255,255,255,.35) }
.meter-tick { position: absolute; top: 4px; bottom: 4px; width: 2px; background: var(--stock); border-radius: 1px }
.meter-track .lbl { display: flex; justify-content: space-between; font: 700 9px/1 var(--f-body); letter-spacing: .08em; color: rgba(241,233,212,.45); margin-top: 5px; text-transform: uppercase }
.tools { display: flex; gap: 6px }
.chip-btn { border: 1px solid rgba(241,233,212,.28); background: transparent; color: var(--stock); border-radius: 999px; padding: 6px 12px; font: 700 12px/1 var(--f-body) }
.chip-btn:hover { border-color: var(--stock) }
.chip-btn[aria-pressed="true"] { background: var(--gold); color: var(--ink); border-color: var(--gold) }

/* ---------- layout ---------- */
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 410px; gap: 30px; padding-block: 26px 72px; align-items: start }
.board { display: grid; gap: 30px; min-width: 0 }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--table-rule); margin-bottom: 14px; color: var(--on-table) }
.section-head .label { color: var(--on-table-2) }
@media (max-width: 980px) { .layout { grid-template-columns: minmax(0, 1fr) } .desk { position: static; max-height: none; order: -1; width: 100%; max-width: 440px; justify-self: center } }

/* ---------- desk: your phone. No paper box: objects lie on the same felt as the TV ---------- */
.desk { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); max-height: calc(100vh - 32px); overflow: auto; color: var(--on-table); overscroll-behavior: contain; scrollbar-width: thin }
.desk-head { position: sticky; top: 0; z-index: 5; display: grid; gap: 0; margin-bottom: 14px; border-radius: 10px 10px 4px 4px; overflow: hidden;
  background: linear-gradient(#34352f, #1e1f1c); box-shadow: inset 0 1px 0 rgba(255,255,255,.1), 0 10px 18px -10px rgba(0,0,0,.8) }
.bar-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 10px 9px }
.plate { margin: 0; font: 800 12px/1 var(--f-body); letter-spacing: .16em; text-transform: uppercase; color: #E9C77B; padding: 8px 12px 7px; border-radius: 3px;
  background: linear-gradient(#2a2925, #0f0f0e); border: 1px solid #000; box-shadow: inset 0 1px 0 rgba(255,255,255,.12), inset 0 0 0 2px rgba(233,199,123,.2); text-shadow: 0 -1px 0 rgba(0,0,0,.6) }
.desk-head .purse { background: rgba(0,0,0,.4) }
.desk-head .purse .coin { width: 20px; height: 20px }
.desk-body { padding: 0 4px 18px; display: grid; gap: 16px }
.desk-foot { position: sticky; bottom: 0; z-index: 5; padding: 10px; border-radius: 4px 4px 10px 10px; background: linear-gradient(#2a2b27, #171816); box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 -10px 18px -12px rgba(0,0,0,.8) }
.desk-foot .btn.back { border-color: rgba(241,233,212,.25); color: var(--on-table) }
.desk .label { color: var(--on-table-2) }
.desk .hint { color: var(--on-table-2) }
.desk .err { color: #FF8F84 }
/* timer: a strip of red tape that shortens */
.fuse { height: 7px; background: #0d0d0c; box-shadow: inset 0 2px 2px rgba(0,0,0,.6); overflow: hidden }
.fuse i { display: block; height: 100%; background: repeating-linear-gradient(-45deg, var(--red) 0 6px, #E8483D 6px 12px); transition: width .2s linear; box-shadow: 0 0 8px rgba(217,38,28,.6) }
/* paper slips for facts: who you inherited from, what got approved */
.slips { display: flex; flex-wrap: wrap; gap: 8px }
.slip { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 6px; width: max-content; max-width: 100%; background: var(--stock); color: var(--ink); padding: 6px 10px; border-radius: 2px; font: 600 12.5px/1.2 var(--f-body); box-shadow: 0 3px 6px -2px rgba(0,0,0,.5); transform: rotate(-.8deg) }
.slip + .slip { transform: rotate(.6deg) }
.slip .env-stamp { font-size: 9.5px; padding: 3px 5px; border-width: 2px; mix-blend-mode: normal }
.slip .pos { color: var(--good) } .slip .neg { color: var(--red) }
.sheet { background: var(--stock); color: var(--ink); padding: 18px 18px 20px; border-radius: 2px; box-shadow: var(--lift); transform: rotate(-.4deg) }
.sheet .label { color: var(--ink-2) } .sheet .hint { color: var(--ink-2) }
.num.big { font-size: 40px; line-height: 1 } .num.big small { font-size: 16px; color: var(--ink-3) }
/* segmented bar: a recessed tray, the chosen one is inked */
.bar3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 9px; background: rgba(0,0,0,.28); box-shadow: inset 0 2px 5px rgba(0,0,0,.5), 0 1px 0 rgba(255,255,255,.06) }
.bar3 button { border: 0; background: transparent; color: var(--on-table-2); border-radius: 6px; padding: 10px 4px; font: 900 10.5px/1.1 var(--f-body); letter-spacing: .06em; text-transform: uppercase; transition: background .18s, color .18s, transform .18s var(--bounce) }
.bar3 button:hover { color: var(--on-table) }
.bar3 button span { display: inline-block; padding: 3px 4px; border: 2px solid transparent; border-radius: 3px }
.bar3 button[aria-pressed="true"] { background: var(--stock); color: var(--ink); box-shadow: 0 2px 0 rgba(0,0,0,.35) }
.bar3 button[aria-pressed="true"] span { border-color: currentColor; transform: rotate(-3deg) }
.bar3 .s-Rec[aria-pressed="true"] { color: var(--good) } .bar3 .s-Risky[aria-pressed="true"] { color: #B4561C } .bar3 .s-Not[aria-pressed="true"] { color: var(--red) }
.bar3.small button { font-size: 10px; padding: 8px 3px; letter-spacing: .03em }
.bar3.two { grid-template-columns: repeat(2, minmax(0, 1fr)); margin-top: 10px }
.bar3 .b-ratify[aria-pressed="true"] { color: var(--good) } .bar3 .b-overrule[aria-pressed="true"] { color: var(--red) }
.memo { display: grid; gap: 8px }
.lie { display: grid; grid-template-columns: 1fr 1fr; gap: 8px }
.drop { position: relative; display: block }
.drop::after { content: "▾"; position: absolute; right: 11px; top: 50%; transform: translateY(-50%); color: var(--ink); pointer-events: none; font-size: 13px }
.drop select { appearance: none; -webkit-appearance: none; width: 100%; border: 0; border-radius: 6px; padding: 10px 30px 9px 12px; background: var(--stock); color: var(--ink); font: 800 13px/1.2 var(--f-body); box-shadow: 0 3px 0 rgba(0,0,0,.35) }
.row-l { display: flex; gap: 10px; align-items: center; flex-wrap: wrap } .row-l .drop { flex: 1; min-width: 160px }
.two-keys { display: grid; grid-template-columns: auto 1fr; gap: 10px }
.desk .btn.back { border-color: var(--table-rule); color: var(--on-table) }
.desk .btn.back:hover { background: rgba(0,0,0,.2) }
.styles .sep { width: 1px; height: 22px; background: var(--table-rule); margin-inline: 2px }
.desk .swatch { border-color: var(--baize); outline-color: rgba(0,0,0,.3) }
.desk .swatch[aria-pressed="true"] { outline: 2.5px solid var(--stock) }
.desk .trim-btn { border-color: var(--table-rule); color: var(--on-table) }
.desk .trim-btn[aria-pressed="true"] { background: var(--stock); color: var(--ink); border-color: var(--stock) }
.desk .subj-word { color: var(--ink) }
.desk .subj-word:disabled { opacity: .4 }
.preview { display: grid; padding: 4px 6px 0 }
.preview .env { min-height: 0; transform: rotate(-1deg) }
/* envelopes to pick from */
.minis { display: grid; grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); gap: 30px 12px; padding-top: 18px }
.mini { --c: var(--env-manila); position: relative; aspect-ratio: 1.42; max-width: 100%; border: 0; border-radius: 4px; background: var(--c); color: var(--ink); padding: 9px 10px 8px; text-align: left; display: grid; grid-template-rows: auto 1fr auto; gap: 2px; overflow: hidden; box-shadow: var(--lift); transition: transform .2s var(--bounce), box-shadow .2s }
.mini::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 52%; pointer-events: none;
  background: linear-gradient(to top right, transparent calc(50% - .5px), rgba(0,0,0,.12) 50%, transparent calc(50% + 1px)) left / 50% 100% no-repeat, linear-gradient(to top left, transparent calc(50% - .5px), rgba(0,0,0,.12) 50%, transparent calc(50% + 1px)) right / 50% 100% no-repeat }
.mini.c-salmon { --c: var(--env-salmon) } .mini.c-carbon { --c: var(--env-carbon) } .mini.c-mint { --c: var(--env-mint) } .mini.c-gold { --c: var(--env-gold) }
.mini.t-confidential { box-shadow: inset 0 5px 0 var(--ink), var(--lift) }
.mini.t-airmail { background-image: repeating-linear-gradient(135deg, var(--red) 0 8px, var(--c) 8px 16px, #2C46B8 16px 24px, var(--c) 24px 32px); background-size: 100% 5px; background-repeat: no-repeat; background-position: 0 100% }
.mini .mid { font: 900 30px/1 var(--f-body); letter-spacing: -.04em; position: relative }
.mini .env-stamp { position: absolute; right: 8px; top: 10px; font-size: 8.5px; padding: 3px 4px; border-width: 2px }
.mini .ms { align-self: end; font: 800 11px/1.15 var(--f-body); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden }
.mini .mg { display: flex; gap: 3px; position: absolute; left: 10px; top: 46px }
.mini .mg b, .mini .mg i { font: 900 11px/16px var(--f-body); min-width: 16px; height: 16px; text-align: center; border-radius: 2px; background: var(--stock); box-shadow: 0 1px 0 rgba(0,0,0,.2) }
.mini .mg i { background: var(--red); opacity: .55 }
.mini .mg .pos { color: var(--good) } .mini .mg .neg { color: var(--red) } .mini .mg .gold { color: var(--sunset) }
.mini .yours { position: absolute; left: 0; bottom: 0; font: 800 8.5px/1 var(--f-body); font-style: normal; letter-spacing: .1em; text-transform: uppercase; background: var(--ink); color: var(--stock); padding: 3px 6px 3px 10px; border-radius: 0 3px 0 0 }
.mini[aria-pressed="true"], .nametag[aria-pressed="true"] { transform: translateY(-5px) rotate(-1.2deg); box-shadow: 0 0 0 3px var(--gold), 0 18px 26px -12px rgba(0,0,0,.75) }
.mini.none, .nametag.none { background: transparent; box-shadow: inset 0 0 0 2px var(--table-rule); color: var(--on-table-2); display: grid; place-items: center; font: 800 12px/1.2 var(--f-body); text-transform: uppercase; letter-spacing: .08em }
.mini.none::before { display: none }
.mini.none[aria-pressed="true"], .nametag.none[aria-pressed="true"] { color: var(--on-table); box-shadow: inset 0 0 0 2px var(--gold) }
/* people to pick from: conference name tags */
.tags { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 12px }
.nametag { position: relative; border: 0; border-radius: 7px; background: #FBF8F1; color: var(--ink); padding: 0 0 8px; overflow: hidden; display: grid; text-align: center; box-shadow: var(--lift); transition: transform .2s var(--bounce), box-shadow .2s }
.nametag .hello { background: var(--red); color: #fff; font: 900 13px/1 var(--f-body); letter-spacing: .14em; text-transform: uppercase; padding: 7px 4px 5px }
.nametag .hello small { display: block; font: 700 7.5px/1.2 var(--f-body); letter-spacing: .12em; opacity: .85; margin-top: 2px }
.nametag b { font: 800 19px/1.1 var(--f-body); letter-spacing: -.02em; padding: 10px 6px 4px; overflow-wrap: anywhere; transform: rotate(-2deg) }
.nametag .nt-foot { display: flex; justify-content: center; gap: 8px; align-items: center; min-height: 14px }
.nametag .cmp { font: 800 10px/14px var(--f-body); font-style: normal; min-width: 18px; padding: 0 4px; border-radius: 7px; background: var(--ink); color: var(--stock) }
.nametag.none b { transform: none; font-size: 12px; color: inherit }
@media (prefers-reduced-motion: reduce) { .mini, .nametag { transition: none } .mini[aria-pressed="true"], .nametag[aria-pressed="true"] { transform: none } }
.tokens { display: flex; gap: 5px; align-items: center }
.tokens i { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--ink); display: block }
.tokens i.on { background: var(--ink) }
.block { display: grid; gap: 8px }
.prov { font-size: 13.5px; color: var(--ink-2); padding: 2px 0 2px 12px; border-left: 3px solid var(--red) }
.prov b { color: var(--ink) }
.btn { border: 2px solid var(--ink); background: transparent; border-radius: 6px; padding: 10px 14px; font: 800 13.5px/1 var(--f-body); color: var(--ink) }
.btn:hover:not(:disabled) { background: var(--stock-2) }
.btn.primary { background: var(--red); border-color: var(--red); color: #fff; box-shadow: 0 4px 0 var(--red-lo) }
.btn.primary:hover:not(:disabled) { background: #E8352A }
.btn.primary:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--red-lo) }
.btn:disabled { opacity: .35; cursor: not-allowed }
.btn.small { padding: 7px 10px; font-size: 12.5px; border-width: 1.5px }
.btn.wide { width: 100%; padding-block: 14px; font-size: 15px }
.cost { font: 500 11px/1 var(--f-seg); color: var(--ink-3); margin-left: 4px }

/* calculator (work) */
.calc { background: var(--housing); border-radius: 10px; padding: 10px; display: grid; gap: 10px; box-shadow: inset 0 1px 0 rgba(255,255,255,.07), 0 6px 14px -8px rgba(0,0,0,.6) }
.calc .lcd { background: var(--lcd); color: var(--lcd-ink); font-family: var(--f-seg); border-radius: 4px; padding: 6px 10px 4px; box-shadow: inset 0 2px 5px rgba(0,0,0,.35) }
.calc .ann { display: flex; justify-content: space-between; gap: 10px; font-size: 11px; letter-spacing: .12em }
.calc .ann .off { opacity: .22 }
.calc .row { display: flex; justify-content: space-between; align-items: flex-end }
.calc .val { font-size: 40px; line-height: 1; font-variant-numeric: tabular-nums }
.calc .val .ghost { opacity: .13 }
.calc .tok { font-size: 18px; line-height: 1.2; letter-spacing: .04em }
.calc .tok i { font-style: normal; opacity: .2 }
.calc .keys { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px }

/* work grid: one column per suit */
.suits { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px }
.suit-col { display: grid; gap: 7px; align-content: start; min-width: 0 }
.suit-col > .label { font-size: 10px; text-align: center; display: none }
.key, .swap, .reveal-btn { border: 0; border-radius: 6px; padding: 8px 2px 7px; font: 800 11.5px/1.15 var(--f-body); color: #fff; background: var(--key); box-shadow: 0 3px 0 #1C1D1B }
.swap { background: var(--sunset); box-shadow: 0 3px 0 #8E3F12 }
.swap[aria-pressed="true"], .reveal-btn[aria-pressed="true"] { transform: translateY(2px); box-shadow: 0 1px 0 #1C1D1B; background: var(--ink) }
.key:active:not(:disabled), .swap:active:not(:disabled), .reveal-btn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 #1C1D1B }
.key:disabled, .swap:disabled, .reveal-btn:disabled { opacity: .35; cursor: not-allowed }
.row-label { font: 700 10px/1 var(--f-body); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3) }

/* the card: suit mark, value glyph, flavour words */
.card { position: relative; background: var(--stock); color: var(--ink); border-radius: 7px; padding: 8px 8px 9px; aspect-ratio: 64 / 90; display: flex; flex-direction: column; min-width: 0;
  box-shadow: inset 0 0 0 1px rgba(0,0,0,.09), 0 1px 0 rgba(0,0,0,.18), 0 7px 14px -7px rgba(0,0,0,.55) }
.desk .card { background: #FBF6EA }
.card .hd { display: flex; align-items: center; gap: 5px; font: 800 9.5px/1 var(--f-body); letter-spacing: .08em; text-transform: uppercase }
.sp { display: inline-block; width: 9px; height: 9px; flex: none }
.s-0 .sp { background: var(--red); border-radius: 50% }
.s-1 .sp { background: var(--ink); clip-path: polygon(50% 4%, 100% 96%, 0 96%) }
.s-2 .sp { border: 2.2px solid var(--ink); border-radius: 50% }
.card .fx { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px }
.glyph { font: 900 34px/0.9 var(--f-body); letter-spacing: .04em; font-variant-numeric: tabular-nums }
.glyph.v-v { display: grid; place-items: center; width: 40px; height: 40px; border: 2px dashed var(--sunset); border-radius: 50%; color: var(--sunset); font-size: 28px; letter-spacing: 0 }
.glyph.pos { color: var(--good) } .glyph.neg { color: var(--red) } .glyph.zero { color: var(--ink) }
.card .amt { font: 700 9px/1 var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3) }
.card .word { font: 900 13px/1.02 var(--f-body); letter-spacing: -.02em; border-top: 2px solid var(--ink); padding-top: 5px; min-height: 2.1em; overflow-wrap: anywhere }
.card.spare { background: var(--stock-2); box-shadow: inset 0 0 0 1px rgba(0,0,0,.09); transform: scale(.94); opacity: .82 }
.card.dim { opacity: .45 }
.card .rev-tag { position: absolute; right: -4px; top: -7px; font: 800 8.5px/1 var(--f-body); letter-spacing: .08em; color: #fff; background: var(--ink); padding: 4px 5px; border-radius: 3px; transform: rotate(3deg) }
.sumline { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; color: var(--ink-2) }
.sumline b { font: 500 18px/1 var(--f-seg) }


/* ---------- the play area: one felt surface. Policy floats on top, coins in the tray, hand fanned below ---------- */
.desk { container-type: inline-size }
.play { --cw: 96px; padding: 12px 0 0 }
@container (max-width: 370px) { .play { --cw: 88px } }
.policy, .fan { display: flex; justify-content: center }
.policy { gap: 10px; padding-bottom: 6px }
.slot { width: var(--cw); height: calc(var(--cw) * 1.4); border-radius: 8px; position: relative; flex: none; transition: box-shadow .15s, background .15s }
/* the policy hovers: cards bob gently, their shadows breathe on the felt */
.policy .slot { animation: bob 3.4s ease-in-out infinite alternate }
.policy .slot:nth-child(2) { animation-delay: -1.1s } .policy .slot:nth-child(3) { animation-delay: -2.3s }
.policy .slot::after { content: ""; position: absolute; left: 12%; right: 12%; bottom: -12px; height: 10px; border-radius: 50%; background: rgba(0,0,0,.42); filter: blur(5px); z-index: -1; animation: breathe 3.4s ease-in-out infinite alternate; animation-delay: inherit }
@keyframes bob { from { transform: translateY(0) } to { transform: translateY(-5px) } }
@keyframes breathe { from { transform: scaleX(1); opacity: .9 } to { transform: scaleX(.82); opacity: .55 } }
.policy .slot, .policy .card { isolation: isolate }
/* the hand fans from the bottom edge */
.fan { padding: 4px 0 16px }
.fan .slot { margin-inline: -6px; transform-origin: 50% 140% }
.fan .slot:nth-child(1) { transform: rotate(-8deg) translateY(6px) }
.fan .slot:nth-child(3) { transform: rotate(8deg) translateY(6px) }
.fan .slot:nth-child(2) { z-index: 1 }
.fan .card { box-shadow: 0 10px 18px -8px rgba(0,0,0,.7) }
.fan .card.drag:hover { transform: translateY(-14px) }
.slot.ok { box-shadow: 0 0 0 2px var(--gold); background: rgba(233,162,59,.12) }
.slot.hot { box-shadow: 0 0 0 3px var(--gold), 0 0 24px rgba(233,162,59,.6); background: rgba(233,162,59,.3) }
.play .card { width: var(--cw); height: calc(var(--cw) * 1.4); aspect-ratio: auto; padding: 7px 7px 8px; background: var(--stock) }
.play .card .hd { font-size: 8.5px; gap: 4px }
.play .card .amt { display: none }
.play .card .glyph { font-size: calc(var(--cw) * .34) }
.play .card .glyph.v-v { width: calc(var(--cw) * .42); height: calc(var(--cw) * .42); font-size: calc(var(--cw) * .28) }
.play .card .word { font-size: calc(var(--cw) * .118); min-height: 2.1em }
.policy .card { box-shadow: 0 2px 0 rgba(0,0,0,.12) }
.card.drag { cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; transition: transform .18s var(--bounce), box-shadow .18s }
.policy .card.drag:hover { transform: translateY(-3px) }
.card.drag:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px }
.card.lifted { opacity: .25; transform: none !important }
.card.dragging { position: fixed; left: 0; top: 0; z-index: 50; pointer-events: none; cursor: grabbing; transition: none; box-shadow: 0 24px 40px -12px rgba(0,0,0,.7) }
.card.land { animation: land .42s var(--bounce) both }
@keyframes land { from { transform: translateY(-14px) scale(1.08) rotate(-3deg) } to { transform: none } }
.card.nope { animation: nope .35s ease both }
@keyframes nope { 20%, 60% { transform: translateX(-5px) } 40%, 80% { transform: translateX(5px) } }
/* coins: brass work tokens */
.coin { display: inline-block; width: 16px; height: 16px; border-radius: 50%; flex: none;
  background: radial-gradient(circle at 34% 30%, #FFE6AE 0 12%, #F2B64E 38%, #C47E22 72%, #8E5514);
  box-shadow: inset 0 0 0 1.5px rgba(110,52,32,.55), inset 0 0 0 3.5px rgba(255,230,174,.35), 0 1px 1.5px rgba(0,0,0,.45) }
.coin + .coin { margin-left: -6px }
.coin.spent { background: rgba(0,0,0,.28); box-shadow: inset 0 2px 3px rgba(0,0,0,.45), 0 1px 0 rgba(255,255,255,.08) }
.coins { position: absolute; right: -5px; top: -7px; display: flex; z-index: 2 }
.coins .coin { width: 18px; height: 18px }
.land .coins .coin, .shown .coins .coin:last-child { animation: drop .4s var(--bounce) both }
@keyframes drop { from { transform: translateY(-18px) scale(1.3); opacity: 0 } to { transform: none; opacity: 1 } }
.tag { position: absolute; right: -6px; top: -8px; display: flex; align-items: center; padding: 3px 4px; min-width: 24px; justify-content: center; border-radius: 12px; background: var(--ink); color: var(--stock); font: 800 12px/1 var(--f-body); box-shadow: 0 2px 4px rgba(0,0,0,.35); z-index: 2 }
.tag.back { padding: 4px 7px }
.card.broke .tag { background: var(--red) }
.card.broke .tag .coin { filter: grayscale(.6) brightness(.8) }
.eye { position: absolute; right: 7px; bottom: calc(var(--cw) * .5);  width: 18px; height: 11px; border: 2px solid var(--ink); border-radius: 50% / 60%; opacity: .2; background: radial-gradient(circle, var(--ink) 0 2px, transparent 2.5px) }
.card.shown { box-shadow: 0 0 0 3px var(--gold), 0 7px 14px -7px rgba(0,0,0,.55) }
.card.shown .eye { opacity: 1; background: radial-gradient(circle, var(--ink) 0 2.5px, var(--gold) 3px) }
/* the tray between policy and hand: coins left, worth in the middle, re-deal right */
.tray { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; padding: 12px 4px 10px }
.purse { justify-self: start; display: flex; gap: 5px; padding: 5px 7px; border-radius: 16px; background: rgba(0,0,0,.24); box-shadow: inset 0 2px 4px rgba(0,0,0,.35) }
.purse .coin { width: 22px; height: 22px; margin: 0 }
.worth { background: var(--stock); color: var(--ink); font: 400 22px/1 var(--f-seg); padding: 5px 10px 4px; border-radius: 3px; transform: rotate(-1.5deg); box-shadow: 0 3px 6px -2px rgba(0,0,0,.5); font-variant-numeric: tabular-nums }
.worth.pos { color: var(--good) } .worth.neg { color: var(--red) }
.worth small { font-size: 12px; margin-left: 2px; color: var(--sunset) }
.shred { justify-self: end; position: relative; border: 0; border-radius: 6px; padding: 8px 44px 7px 10px; font: 800 11.5px/1 var(--f-body); color: #fff; background: var(--key); box-shadow: 0 3px 0 #1C1D1B }
.shred .tag { top: 50%; right: 5px; transform: translateY(-50%); box-shadow: none; background: rgba(0,0,0,.3) }
.shred:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 #1C1D1B }
.shred:disabled { opacity: .45; cursor: not-allowed }
/* deal-in: face-down cards fly from the deck, land, then flip. Policy slides out of the inbox above, hand from the deck bottom-right */
.play .card::before { content: ""; position: absolute; inset: 0; border-radius: inherit; z-index: 3; opacity: 0; pointer-events: none;
  background: radial-gradient(circle at 50% 50%, transparent 0 16px, var(--brand) 16.5px 19px, transparent 19.5px), repeating-linear-gradient(45deg, rgba(255,255,255,.12) 0 4px, transparent 4px 9px), var(--brand);
  box-shadow: inset 0 0 0 4px var(--stock), inset 0 0 0 5px rgba(0,0,0,.2) }
.play .card::after { content: ''; position: absolute; inset: 0; z-index: 4; opacity: 0; pointer-events: none; background: var(--mark) center / 40% no-repeat }
.play.deal .slot { --d: 0s }
.play.deal .policy .slot:nth-child(2) { --d: .09s } .play.deal .policy .slot:nth-child(3) { --d: .18s }
.play.deal .fan .slot:nth-child(1) { --d: .34s } .play.deal .fan .slot:nth-child(2) { --d: .43s } .play.deal .fan .slot:nth-child(3) { --d: .52s }
.play.deal .policy .card { --fx: 0px; --fy: -150px; --fr: -6deg }
.play.deal .fan .card { --fx: 170px; --fy: 90px; --fr: 24deg }
.play.deal .policy .slot:nth-child(1) .card { --fx: 90px } .play.deal .policy .slot:nth-child(3) .card { --fx: -90px }
.play.deal .card { animation: deal-fly .8s cubic-bezier(.2,.9,.25,1.05) calc(var(--wait, 0s) + var(--d)) both }
.play.deal .card::before, .play.deal .card::after { animation: deal-back .8s linear calc(var(--wait, 0s) + var(--d)) both }
@keyframes deal-fly {
  0% { transform: translate(var(--fx), var(--fy)) rotate(var(--fr)) scale(.9); opacity: 0 }
  12% { opacity: 1 }
  55% { transform: translate(0, -6px) rotate(0) scaleX(1) scale(1.03) }
  72% { transform: translate(0, -8px) scaleX(0) scale(1.05) }
  88% { transform: translate(0, -3px) scaleX(1) scale(1.03) }
  100% { transform: none; opacity: 1 } }
@keyframes deal-back { 0%, 71.9% { opacity: 1 } 72%, 100% { opacity: 0 } }
.play.deal .tag, .play.deal .coins, .play.deal .eye { animation: pop-in .3s var(--bounce) calc(var(--wait, 0s) + var(--d) + .72s) both }
@keyframes pop-in { from { opacity: 0; transform: scale(.4) } }
.play.redeal .fan .tag, .play.redeal .fan .coins, .play.redeal .fan .eye,
.play.redeal .fan .card, .play.redeal .fan .card::before, .play.redeal .fan .card::after { animation: none }
@media (prefers-reduced-motion: reduce) { .card.land, .card.nope, .policy .slot, .policy .slot::after, .coins .coin, .play.deal .card, .play.deal .card::before, .play.deal .card::after, .play.deal .tag, .play.deal .coins, .play.deal .eye { animation: none !important } .card.drag:hover { transform: none } }

/* effect Modifiers: own value on the left, what it does to the rest on the right */
.card.has-fx { background-image: repeating-linear-gradient(-45deg, transparent 0 7px, rgba(0,0,0,.035) 7px 9px) }
/* effect Modifiers: their own value is the big mark like any card; what they do to the other two is punched on label-maker tape */
.dymo { display: inline-flex; align-items: center; gap: 4px; margin-top: 4px; padding: 4px 7px 3px; border-radius: 2px; color: #fff; transform: rotate(-3deg);
  background: repeating-linear-gradient(90deg, rgba(255,255,255,.05) 0 1px, transparent 1px 3px), var(--ink); box-shadow: 0 1px 0 rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.15) }
.dymo.fx-null { background-color: var(--red) } .dymo.fx-shield { background-color: var(--good) } .dymo.fx-flip { background-color: #B4561C }
.dymo b { font: 900 15px/1 var(--f-body); letter-spacing: -.01em; text-shadow: 0 1px 0 rgba(0,0,0,.35); margin-left: 2px }
.dymo .m0 { width: 9px; height: 9px; border-radius: 50%; background: currentColor }
.dymo .m1 { width: 10px; height: 9px; background: currentColor; clip-path: polygon(50% 0, 100% 100%, 0 100%) }
.play .card .dymo b { font-size: calc(var(--cw) * .16) }
.play .card.has-fx .glyph { font-size: calc(var(--cw) * .28) }
.env-card .eff { font-style: normal; font-size: 12px; margin-left: 3px; vertical-align: 3px }
/* stamps */
.stamps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px }
.stamp-btn { border: 2px solid var(--ink-3); background: transparent; border-radius: 4px; padding: 9px 4px; font: 900 11px/1.15 var(--f-body); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3) }
.stamp-btn:hover { color: var(--ink); border-color: var(--ink) }
.stamp-btn[aria-pressed="true"] { border-color: var(--red); color: var(--red); transform: rotate(-3deg); background: rgba(217,38,28,.06) }
.stamp-btn[data-v="Rec"][aria-pressed="true"] { border-color: var(--good); color: var(--good); background: rgba(44,106,78,.07) }
.stamp-btn[data-v="Risky"][aria-pressed="true"] { border-color: var(--sunset); color: #B4561C; background: rgba(224,115,44,.08) }

/* subject line */
.subj { display: flex; flex-wrap: wrap; gap: 6px }
.subj-word { border: 1.5px solid var(--stock-3); background: #FBF6EA; border-radius: 5px; padding: 7px 10px; font: 800 13.5px/1.2 var(--f-body); text-align: left; letter-spacing: -.01em }
.subj-word:hover { border-color: var(--ink) }
.input { width: 100%; border: 1.5px solid var(--stock-3); background: #FBF6EA; border-radius: 5px; padding: 9px 11px; font: 600 14px/1.3 var(--f-body); color: var(--ink) }
.input::placeholder { color: var(--ink-3) }
.styles { display: flex; gap: 8px; flex-wrap: wrap; align-items: center }
.swatch { width: 30px; height: 30px; border-radius: 50%; border: 3px solid var(--stock); outline: 1.5px solid var(--stock-3); padding: 0 }
.swatch[aria-pressed="true"] { outline: 2.5px solid var(--ink) }
.trim-btn { border: 1.5px solid var(--stock-3); background: transparent; border-radius: 999px; padding: 6px 11px; font: 700 12px/1 var(--f-body) }
.trim-btn[aria-pressed="true"] { background: var(--ink); color: var(--stock); border-color: var(--ink) }
.radio-list { display: grid; gap: 6px }
.radio { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border: 1.5px solid var(--stock-3); border-radius: 6px; background: #FBF6EA; text-align: left; width: 100%; font-weight: 700 }
.radio:hover { border-color: var(--ink-3) }
.radio[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 4px 0 0 var(--red) }
.radio .sub { font-size: 12.5px; color: var(--ink-2); font-weight: 500 }
.radio .grow { flex: 1; min-width: 0 }
.pill { font: 800 10px/1 var(--f-body); letter-spacing: .07em; text-transform: uppercase; padding: 4px 6px; border-radius: 3px; border: 1.5px solid currentColor; white-space: nowrap }
.pill.red { color: var(--red) } .pill.green { color: var(--good) } .pill.blue { color: #2C46B8 } .pill.gold { color: #B4561C } .pill.grey { color: var(--ink-3) }
.hint { font-size: 12.5px; color: var(--ink-2) }
.err { color: var(--red); font-size: 13px; font-weight: 700 }

/* letter */
.letter { display: grid; gap: 12px; font-size: 14.5px }
.letter .role { font: 900 38px/.95 var(--f-body); letter-spacing: -.035em }
.letter .role.sab { color: var(--red) }
.letter .role.loyal { color: var(--good) }
.sig { font: italic 500 14px/1.3 var(--f-body); color: var(--ink-2) }

/* ---------- envelopes ---------- */
.envs { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 18px }
.env { --c: var(--env-manila); position: relative; background: var(--c); color: var(--ink); border-radius: 5px; padding: 12px 14px 14px; box-shadow: var(--lift); display: grid; gap: 9px; align-content: start; min-height: 200px; text-align: left; border: 0; width: 100%; min-width: 0; overflow: hidden; transition: transform .25s var(--bounce) }
.env::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 74px; background: linear-gradient(rgba(0,0,0,.07), rgba(0,0,0,.07)), var(--c); clip-path: polygon(0 0, 100% 0, 50% 100%); pointer-events: none }
.env > * { position: relative }
button.env:hover { transform: translateY(-3px) rotate(-.4deg) }
.env.c-salmon { --c: var(--env-salmon) } .env.c-carbon { --c: var(--env-carbon) } .env.c-mint { --c: var(--env-mint) } .env.c-gold { --c: var(--env-gold) }
.env.t-airmail { box-shadow: inset 0 0 0 6px transparent, var(--lift); background-image: repeating-linear-gradient(135deg, var(--red) 0 10px, var(--c) 10px 20px, #2C46B8 20px 30px, var(--c) 30px 40px); background-size: 100% 7px; background-repeat: no-repeat; background-position: 0 100% }
.env.t-confidential { padding-top: 26px }
.env.t-confidential::after { content: "CONFIDENTIAL"; position: absolute; left: 0; right: 0; top: 0; font: 900 9px/16px var(--f-body); letter-spacing: .32em; text-align: center; color: #fff; background: var(--ink); pointer-events: none }
.env.sel { outline: 3px solid var(--gold); outline-offset: 3px; transform: translateY(-3px) }
.env.approved { outline: 3px solid var(--stock); outline-offset: 3px }
.env.faded { opacity: .5; filter: saturate(.6) }
.env-top { display: flex; align-items: flex-start; gap: 8px; min-height: 52px }
.env-id { font: 900 26px/1 var(--f-body); letter-spacing: -.03em }
.env-kind { font: 800 9px/1.15 var(--f-body); letter-spacing: .12em; text-transform: uppercase; opacity: .55; margin-top: 3px }
.clasp { position: absolute !important; left: 50%; top: 52px; width: 34px; height: 34px; margin-left: -17px; border-radius: 50%; background: radial-gradient(circle at 38% 32%, var(--brand-hi), var(--brand) 45%, var(--brand-lo)); box-shadow: 0 2px 5px rgba(0,0,0,.4) }
.clasp::after { content: ''; position: absolute; inset: 0; opacity: .85; background: var(--mark) center / 58% no-repeat }
.env.approved .clasp, .env.audited .clasp { background: radial-gradient(circle at 38% 32%, var(--brand-hi), var(--brand) 45%, var(--brand-lo)); clip-path: polygon(0 0, 46% 0, 54% 40%, 44% 60%, 52% 100%, 0 100%); transform: translateX(-3px) rotate(-8deg) }
.env-subj { font: 800 15px/1.2 var(--f-body); letter-spacing: -.015em; min-height: 36px; overflow-wrap: anywhere; margin-top: 30px }
.env-route { display: grid; gap: 4px; font: 600 11px/1.2 var(--f-body) }
.env-route div { display: grid; grid-template-columns: 40px 1fr; align-items: center; gap: 6px; border-bottom: 1px solid rgba(0,0,0,.35); padding-bottom: 3px }
.env-route span { letter-spacing: .1em; text-transform: uppercase; font-size: 9.5px; font-weight: 800; opacity: .55 }
.redact { display: block; height: 9px; width: 70%; background: var(--ink); opacity: .8 }
.env-stamp { justify-self: start; font: 900 11px/1 var(--f-body); letter-spacing: .08em; text-transform: uppercase; padding: 5px 7px; border: 2.5px solid currentColor; border-radius: 3px; transform: rotate(-4deg); mix-blend-mode: multiply }
.env-stamp.Rec { color: var(--good) } .env-stamp.Risky { color: #B4561C } .env-stamp.Not { color: var(--red) }
.radio .env-stamp { mix-blend-mode: normal }
.env-cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 5px }
.env-card { display: grid; gap: 3px; align-content: start; background: #FBF6EA; border-radius: 4px; padding: 5px 5px 6px; box-shadow: 0 1px 0 rgba(0,0,0,.15); min-width: 0; text-align: center }
.env-card b { font: 900 20px/1 var(--f-body); letter-spacing: .04em }
.env-card b.gold { color: var(--sunset) } .env-card b.zero { color: var(--ink) }
.env-card .w { font: 700 9.5px/1.1 var(--f-body); color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.env-card.hidden { background: var(--brand); box-shadow: inset 0 0 0 2px #FBF6EA, 0 1px 0 rgba(0,0,0,.15); color: var(--brand-ink) }
.env-card.hidden .w { color: rgba(255,255,255,.8) }
.env-card.hidden b { color: #fff; opacity: .5 }
.env-tags { display: flex; gap: 5px; flex-wrap: wrap }
.env-tags .pill { background: rgba(251,246,234,.6) }
.big-stamp { position: absolute !important; right: 12px; top: 14px; text-transform: uppercase; font: 900 16px/1 var(--f-body); letter-spacing: .04em; color: var(--red); border: 3.5px solid var(--red); padding: 6px 10px; transform: rotate(-9deg); border-radius: 4px; mix-blend-mode: multiply; animation: thump .55s cubic-bezier(.2,.9,.3,1.3) both }
.big-stamp.no-anim { animation: none }
@keyframes thump { from { transform: rotate(-20deg) scale(2.4); opacity: 0 } to { transform: rotate(-9deg) scale(1); opacity: 1 } }
.env-dbg { font: 500 11px/1.4 var(--f-seg); background: rgba(20,20,20,.88); color: var(--stock); padding: 6px 8px; border-radius: 3px }
.placeholder { border: 2px dashed var(--table-rule); border-radius: 5px; min-height: 200px; display: grid; place-items: center; color: var(--on-table-2); font: 700 13px/1.4 var(--f-body); text-align: center; padding: 12px }
@media (max-width: 720px) { .placeholder { min-height: 64px } .placeholder.sealed { min-height: 112px; padding-top: 70px } .stamp-btn { font-size: 10px; letter-spacing: .02em } }
.placeholder.sealed { border: 0; background: var(--env-manila); color: var(--ink); box-shadow: var(--lift); position: relative; overflow: hidden }
.placeholder.sealed::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 74px; background: rgba(0,0,0,.07); clip-path: polygon(0 0, 100% 0, 50% 100%) }
.placeholder.sealed::after { content: ''; position: absolute; left: 50%; top: 52px; width: 34px; height: 34px; margin-left: -17px; border-radius: 50%; background: var(--mark) center / 56% no-repeat, radial-gradient(circle at 38% 32%, var(--brand-hi), var(--brand) 45%, var(--brand-lo)); box-shadow: 0 2px 5px rgba(0,0,0,.4) }

/* ---------- paper on the table: bulletin board, ledger tape, staff ---------- */
.feed { display: grid; background: var(--stock); color: var(--ink); border-radius: 4px; box-shadow: var(--lift); position: relative }
.feed-item { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 10px; padding: 10px 16px; border-top: 1px solid var(--stock-3); font-size: 14px }
.feed-item:first-child { border-top: 0 }
.feed-item .q { font: 800 11px/20px var(--f-body); color: var(--ink-3) }

<style>
/* suits are colours, not symbols: Action cobalt, Target mustard, Modifier plum (red and green stay for profit) */
:root { --suit-0: #2C46B8; --suit-1: #C98A10; --suit-2: #7A4A8C }
.s-0 { --suit: var(--suit-0) } .s-1 { --suit: var(--suit-1) } .s-2 { --suit: var(--suit-2) }
.card .hd { margin: -8px -8px 0; padding: 6px 8px 5px; background: var(--suit); color: #fff; border-radius: 7px 7px 0 0; box-shadow: inset 0 -2px 0 rgba(0,0,0,.15) }
.play .card .hd { margin: -7px -7px 0; padding: 6px 7px 5px }
.card .hd .sp { display: none }
.card .word { border-top-color: var(--suit) }
.env-card { box-shadow: inset 0 3px 0 var(--suit), 0 1px 0 rgba(0,0,0,.15); padding-top: 7px }
.env-card.hidden { box-shadow: inset 0 0 0 2px #FBF6EA, inset 0 5px 0 var(--suit), 0 1px 0 rgba(0,0,0,.15) }
/* effect tape: two chips in the colours of the cards it rewrites */
.dymo .m0, .dymo .m1 { width: 11px; height: 14px; border-radius: 2px; clip-path: none; box-shadow: 0 0 0 1.5px rgba(255,255,255,.85) }
.dymo .m0 { background: var(--suit-0) } .dymo .m1 { background: var(--suit-1); margin-left: 2px }
.mini .peek > * { box-shadow: inset 0 3px 0 var(--suit, transparent), 0 1px 2px rgba(0,0,0,.4) }
</style>
<style>
/* ---------- Work screen, one material: cream paper on felt, brass coins, red only for ink and the main key ---------- */
:root { --suit-0: #4A6BB0; --suit-1: #C29433; --suit-2: #8A6A9C }
/* suit is a small colour tab, not a header band */
.card .hd { margin: 0; padding: 0; background: none; color: var(--ink-2); box-shadow: none; border-radius: 0 }
.play .card .hd { margin: 0; padding: 0 }
.card .hd .sp { display: inline-block; width: 8px; height: 8px; border: 0; border-radius: 2px; clip-path: none; background: var(--suit) }
.card .word { border-top-color: var(--ink) }
.card { box-shadow: inset 0 3px 0 var(--suit), 0 1px 0 rgba(0,0,0,.12), 0 8px 16px -10px rgba(0,0,0,.6) }
.card.shown { box-shadow: inset 0 3px 0 var(--suit), 0 0 0 3px var(--gold), 0 7px 14px -7px rgba(0,0,0,.55) }
.fan .card { box-shadow: inset 0 3px 0 var(--suit), 0 10px 18px -8px rgba(0,0,0,.7) }
.policy .card { box-shadow: inset 0 3px 0 var(--suit), 0 2px 0 rgba(0,0,0,.12) }
/* the same card everywhere: the hand only leans a little */
.fan .slot { margin-inline: 4px }
.fan .slot:nth-child(1) { transform: rotate(-4deg) translateY(3px) }
.fan .slot:nth-child(3) { transform: rotate(4deg) translateY(3px) }
.fan .slot { transform-origin: 50% 100% }
/* coins are coins: no dark rings */
.tag { background: none; box-shadow: none; padding: 0; min-width: 0; right: -7px; top: -8px }
.tag .coin, .coins .coin { width: 20px; height: 20px }
.tag.back { width: 22px; height: 22px; border-radius: 50%; background: var(--stock); color: var(--ink); font-size: 12px; display: grid; place-items: center; box-shadow: 0 1px 3px rgba(0,0,0,.4) }
.card.broke .tag { background: none } .card.broke .tag .coin { filter: grayscale(1) brightness(.75); opacity: .7 }
/* adding-machine tape between the policy and the hand */
.tape { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 0; margin: 14px 2px 12px; background: var(--stock); color: var(--ink); border-radius: 2px; box-shadow: 0 1px 0 rgba(0,0,0,.15), 0 8px 14px -10px rgba(0,0,0,.6); transform: rotate(-.5deg);
  -webkit-mask-image: radial-gradient(circle at 50% 0, transparent 2.5px, #000 3px) 0 0 / 9px 100%, linear-gradient(#000, #000); mask-image: none }
.tape > * { padding: 8px 10px 7px; min-width: 0 }
.t-src { font: 700 11.5px/1.2 var(--f-body); color: var(--ink-2); display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center }
.t-src b { color: var(--ink) }
.t-src .env-stamp { font-size: 8.5px; padding: 2px 4px; border-width: 1.5px }
.t-worth { font: 400 24px/1 var(--f-seg); border-inline: 1.5px dashed rgba(20,20,20,.2); padding-inline: 14px; font-variant-numeric: tabular-nums }
.t-worth.pos { color: var(--good) } .t-worth.neg { color: var(--red) } .t-worth small { font-size: 11px; color: var(--sunset); margin-left: 2px }
.t-redeal { justify-self: end; display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; color: var(--ink); font: 800 11.5px/1 var(--f-body); cursor: pointer }
.t-redeal:hover:not(:disabled) { text-decoration: underline }
.t-redeal:disabled { color: var(--ink-3); cursor: not-allowed }
.t-redeal:disabled .coin { filter: grayscale(1); opacity: .5 }
.t-cost { display: inline-flex } .t-cost .coin { width: 16px; height: 16px }
/* every pick-one bar (stamps, Ratify/Overrule) is the same paper strip: the chosen one inked, the rest ghosts */
.bar3 { background: var(--stock); box-shadow: 0 1px 0 rgba(0,0,0,.15), 0 8px 14px -10px rgba(0,0,0,.6); border-radius: 2px; padding: 6px; transform: rotate(.4deg) }
.bar3 button { color: rgba(20,20,20,.32); background: none; padding: 8px 2px }
.bar3 button span { border: 2px dashed rgba(20,20,20,.18); border-radius: 3px; padding: 4px 5px }
.bar3 button:hover { color: var(--ink-2) }
.bar3 button[aria-pressed="true"] { background: none; box-shadow: none }
.bar3 button[aria-pressed="true"] span { border-style: solid; border-color: currentColor; transform: rotate(-4deg); mix-blend-mode: multiply }
/* the header keeps its rail; nothing else on the screen is dark */
.desk-head .purse { background: rgba(0,0,0,.35) }
</style>
<style>
/* phones: the desk scrolls with the page (this has to come after the desk's own sticky rule) */
@media (max-width: 980px) { .desk { position: static; max-height: none; overflow: visible } }
</style>
<style>
/* company logo marks: the noun pictogram from the charter, on every brand object */
.mk { width: 60%; height: 60%; display: block; fill: currentColor }
.mk .s { fill: none; stroke: currentColor; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round }
.logo-mark .mk { width: 62%; height: 62% }
.env-card.hidden b { display: grid; place-items: center; height: 20px; opacity: .7 } .env-card.hidden .mk { width: 20px; height: 20px }
.mini .peek i { display: grid; place-items: center; padding: 0 } .mini .peek i .mk { width: 16px; height: 16px; color: var(--brand-ink); opacity: .85 }

/* picking an envelope. Phone: the chosen one lifts, the rest fall away, three sealed cards rise out of it */
.minis.picking .mini:not(.chosen) { animation: miniAway .45s ease both }
.mini.chosen { z-index: 5; animation: miniLift .55s var(--bounce) both }
.mini.chosen::before { transform-origin: 50% 0; animation: flapOpen .35s ease .3s both }
.mini .pull { position: absolute; left: 50%; top: 18%; width: 30px; height: 42px; margin-left: -15px; border-radius: 3px; z-index: -1; pointer-events: none;
  background: var(--mark) center / 58% no-repeat, var(--brand); box-shadow: inset 0 0 0 2px var(--stock), 0 2px 5px rgba(0,0,0,.45);
  animation: pullOut .5s var(--bounce) calc(.45s + var(--k) * .1s) both }
.mini .pull[style*="--k:0"] { --x: -34px; --r: -14deg } .mini .pull[style*="--k:1"] { --x: 0px; --r: 0deg } .mini .pull[style*="--k:2"] { --x: 34px; --r: 14deg }
@keyframes miniAway { to { transform: translateY(14px) scale(.94); opacity: .2; filter: saturate(.4) } }
@keyframes miniLift { from { transform: translateY(-5px) rotate(-1.2deg) } to { transform: translateY(-16px) rotate(-2.5deg) scale(1.08) } }
@keyframes flapOpen { to { transform: scaleY(.12); opacity: .6 } }
@keyframes pullOut { from { transform: translateY(14px); opacity: 0 } to { transform: translate(var(--x), -62px) rotate(var(--r)); opacity: 1 } }
/* TV: the nominee is pulled from the pile; the approved one opens and its cards slide out. Both wait for the stripe wipe */
.env.pick { z-index: 2; animation: envPick .7s var(--bounce) 1.15s both }
.env.fall { animation: envFall .5s ease 1.1s both }
.env.pull::before { transform-origin: 50% 0; animation: flapOpen .4s ease 1.15s both }
.env.pull .env-card { animation: cardOut .5s var(--bounce) both }
.env.pull .env-card:nth-child(1) { animation-delay: 1.45s } .env.pull .env-card:nth-child(2) { animation-delay: 1.57s } .env.pull .env-card:nth-child(3) { animation-delay: 1.69s }
.env.pull .big-stamp { animation-delay: 2.1s }
@keyframes envPick { 0% { transform: none } 45% { transform: translateY(-18px) rotate(-2deg) scale(1.04) } 100% { transform: translateY(-4px) rotate(-.6deg) } }
@keyframes envFall { from { opacity: 1; filter: none; transform: none } to { transform: translateY(6px) } }
@keyframes cardOut { from { transform: translateY(-46px) scale(.7) rotate(-6deg); opacity: 0 } to { transform: none; opacity: 1 } }
@media (prefers-reduced-motion: reduce) { .env.pick, .env.fall, .env.pull::before, .env.pull .env-card { animation: none } }

/* Colour cards (a variant to compare): the whole card is its suit, the word sits on top, no suit label.
   An effect Modifier's tape carries chips in the colours of the cards it rewrites, so it reads against the table */
[data-cards="colour"] .card { background: var(--suit); color: var(--suit-on, #FBF6EA);
  background-image: linear-gradient(rgba(255,255,255,.1), rgba(0,0,0,.08)), repeating-linear-gradient(-45deg, transparent 0 7px, rgba(255,255,255,.035) 7px 9px);
  box-shadow: inset 0 0 0 3px rgba(251,246,234,.9), inset 0 0 0 4px rgba(0,0,0,.12), 0 1px 0 rgba(0,0,0,.12), 0 8px 16px -10px rgba(0,0,0,.6) }
[data-cards="colour"] .s-1 { --suit-on: #241A06 }
[data-cards="colour"] .card .hd, [data-cards="colour"] .card .amt { display: none }
[data-cards="colour"] .card .word { order: -1; border: 0; padding: 3px 2px 0; min-height: 0; color: inherit; text-wrap: balance }
[data-cards="colour"] .card .fx { gap: 6px }
[data-cards="colour"] .play .card .word { font-size: calc(var(--cw) * .135); line-height: 1 }
[data-cards="colour"] .card .glyph { display: grid; place-items: center; min-width: 58%; aspect-ratio: 1.3; padding: 0 6px; border-radius: 50%; background: #FBF6EA; box-shadow: inset 0 -2px 0 rgba(0,0,0,.12), 0 2px 3px rgba(0,0,0,.25); transform: rotate(-4deg) }
[data-cards="colour"] .card .glyph.v-v { width: auto; height: auto; border: 0; aspect-ratio: 1.3; font-size: inherit }
[data-cards="colour"] .play .card .glyph.v-v { font-size: calc(var(--cw) * .3) }
[data-cards="colour"] .card .dymo .m0, [data-cards="colour"] .card .dymo .m1 { box-shadow: 0 0 0 1.5px #FBF6EA }
[data-cards="colour"] .card.spare { opacity: .7 }
[data-cards="colour"] .env-card:not(.hidden) { background: var(--suit); color: var(--suit-on, #FBF6EA); box-shadow: inset 0 0 0 2px rgba(251,246,234,.9), 0 1px 0 rgba(0,0,0,.15); display: flex; flex-direction: column-reverse; gap: 4px }
[data-cards="colour"] .env-card:not(.hidden) .w { color: inherit; font-weight: 800 }
[data-cards="colour"] .env-card:not(.hidden) b { align-self: center; background: #FBF6EA; border-radius: 50%; padding: 3px 9px 2px; box-shadow: 0 1px 2px rgba(0,0,0,.25) }
[data-cards="colour"] .mini .peek b { box-shadow: inset 0 0 0 4px var(--suit), 0 1px 2px rgba(0,0,0,.4); padding-top: 6px }
</style>
