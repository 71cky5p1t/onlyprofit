<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Location Scenes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@800..900&family=Schibsted+Grotesk:wght@400..900&family=Share+Tech+Mono&family=Courier+Prime:wght@700&display=swap">
<style>
/*SCENES_CSS*/
:root { --baize: #35574A; --baize-hi: #46705F; --baize-lo: #284338; --stock: #F1E9D4; --stock-2: #E7DCC0; --ink: #141414; --ink-2: #4E4A40; --ink-3: #857D6B; --red: #D9261C; --manila: #E5D3A4; --f: "Schibsted Grotesk", system-ui, sans-serif }
* { box-sizing: border-box }
html { background: var(--baize-lo) }
body { margin: 0; min-height: 100vh; color: var(--stock); font: 15px/1.45 var(--f); -webkit-font-smoothing: antialiased;
  background: radial-gradient(90% 70% at 40% 0%, var(--baize-hi), var(--baize) 45%, var(--baize-lo) 100%) no-repeat, var(--baize-lo) }
.wrap { max-width: 1280px; margin: 0 auto; padding: 28px 16px 64px }
.tv { position: relative; border-radius: 18px; padding: 12px; background: linear-gradient(#2a2a30, #18181c); box-shadow: 0 2px 0 rgba(255,255,255,.06) inset, 0 30px 60px -24px rgba(0,0,0,.7), 0 8px 18px -10px rgba(0,0,0,.6) }
.tv .ops-stage { border-radius: 8px }
/* company name tag after the reveal */
.tag { position: absolute; left: 34px; top: 30px; z-index: 3; display: flex; flex-direction: column; gap: 2px; padding: 12px 18px 12px 16px; border-radius: 6px;
  background: var(--stock); color: var(--ink); box-shadow: 0 10px 24px -12px rgba(0,0,0,.7); transform-origin: 0 0; transition: transform .6s var(--bounce, cubic-bezier(.34,1.56,.64,1)) .5s, opacity .3s .5s }
.tag b { font: 900 clamp(16px, 2.4vw, 28px)/1 Nunito, var(--f); letter-spacing: -.01em; color: var(--brand) }
.tag i { font: 700 12px/1.2 var(--f); font-style: normal; color: var(--ink-2) }
.clock { position: absolute; right: 34px; top: 30px; z-index: 3; font: 700 13px/1 "Share Tech Mono", monospace; letter-spacing: .06em; padding: 8px 10px; border-radius: 4px; background: rgba(12,10,24,.55); color: #fff6dc; backdrop-filter: blur(6px) }
/* the sealed file over the scene before round zero ends */
.file { position: absolute; inset: 12px; z-index: 4; border-radius: 8px; overflow: hidden; pointer-events: none; display: grid; place-items: center;
  background: repeating-linear-gradient(0deg, rgba(0,0,0,.025) 0 2px, transparent 2px 5px), var(--manila); color: #5c4a2a; transition: transform .9s cubic-bezier(.7,0,.3,1), opacity .2s .8s }
.file::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 22%; background: rgba(120,90,40,.08); clip-path: polygon(0 0, 30% 0, 34% 100%, 0 100%) }
.file .q { font: 900 clamp(22px, 5vw, 64px)/1 Nunito, var(--f); letter-spacing: -.02em; text-align: center }
.file .q span { background: #1c1a24; color: transparent; border-radius: 3px; padding: 0 .3em }
.file .stamp { margin-top: 18px; font: 700 clamp(12px, 1.6vw, 18px)/1 "Courier Prime", monospace; letter-spacing: .2em; color: var(--red); border: 3px solid var(--red); padding: 8px 14px; transform: rotate(-4deg); opacity: .85 }
.sealed .file { transform: none }
.open .file { transform: translateY(104%); opacity: 0 }
.sealed .tag { transform: scale(.6) rotate(-6deg); opacity: 0 }

.controls { display: flex; flex-wrap: wrap; gap: 18px 28px; align-items: flex-end; justify-content: space-between; margin: 22px 4px 0 }
.tabs { display: flex; flex-wrap: wrap; gap: 6px }
.tabs button { border: 0; padding: 9px 12px 8px; border-radius: 5px 5px 2px 2px; background: var(--stock-2); color: var(--ink-2); font: 800 12px/1 var(--f); letter-spacing: .02em;
  box-shadow: inset 0 -3px 0 var(--sw), 0 4px 10px -6px rgba(0,0,0,.6); transition: transform .15s, background .15s }
.tabs button:hover { transform: translateY(-2px) }
.tabs button[aria-pressed="true"] { background: var(--stock); color: var(--ink); transform: translateY(-4px); box-shadow: inset 0 -5px 0 var(--sw), 0 8px 16px -8px rgba(0,0,0,.7) }
.dial { display: flex; gap: 4px; padding: 5px; border-radius: 999px; background: rgba(0,0,0,.22); box-shadow: inset 0 1px 3px rgba(0,0,0,.35) }
.dial button { border: 0; width: 44px; height: 32px; border-radius: 999px; background: transparent; display: grid; place-items: center; transition: background .2s }
.dial button svg { width: 22px; height: 22px }
.dial button[aria-pressed="true"] { background: var(--stock); box-shadow: 0 2px 6px -2px rgba(0,0,0,.6) }
.acts { display: flex; gap: 8px }
.acts button { border: 0; padding: 9px 14px; border-radius: 999px; background: rgba(241,233,212,.12); color: var(--stock); font: 700 12px/1 var(--f); letter-spacing: .04em }
.acts button:hover { background: rgba(241,233,212,.22) }
.acts button[aria-pressed="true"] { background: var(--stock); color: var(--ink) }
h2 { font: 900 13px/1 var(--f); letter-spacing: .14em; text-transform: uppercase; color: rgba(241,233,212,.6); margin: 56px 4px 16px }
.sheet { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px }
.card { margin: 0; background: var(--stock); border-radius: 8px; padding: 6px 6px 8px; box-shadow: 0 1px 0 rgba(0,0,0,.18), 0 10px 20px -14px rgba(0,0,0,.7); color: var(--ink) }
.card svg { display: block; width: 100%; aspect-ratio: 1; border-radius: 5px; background: linear-gradient(#cfe6f6 0 68%, #9ccc7c 68%) }
.card figcaption { display: flex; justify-content: space-between; gap: 6px; padding: 6px 4px 0; font: 800 11px/1.2 var(--f) }
.card figcaption span { color: var(--ink-3); font-weight: 600 }
.night .card svg { background: linear-gradient(#1a2150 0 68%, #2a3a40 68%) }
@media (max-width: 640px) { .tag { left: 22px; top: 20px; padding: 8px 12px } .clock { right: 22px; top: 20px } .dial button { width: 36px } }
</style>
<div class="wrap">
  <div class="tv sealed" id="tv">
    <div id="stage"></div>
    <div class="tag" id="tag"><b></b><i></i></div>
    <div class="clock" id="clock"></div>
    <div class="file" aria-hidden="true"><div><div class="q">Company: <span>Eternal Rest</span></div><div class="stamp">TO BE ANNOUNCED</div></div></div>
  </div>
  <div class="controls">
    <div class="tabs" id="tabs" role="group" aria-label="Location"></div>
    <div class="dial" id="dial" role="group" aria-label="Time of day"></div>
    <div class="acts"><button id="reveal">Reveal</button><button id="cycle" aria-pressed="false">Run the day</button><button id="shuffle">Reseed</button></div>
  </div>
  <h2>Props</h2>
  <div class="sheet" id="sheet"></div>
</div>
<script>
/*SCENES_JS*/
</script>
