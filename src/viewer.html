<title>Only Profit Screens</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400..900&family=Share+Tech+Mono&display=swap">
<style>
/* Layout: one spread per moment in the game, a TV and a phone side by side on the felt, in play order; no captions */
:root {
  --felt: #284338; --felt-hi: #3B6152; --paper: #F1E9D4; --paper-2: rgba(241,233,212,.62); --rule: rgba(241,233,212,.16);
  --ink: #141414; --red: #D9261C; --gold: #E9A23B; --bezel: #111312;
  --f-body: "Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif;
  --f-seg: "Share Tech Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box }
body { margin: 0; background: radial-gradient(80% 50% at 30% 0%, var(--felt-hi), var(--felt) 70%) no-repeat, var(--felt); color: var(--paper); font: 15px/1.5 var(--f-body); -webkit-font-smoothing: antialiased }
.wrap { max-width: 1240px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; padding-block: 12px 10px; display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; justify-content: space-between; background: linear-gradient(var(--felt) 70%, rgba(40,67,56,0)) }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--felt) }
.brands { display: flex; flex-wrap: wrap; gap: 6px; flex: 1 1 auto; min-width: 0 }
.brands button { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--rule); background: rgba(0,0,0,.2); color: var(--paper); border-radius: 16px; padding: 6px 11px 6px 7px; font: 800 12px/1 var(--f-body); cursor: pointer }
.brands button i { width: 14px; height: 14px; border-radius: 50%; background: var(--c); box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.35) }
.brands button[aria-pressed="true"] { background: var(--paper); color: var(--ink); border-color: var(--paper) }
.brands.sets { width: auto; margin-left: auto } .sets button i { border-radius: 2px; width: 10px; height: 14px; background: var(--stock, #F1E9D4) }
.sets button i.colour { background: linear-gradient(90deg, #3F63B8 0 33%, #C9A227 33% 66%, #8A5FA8 66%); width: 18px }
.brands button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px }
.brand { display: flex; align-items: center; gap: 12px }
.seal { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; background: radial-gradient(circle at 38% 32%, #EF4A37, var(--red) 45%, #8E160F); color: rgba(255,255,255,.82); font: 900 14px/1 var(--f-body); letter-spacing: -.04em; box-shadow: 0 2px 6px rgba(0,0,0,.5) }
.brand b { display: block; font: 900 24px/1 var(--f-body); letter-spacing: -.03em }
.brand small { display: block; margin-top: 4px; font: 700 11px/1 var(--f-body); letter-spacing: .12em; text-transform: uppercase; color: var(--paper-2) }
nav.jump { display: flex; flex-wrap: wrap; gap: 6px }
nav.jump a { color: var(--paper); text-decoration: none; font: 700 12px/1 var(--f-body); padding: 7px 10px; border-radius: 14px; border: 1px solid var(--rule) }
nav.jump a:hover, nav.jump a:focus-visible { background: var(--paper); color: var(--ink); outline: none }
main { display: grid; gap: 8px; padding-block: 12px 80px }
.spread { display: grid; gap: 10px; padding-block: 18px; border-top: 1px solid var(--rule); scroll-margin-top: 130px }
.side { display: flex; gap: 8px; align-items: center }
.tab { display: inline-flex; width: max-content; border-radius: 4px; overflow: hidden; font: 800 12px/1 var(--f-body); letter-spacing: .08em; text-transform: uppercase; box-shadow: 0 2px 0 rgba(0,0,0,.25) }
.tab b { background: var(--red); color: #fff; padding: 7px 8px }
.tab span { background: var(--paper); color: var(--ink); padding: 7px 10px }
.side p { margin: 0; color: var(--paper-2); font-size: 14px; max-width: 26ch }
.replay { border: 0; border-radius: 6px; padding: 6px 9px 5px; background: #4A4B47; color: #fff; font: 800 12px/1 var(--f-body); box-shadow: 0 3px 0 #1C1D1B; cursor: pointer }
.replay:active { transform: translateY(2px); box-shadow: 0 1px 0 #1C1D1B }
.replay:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px }
.stage { display: flex; gap: 28px; align-items: flex-start; min-width: 0 }
/* devices: a TV on a stand, a phone in a hand-sized bezel */
.tv { flex: 1 1 auto; min-width: 0; display: grid; justify-items: center }
.tv .screen { width: 100%; aspect-ratio: 16 / 10; max-width: 100%; background: var(--bezel); border-radius: 10px; padding: 10px; box-shadow: 0 0 0 1px rgba(255,255,255,.06), 0 30px 50px -24px rgba(0,0,0,.8) }
.tv .stand { width: 22%; height: 16px; background: linear-gradient(#1a1c1b, #0b0c0c); clip-path: polygon(18% 0, 82% 0, 100% 100%, 0 100%) }
.phone { flex: none; width: 322px; background: var(--bezel); border-radius: 38px; padding: 14px 9px; box-shadow: 0 0 0 1px rgba(255,255,255,.08), 0 30px 50px -24px rgba(0,0,0,.8); position: relative }
.phone::before { content: ""; position: absolute; top: 6px; left: 50%; width: 70px; height: 4px; margin-left: -35px; border-radius: 3px; background: #2a2d2b }
.phone .screen { height: 640px; border-radius: 28px }
.screen { position: relative; overflow: hidden }
.vp { position: absolute; inset: 0; overflow: hidden; border-radius: inherit; background: #35574A }
.tv .vp { inset: 10px; border-radius: 3px }
.vp iframe { border: 0; transform-origin: 0 0; position: absolute; left: 0; top: 0; background: #35574A }
.vp .wait { position: absolute; inset: 0; display: grid; place-items: center; font: 400 14px/1 var(--f-seg); letter-spacing: .1em; color: var(--paper-2); background: #35574A; transition: opacity .25s }
.vp.live .wait { opacity: 0; pointer-events: none }
.only-tv .phone, .only-phone .tv { display: none }
.only-phone .stage { justify-content: flex-start }
/* the parts sheet */
.kit iframe { width: 100%; border: 0; border-radius: 10px; display: block; background: #35574A; min-height: 300px }
@media (max-width: 860px) {
  .stage { flex-direction: column-reverse; align-items: center }
  .tv { width: 100% }
}
@media (max-width: 380px) { .phone { width: 100%; } }
@media (prefers-reduced-motion: reduce) { .vp .wait { transition: none } }
</style>

<div class="wrap">
  <header class="top">
    <div class="brand"><span class="seal" aria-hidden="true">OP</span><div><b>Only Profit</b><small>Every screen · build 0.3</small></div></div>
    <nav class="jump" id="jump" aria-label="Jump to a screen"></nav>
    <div class="brands" id="brands" role="group" aria-label="Company"></div>
    <div class="brands sets" id="cardsets" role="group" aria-label="Card style"></div>
  </header>
  <main id="main"></main>
</div>

<script type="application/json" id="proto">/*PROTO*/</script>
<script>
(() => {
  const PROTO = JSON.parse(document.getElementById('proto').textContent);
  const SEED = 5, PLAYERS = 6;
  // The TV shows the shared board; the phone shows only your own desk.
  const TV_CSS = '.desk{display:none!important}.layout{grid-template-columns:minmax(0,1fr)!important}';
  const PHONE_CSS = '.board,.mast{display:none!important}.layout{padding-block:10px 30px!important}.wrap{padding-inline:8px!important}.desk{position:static!important;max-height:none!important;max-width:none!important}';
  const SPREADS = [
    { id: 'lobby', q: 'Q0', name: 'Lobby', go: { ph: 'setup' }, only: 'tv' },
    { id: 'clockin', q: 'Q0', name: 'Clocking in', go: { ph: 'naming' }, only: 'phone' },
    { id: 'onboarding', q: 'Q0', name: 'Onboarding', go: { ph: 'brief' } },
    { id: 'work', q: 'Q1', name: 'Work', go: { ph: 'work', r: 1 } },
    { id: 'templates', q: 'Q1', name: 'Cover page', go: { ph: 'work', r: 1, page: 2 }, only: 'phone' },
    { id: 'tweak', q: 'Q1', name: 'Dress it up', go: { ph: 'work', r: 1, page: 3 }, only: 'phone' },
    { id: 'decide', q: 'Q1', name: 'Decide', go: { ph: 'decide', r: 1 } },
    { id: 'board', q: 'Q2', name: 'Board vote', go: { ph: 'board' } },
    { id: 'reveal', q: 'Q1', name: 'Reveal', go: { ph: 'reveal', r: 1 } },
    { id: 'closed', q: 'Q1', name: 'Quarter closed', go: { ph: 'review', r: 1 } },
    { id: 'deal', q: 'Q2', name: 'Next quarter', go: { ph: 'work', r: 2 }, only: 'phone' },
    { id: 'whistle', q: 'Q5', name: 'Whistleblower', go: { ph: 'whistle' } },
    { id: 'exit', q: 'End', name: 'Annual report', go: { ph: 'end' }, only: 'tv' },
  ];
  const BRANDS = [
    { id: 'op', name: 'Only Profit', mono: 'OP', color: '#D9261C', hi: '#EF4A37', lo: '#8E160F', ink: '#fff', mark: '<path class="s" d="M5 39 17 26l8 8L39 16" style="stroke-width:5"/><path d="M30 11h14v14z"/>' },
    { id: 'granny', name: 'Family Granny Dating', mono: 'FG', color: '#C9577A', hi: '#E07D9C', lo: '#82304B', ink: '#fff', mark: '<circle class="s" cx="13" cy="27" r="8"/><circle class="s" cx="35" cy="27" r="8"/><path class="s" d="M21 26c2-3 4-3 6 0M5 25 2 18M43 25l3-7"/>' },
    { id: 'clown', name: 'Ultra Clown Childcare', mono: 'UC', color: '#E8641E', hi: '#F68A4C', lo: '#9A3C0B', ink: '#fff', mark: '<circle cx="9" cy="22" r="6"/><circle cx="39" cy="22" r="6"/><path fill-rule="evenodd" d="M11 25a13 13 0 1 0 26 0a13 13 0 1 0-26 0zM21 26a3 3 0 1 0 6 0a3 3 0 1 0-6 0z"/><path d="M18 13 24 1l6 12z"/>' },
    { id: 'widow', name: 'Eternal Widow', mono: 'EW', color: '#5E1A2B', hi: '#84324A', lo: '#330B16', ink: '#fff', mark: '<path fill-rule="evenodd" d="M24 3c7 0 10 6 10 12v14H14V15c0-6 3-12 10-12zM20 15a4 4 0 1 0 8 0a4 4 0 1 0-8 0z"/><path d="M8 45v-9a10 10 0 0 1 10-10h12a10 10 0 0 1 10 10v9z"/>' },
    { id: 'kidney', name: 'Executive Kidney Destruction', mono: 'EK', color: '#13807A', hi: '#3AA39C', lo: '#08504C', ink: '#fff', mark: '<path d="M27 5c9 0 15 8 15 19s-6 19-15 19c-8 0-11-4-11-8 0-5 5-6 5-11s-5-6-5-11c0-4 3-8 11-8z"/><path d="M14 20c-4 1-8 4-8 9" class="s" style="stroke-width:3"/>' },
    { id: 'stepdad', name: 'Compassionate Stepdad Childcare', mono: 'CS', color: '#7A5232', hi: '#9C7252', lo: '#4A2F19', ink: '#fff', mark: '<circle cx="15" cy="10" r="5.5"/><path d="M6 38V26a9 9 0 0 1 18 0v12z"/><path d="M26 45v-8h7v-8h7v-8h6v24z"/>' }];
  let brandId = 'granny', cardSet = 'paper';
  try { cardSet = localStorage.getItem('op-viewer-cards') || cardSet; } catch (e) {}
  const $cards = document.getElementById('cardsets');
  const drawCards = () => { $cards.innerHTML = [['paper', 'Paper cards'], ['colour', 'Colour cards']].map(([v, l]) => `<button data-cards="${v}" aria-pressed="${v === cardSet}"><i class="${v}"></i>${l}</button>`).join(''); };
  drawCards();
  $cards.addEventListener('click', ev => {
    const btn = ev.target.closest('[data-cards]'); if (!btn) return;
    cardSet = btn.dataset.cards; drawCards();
    try { localStorage.setItem('op-viewer-cards', cardSet); } catch (e) {}
    document.querySelectorAll('.vp iframe').forEach(f => { try { f.contentWindow.__op.cards(cardSet); } catch (e) {} });
    kitBrand();
  });
  try { brandId = localStorage.getItem('op-viewer-brand') || brandId; } catch (e) {}
  const $brands = document.getElementById('brands');
  const drawBrands = () => { $brands.innerHTML = BRANDS.map(b => `<button data-brand="${b.id}" aria-pressed="${b.id === brandId}" style="--c:${b.color}"><i></i>${b.name}</button>`).join(''); };
  drawBrands();
  // the parts sheet is the game itself, printing its own pieces
  function kitBrand() {
    const f = document.getElementById('kit'), w = f.contentWindow;
    if (!w || !w.__op || !w.__op.look) return;
    w.__op.look(brandId, cardSet); f.contentDocument.getElementById('app').innerHTML = kitHTML(w.__op);
  }
  $brands.addEventListener('click', ev => {
    const btn = ev.target.closest('[data-brand]'); if (!btn) return;
    brandId = btn.dataset.brand; drawBrands();
    try { localStorage.setItem('op-viewer-brand', brandId); } catch (e) {}
    // the deal itself uses the company's words, so frames already printed are dealt again
    document.querySelectorAll('.vp').forEach(vp => { if (vp.querySelector('iframe')) mount(vp); });
    kitBrand();
  });
  const $main = document.getElementById('main'), $jump = document.getElementById('jump');
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const device = (kind, s) => kind === 'tv'
    ? `<div class="tv"><div class="screen"><div class="vp" data-kind="tv" data-id="${s.id}"><div class="wait">PRINTING…</div></div></div><div class="stand"></div></div>`
    : `<div class="phone"><div class="screen"><div class="vp" data-kind="phone" data-id="${s.id}"><div class="wait">PRINTING…</div></div></div></div>`;
  $main.innerHTML = SPREADS.map(s => `<section class="spread ${s.only ? 'only-' + s.only : ''}" id="${s.id}">
      <div class="side"><span class="tab"><b>${s.q}</b><span>${s.name}</span></span><button class="replay" data-replay="${s.id}" aria-label="Replay ${s.name}">↻</button></div>
      <div class="stage">${s.only !== 'phone' ? device('tv', s) : ''}${s.only !== 'tv' ? device('phone', s) : ''}</div></section>`).join('')
    + `<section class="spread kit" id="parts"><div class="side"><span class="tab"><b>Kit</b><span>Parts</span></span></div><div><iframe id="kit" title="Parts sheet"></iframe></div></section>`;
  $jump.innerHTML = SPREADS.concat({ id: 'parts', name: 'Parts' }).map(s => `<a href="#${s.id}">${s.name}</a>`).join('');

  // Plays a seeded game inside the frame until it reaches the moment this spread shows.
  async function drive(f, go) {
    const w = f.contentWindow, d = f.contentDocument;
    const click = sel => { const e = d.querySelector(sel); if (e && !e.disabled) { e.click(); return true; } return false; };
    if (go.ph === 'setup') return;
    click(`[data-a=set][data-k=players][data-v="${PLAYERS}"]`);
    w.__opSkipName = go.ph !== 'naming';
    if (go.ph === 'naming') {
      click('[data-a=start]'); await sleep(50);
      const inp = d.getElementById('name-in'); inp.value = 'Joel'; inp.dispatchEvent(new Event('input', { bubbles: true }));
      click('[data-a="name-go"]'); await sleep(400); return;
    }
    const seed = d.getElementById('seed'); seed.value = SEED; seed.dispatchEvent(new Event('input', { bubbles: true }));
    click('[data-a=start]');
    for (let i = 0; i < 500; i++) {
      const S = w.__op && w.__op.S; if (!S) return;
      if (S.phase === go.ph && (go.r == null || S.r === go.r) && !go.page) return;
      if (S.phase === 'brief') click('[data-a=begin]');
      else if (S.phase === 'work') {
        if (click('[data-a=seal]')) { await sleep(20); continue; }
        if (go.page && S.r === go.r) { click('[data-a=finalise]'); await sleep(1500); if (go.page === 3) { click('[data-a=tpl][data-v=wordart]'); await sleep(700); } return; }
        if (click('[data-a=tpl]')) { await sleep(20); continue; }
        click('[data-a=stamp][data-v=Rec]'); click('[data-a=finalise]'); await sleep(1300); }
      else if (!click('.desk [data-a=advance]')) { click('.desk [data-a=sel]'); click('.desk .btn.primary'); }
      await sleep(12);
    }
  }
  function mount(vp) {
    const s = SPREADS.find(x => x.id === vp.dataset.id), tv = vp.dataset.kind === 'tv';
    const old = vp.querySelector('iframe'); if (old) old.remove();
    vp.classList.remove('live');
    const f = document.createElement('iframe');
    f.title = `${s.name}, ${tv ? 'TV' : 'phone'}`;
    const W = tv ? 1360 : 390;
    const fit = () => { const k = vp.clientWidth / W; f.style.width = W + 'px'; f.style.height = (vp.clientHeight / k) + 'px'; f.style.transform = `scale(${k})`; };
    fit(); new ResizeObserver(fit).observe(vp);
    f.addEventListener('load', async () => {
      try { await drive(f, s.go); } catch (e) { console.log('drive', e); }
      vp.classList.add('live');
    }, { once: true });
    f.srcdoc = `<script>window.__opFreeze = true; window.__opBrand = ${JSON.stringify(brandId)}; window.__opCards = ${JSON.stringify(cardSet)}<\/script>` + PROTO + `<style>${tv ? TV_CSS : PHONE_CSS}</style>`;
    vp.appendChild(f);
  }
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { io.unobserve(e.target); mount(e.target); } }), { rootMargin: '400px 0px' });
  document.querySelectorAll('.vp').forEach(vp => io.observe(vp));
  document.addEventListener('click', ev => {
    const b = ev.target.closest('[data-replay]'); if (!b) return;
    document.querySelectorAll(`.vp[data-id="${b.dataset.replay}"]`).forEach(mount);
  });

  const KIT_CSS = `html,body{min-height:0!important;height:auto!important} body{padding:22px 18px 28px} .kit{display:grid;gap:28px} .kit h4{margin:0 0 12px;font:800 11px/1 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--on-table-2)}
    .row{display:flex;flex-wrap:wrap;gap:22px 16px;align-items:flex-start} .play{margin:0;padding:18px 14px;background:transparent;box-shadow:none;overflow:visible}
    .note{font:600 12px/1.3 var(--f-body);color:var(--on-table-2);max-width:14ch;margin-top:6px;text-align:center}
    .sw{display:grid;grid-template-columns:34px auto;column-gap:10px;align-items:center;min-width:150px} .sw i{grid-row:span 2;width:34px;height:34px;border-radius:50%;box-shadow:0 0 0 2px rgba(0,0,0,.2),0 2px 4px rgba(0,0,0,.4)} .sw b{font:800 13px/1.1 var(--f-body)} .sw span{font:400 11px/1.2 var(--f-seg);color:var(--on-table-2)}
    .type{display:grid;gap:10px;background:var(--stock);color:var(--ink);border-radius:4px;padding:18px 20px;box-shadow:var(--lift)} .type .a{font:900 34px/1 var(--f-body);letter-spacing:-.03em} .type .b{font:400 15px/1.5 var(--f-body);max-width:60ch} .type .c{font:400 30px/1 var(--f-seg);background:var(--lcd);color:var(--lcd-ink);padding:6px 10px;border-radius:4px;width:max-content}
    .piece{display:grid;justify-items:center;gap:6px} .slot{animation:none!important;width:96px;height:134px} .slot::after{display:none} .pages .pg{width:212px} .pages .pg .cp-w{--k:.74} .line{max-width:340px}
    .kback{width:88px;height:124px;border-radius:7px;display:grid;place-items:center;background:var(--mark) center / 40% no-repeat,radial-gradient(circle,transparent 0 22px,var(--brand) 22.5px 26px,transparent 26.5px),repeating-linear-gradient(45deg,rgba(255,255,255,.12) 0 4px,transparent 4px 9px),var(--brand);box-shadow:inset 0 0 0 5px var(--stock),inset 0 0 0 6px rgba(0,0,0,.2),var(--lift)} .kback.r{transform:rotate(6deg)}`;
  function kitHTML(op) {
    const C = (s, v, w, fx) => ({ s, v, w, fx });
    const card = (c, cls, extra) => op.cardHTML(c, cls, extra);
    const hrs = n => `<i class="hrs">${n}h</i>`, purse = left => `<span class="purse">${[0, 1, 2].map(k => `<i class="slotbox${k >= left ? ' punched' : ''}">${k + 1}</i>`).join('')}</span>`;
    const sw = (name, v) => `<div class="sw"><i style="background:var(${v})"></i><b>${name}</b><span>${v}</span></div>`;
    const page = (tpl, subject, stamp, art) => ({ id: '·', subject, stamp, style: { tpl, art }, revealed: [] });
    const SUBJ = { fax: 'Fwd: Pension Agility — Revised', memo: 'Synergy Alert: Customer Delight for Q3', wordart: 'Action Required: Break Room Monetisation', clipart: 'Low-Hanging Fruit: Bingo Night Synergies',
      report: 'Circling Back: Morale Recovery (Pilot)', dossier: 'Confidential: Inheritance Matchmaking', overhead: 'Granny Retention Drive', certificate: 'Speed Dating (90+) Going Forward' };
    const stamps = ['Risky', 'Rec', 'Rec', 'Risky', 'Rec', 'Not', 'Risky', 'Rec'];
    const pages = Object.keys(SUBJ).map((t, k) => `<div class="pg">${op.coverHTML(page(t, SUBJ[t], stamps[k]), { list: [{ id: '·' }] })}</div>`).join('');
    const said = { id: '·', revealed: [], audited: true, cards: [C(0, 2, 'Restructure'), C(1, 1, 'Next of Kin'), C(2, -2, 'Retroactively', 'x2')], resolved: [2, 1, -2] };
    const part = { id: '·', revealed: [0, 2], cards: [C(0, 2, 'Offshore'), C(1, 1, 'the Regional Office'), C(2, 2, 'In Perpetuity')] };
    return `<style>${KIT_CSS}</style><div class="kit">
    <section><h4>Values</h4><div class="play"><div class="row">${card(C(0, 2, 'Liquidate'))}${card(C(1, 1, 'Interns'))}${card(C(2, 0, 'Quietly'))}${card(C(0, -1, 'Rightsize'))}${card(C(1, -2, 'Union Relations'))}${card(C(2, 'V', 'Allegedly'))}</div></div></section>
    <section><h4>Effect Modifiers</h4><div class="play"><div class="row">${card(C(2, -1, 'With Thoughts and Prayers', 'null'))}${card(C(2, -2, 'Retroactively', 'x2'))}${card(C(2, -1, "Per Legal's Advice", 'shield'))}${card(C(2, 0, 'Without Consultation', 'flip'))}</div></div></section>
    <section><h4>Overtime</h4><div class="play"><div class="row" style="align-items:center;gap:26px">
      <div class="piece">${purse(3)}<span class="note">Three hours to give</span></div><div class="piece">${purse(1)}<span class="note">Two punched</span></div>
      <div class="piece"><div class="slot">${card(C(1, 1, 'Interns'), '', `<span class="tag">${hrs(2)}</span>`)}</div><span class="note">Price to swap in</span></div>
      <div class="piece"><div class="slot">${card(C(0, 2, 'Liquidate'), 'shown', `<span class="paid">${hrs(2)}</span>`)}</div><span class="note">Paid, and shown to the table</span></div>
      <div class="piece"><div class="slot">${card(C(2, 2, 'In Perpetuity'), 'broke', `<span class="tag">${hrs(3)}</span>`)}</div><span class="note">Can't afford</span></div></div></div></section>
    <section><h4>Cover pages</h4><div class="pages" style="justify-content:flex-start">${pages}</div></section>
    <section><h4>The policy, read out</h4><div class="row" style="align-items:center">${op.lineHTML(part)}${op.lineHTML(said, { all: true })}</div></section>
    <section><h4>Clip-art (${op.ART.length})</h4><div class="row" style="gap:10px">${op.ART.map(id => `<span style="display:grid;width:40px;height:40px;padding:4px;background:var(--stock);border-radius:2px">${op.artSVG(id)}</span>`).join('')}</div></section>
    <section><h4>Brand objects</h4><div class="row" style="align-items:center;gap:22px"><span class="logo-mark" style="width:56px;height:56px">${op.brandMark()}</span><div class="kback"></div><div class="kback r"></div><div class="placeholder sealed" style="width:146px;height:206px"></div></div></section>
    <section><h4>Colour</h4><div class="row">${sw('Baize', '--baize')}${sw('Card stock', '--stock')}${sw('Ink', '--ink')}${sw('Red tape', '--red')}${sw('Good news', '--good')}${sw('Brass', '--gold')}${sw('Action', '--suit-0')}${sw('Target', '--suit-1')}${sw('Modifier', '--suit-2')}${sw('Company', '--brand')}</div></section>
    <section><h4>Type</h4><div class="type"><div class="a">Restructure the Orphanage</div><div class="b">Schibsted Grotesk carries everything people read. Shareholders are mildly pleased. Bonuses have been deferred.</div><div class="c">+18.0</div></div></section></div>`;
  }
  const kit = document.getElementById('kit');
  kit.addEventListener('load', () => {
    kitBrand();
    const fit = () => { kit.style.height = kit.contentDocument.body.offsetHeight + 'px'; }; fit(); setTimeout(fit, 800); new ResizeObserver(fit).observe(kit.contentDocument.body);
  });
  kit.srcdoc = `<script>window.__opFreeze = true; window.__opBrand = ${JSON.stringify(brandId)}; window.__opCards = ${JSON.stringify(cardSet)}<\/script>` + PROTO;
})();
</script>
