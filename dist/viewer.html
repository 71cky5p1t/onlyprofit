y for ink and the main key ---------- */\n:root { --suit-0: #4A6BB0; --suit-1: #C29433; --suit-2: #8A6A9C }\n/* suit is a small colour tab, not a header band */\n.card .hd { margin: 0; padding: 0; background: none; color: var(--ink-2); box-shadow: none; border-radius: 0 }\n.play .card .hd { margin: 0; padding: 0 }\n.card .hd .sp { display: inline-block; width: 8px; height: 8px; border: 0; border-radius: 2px; clip-path: none; background: var(--suit) }\n.card .word { border-top-color: var(--ink) }\n.card { box-shadow: inset 0 3px 0 var(--suit), 0 1px 0 rgba(0,0,0,.12), 0 8px 16px -10px rgba(0,0,0,.6) }\n.card.shown { box-shadow: inset 0 3px 0 var(--suit), 0 0 0 3px var(--gold), 0 7px 14px -7px rgba(0,0,0,.55) }\n.fan .card { box-shadow: inset 0 3px 0 var(--suit), 0 10px 18px -8px rgba(0,0,0,.7) }\n.policy .card { box-shadow: inset 0 3px 0 var(--suit), 0 2px 0 rgba(0,0,0,.12) }\n/* the same card everywhere: the hand only leans a little */\n.fan .slot { margin-inline: 4px }\n.fan .slot:nth-child(1) { transform: rotate(-4deg) translateY(3px) }\n.fan .slot:nth-child(3) { transform: rotate(4deg) translateY(3px) }\n.fan .slot { transform-origin: 50% 100% }\n/* coins are coins: no dark rings */\n.tag { background: none; box-shadow: none; padding: 0; min-width: 0; right: -7px; top: -8px }\n.tag .coin, .coins .coin { width: 20px; height: 20px }\n.tag.back { width: 22px; height: 22px; border-radius: 50%; background: var(--stock); color: var(--ink); font-size: 12px; display: grid; place-items: center; box-shadow: 0 1px 3px rgba(0,0,0,.4) }\n.card.broke .tag { background: none } .card.broke .tag .coin { filter: grayscale(1) brightness(.75); opacity: .7 }\n/* adding-machine tape between the policy and the hand */\n.tape { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 0; margin: 14px 2px 12px; background: var(--stock); color: var(--ink); border-radius: 2px; box-shadow: 0 1px 0 rgba(0,0,0,.15), 0 8px 14px -10px rgba(0,0,0,.6); transform: rotate(-.5deg);\n  -webkit-mask-image: radial-gradient(circle at 50% 0, transparent 2.5px, #000 3px) 0 0 / 9px 100%, linear-gradient(#000, #000); mask-image: none }\n.tape > * { padding: 8px 10px 7px; min-width: 0 }\n.t-src { font: 700 11.5px/1.2 var(--f-body); color: var(--ink-2); display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center }\n.t-src b { color: var(--ink) }\n.t-src .env-stamp { font-size: 8.5px; padding: 2px 4px; border-width: 1.5px }\n.t-worth { font: 400 24px/1 var(--f-seg); border-inline: 1.5px dashed rgba(20,20,20,.2); padding-inline: 14px; font-variant-numeric: tabular-nums }\n.t-worth.pos { color: var(--good) } .t-worth.neg { color: var(--red) } .t-worth small { font-size: 11px; color: var(--sunset); margin-left: 2px }\n.t-redeal { justify-self: end; display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; color: var(--ink); font: 800 11.5px/1 var(--f-body); cursor: pointer }\n.t-redeal:hover:not(:disabled) { text-decoration: underline }\n.t-redeal:disabled { color: var(--ink-3); cursor: not-allowed }\n.t-redeal:disabled .coin { filter: grayscale(1); opacity: .5 }\n.t-cost { display: inline-flex } .t-cost .coin { width: 16px; height: 16px }\n/* every pick-one bar (stamps, Ratify/Overrule) is the same paper strip: the chosen one inked, the rest ghosts */\n.bar3 { background: var(--stock); box-shadow: 0 1px 0 rgba(0,0,0,.15), 0 8px 14px -10px rgba(0,0,0,.6); border-radius: 2px; padding: 6px; transform: rotate(.4deg) }\n.bar3 button { color: rgba(20,20,20,.32); background: none; padding: 8px 2px }\n.bar3 button span { border: 2px dashed rgba(20,20,20,.18); border-radius: 3px; padding: 4px 5px }\n.bar3 button:hover { color: var(--ink-2) }\n.bar3 button[aria-pressed=\"true\"] { background: none; box-shadow: none }\n.bar3 button[aria-pressed=\"true\"] span { border-style: solid; border-color: currentColor; transform: rotate(-4deg); mix-blend-mode: multiply }\n/* the header keeps its rail; nothing else on the screen is dark */\n.desk-head .purse { background: rgba(0,0,0,.35) }\n<\/style>\n<style>\n/* phones: the desk scrolls with the page (this has to come after the desk's own sticky rule) */\n@media (max-width: 980px) { .desk { position: static; max-height: none; overflow: visible } }\n"</script>
<script>
(() => {
  const PROTO = JSON.parse(document.getElementById('proto').textContent);
  const KITCSS = JSON.parse(document.getElementById('kitcss').textContent);
  const SEED = 5, PLAYERS = 6;
  // The TV shows the shared board; the phone shows only your own desk.
  const TV_CSS = '.desk{display:none!important}.layout{grid-template-columns:minmax(0,1fr)!important}';
  const PHONE_CSS = '.board,.mast{display:none!important}.layout{padding-block:10px 30px!important}.wrap{padding-inline:8px!important}.desk{position:static!important;max-height:none!important;max-width:none!important}';
  const SPREADS = [
    { id: 'lobby', q: 'Q0', name: 'Lobby', go: { ph: 'setup' }, only: 'tv' },
    { id: 'clockin', q: 'Q0', name: 'Clocking in', go: { ph: 'naming' }, only: 'phone' },
    { id: 'onboarding', q: 'Q0', name: 'Onboarding', go: { ph: 'brief' } },
    { id: 'work', q: 'Q1', name: 'Work', go: { ph: 'work', r: 1 } },
    { id: 'dress', q: 'Q1', name: 'Dress it up', go: { ph: 'work', r: 1, page: 2 }, only: 'phone' },
    { id: 'pitch', q: 'Q1', name: 'Pitch + audit', go: { ph: 'pitch', r: 1 } },
    { id: 'decide', q: 'Q1', name: 'Decide', go: { ph: 'decide', r: 1 } },
    { id: 'board', q: 'Q2', name: 'Board vote', go: { ph: 'board' } },
    { id: 'reveal', q: 'Q1', name: 'Reveal', go: { ph: 'reveal', r: 1 } },
    { id: 'closed', q: 'Q1', name: 'Quarter closed', go: { ph: 'review', r: 1 } },
    { id: 'deal', q: 'Q2', name: 'Next quarter', go: { ph: 'work', r: 2 }, only: 'phone' },
    { id: 'whistle', q: 'Q5', name: 'Whistleblower', go: { ph: 'whistle' } },
    { id: 'exit', q: 'End', name: 'Exit interview', go: { ph: 'end' }, only: 'tv' },
  ];
  const BRANDS = [
    { id: 'op', name: 'Only Profit', mono: 'OP', color: '#D9261C', hi: '#EF4A37', lo: '#8E160F', ink: '#fff' },
    { id: 'granny', name: 'Family Granny Dating', mono: 'FG', color: '#9B7BB8', hi: '#BBA0D4', lo: '#5E4478', ink: '#fff' },
    { id: 'clown', name: 'Ultra Clown Childcare', mono: 'UC', color: '#E8B81E', hi: '#F7D560', lo: '#9A7406', ink: '#1a1a1a' },
    { id: 'widow', name: 'Eternal Widow', mono: 'EW', color: '#4A3E60', hi: '#6E5F8A', lo: '#211A2D', ink: '#fff' },
    { id: 'kidney', name: 'Executive Kidney Destruction', mono: 'EK', color: '#2F5D8A', hi: '#4F7FB0', lo: '#18344F', ink: '#fff' },
    { id: 'stepdad', name: 'Compassionate Stepdad Childcare', mono: 'CS', color: '#C2793A', hi: '#DC9C63', lo: '#7A4519', ink: '#fff' }];
  let brandId = 'granny';
  try { brandId = localStorage.getItem('op-viewer-brand') || brandId; } catch (e) {}
  const $brands = document.getElementById('brands');
  const drawBrands = () => { $brands.innerHTML = BRANDS.map(b => `<button data-brand="${b.id}" aria-pressed="${b.id === brandId}" style="--c:${b.color}"><i></i>${b.name}</button>`).join(''); };
  drawBrands();
  function kitBrand() {
    const d = document.getElementById('kit').contentDocument; if (!d || !d.documentElement) return;
    const b = BRANDS.find(x => x.id === brandId), r = d.documentElement.style;
    r.setProperty('--brand', b.color); r.setProperty('--brand-hi', b.hi); r.setProperty('--brand-lo', b.lo); r.setProperty('--brand-ink', b.ink); r.setProperty('--mono', `"${b.mono}"`);
    d.querySelectorAll('.kmono').forEach(el => { el.textContent = b.mono; });
  }
  $brands.addEventListener('click', ev => {
    const btn = ev.target.closest('[data-brand]'); if (!btn) return;
    brandId = btn.dataset.brand; drawBrands();
    try { localStorage.setItem('op-viewer-brand', brandId); } catch (e) {}
    // the deal itself uses the company's words, so frames already printed are dealt again
    document.querySelectorAll('.vp').forEach(vp => { if (vp.querySelector('iframe')) mount(vp); });
    kitBrand();
  });
  const $main = document.getElementById('main'), $jump = document.getElementById('jump');
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const device = (kind, s) => kind === 'tv'
    ? `<div class="tv"><div class="screen"><div class="vp" data-kind="tv" data-id="${s.id}"><div class="wait">PRINTING…</div></div></div><div class="stand"></div></div>`
    : `<div class="phone"><div class="screen"><div class="vp" data-kind="phone" data-id="${s.id}"><div class="wait">PRINTING…</div></div></div></div>`;
  $main.innerHTML = SPREADS.map(s => `<section class="spread ${s.only ? 'only-' + s.only : ''}" id="${s.id}">
      <div class="side"><span class="tab"><b>${s.q}</b><span>${s.name}</span></span><button class="replay" data-replay="${s.id}" aria-label="Replay ${s.name}">↻</button></div>
      <div class="stage">${s.only !== 'phone' ? device('tv', s) : ''}${s.only !== 'tv' ? device('phone', s) : ''}</div></section>`).join('')
    + `<section class="spread kit" id="parts"><div class="side"><span class="tab"><b>Kit</b><span>Parts</span></span></div><div><iframe id="kit" title="Parts sheet"></iframe></div></section>`;
  $jump.innerHTML = SPREADS.concat({ id: 'parts', name: 'Parts' }).map(s => `<a href="#${s.id}">${s.name}</a>`).join('');

  // Plays a seeded game inside the frame until it reaches the moment this spread shows.
  async function drive(f, go) {
    const w = f.contentWindow, d = f.contentDocument;
    const click = sel => { const e = d.querySelector(sel); if (e && !e.disabled) { e.click(); return true; } return false; };
    if (go.ph === 'setup') return;
    click(`[data-a=set][data-k=players][data-v="${PLAYERS}"]`);
    w.__opSkipName = go.ph !== 'naming';
    if (go.ph === 'naming') {
      click('[data-a=start]'); await sleep(50);
      const inp = d.getElementById('name-in'); inp.value = 'Joel'; inp.dispatchEvent(new Event('input', { bubbles: true }));
      click('[data-a="name-go"]'); await sleep(400); return;
    }
    const seed = d.getElementById('seed'); seed.value = SEED; seed.dispatchEvent(new Event('input', { bubbles: true }));
    click('[data-a=start]');
    for (let i = 0; i < 500; i++) {
      const S = w.__op && w.__op.S; if (!S) return;
      if (S.phase === go.ph && (go.r == null || S.r === go.r) && !go.page) return;
      if (S.phase === 'brief') click('[data-a=begin]');
      else if (S.phase === 'work') { if (click('[data-a=seal]')) { await sleep(20); continue; } if (go.page === 2 && S.r === go.r) { click('[data-a=finalise]'); await sleep(1600); return; } click('[data-a=stamp][data-v=Rec]'); click('[data-a=finalise]'); await sleep(1450); }
      else if (!click('.desk [data-a=advance]')) { click('.desk [data-a=sel]'); click('.desk .btn.primary'); }
      await sleep(12);
    }
  }
  function mount(vp) {
    const s = SPREADS.find(x => x.id === vp.dataset.id), tv = vp.dataset.kind === 'tv';
    const old = vp.querySelector('iframe'); if (old) old.remove();
    vp.classList.remove('live');
    const f = document.createElement('iframe');
    f.title = `${s.name}, ${tv ? 'TV' : 'phone'}`;
    const W = tv ? 1360 : 390;
    const fit = () => { const k = vp.clientWidth / W; f.style.width = W + 'px'; f.style.height = (vp.clientHeight / k) + 'px'; f.style.transform = `scale(${k})`; };
    fit(); new ResizeObserver(fit).observe(vp);
    f.addEventListener('load', async () => {
      try { await drive(f, s.go); } catch (e) { console.log('drive', e); }
      vp.classList.add('live');
    }, { once: true });
    f.srcdoc = `<script>window.__opFreeze = true; window.__opBrand = ${JSON.stringify(brandId)}<\/script>` + PROTO + `<style>${tv ? TV_CSS : PHONE_CSS}</style>`;
    vp.appendChild(f);
  }
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { io.unobserve(e.target); mount(e.target); } }), { rootMargin: '400px 0px' });
  document.querySelectorAll('.vp').forEach(vp => io.observe(vp));
  document.addEventListener('click', ev => {
    const b = ev.target.closest('[data-replay]'); if (!b) return;
    document.querySelectorAll(`.vp[data-id="${b.dataset.replay}"]`).forEach(mount);
  });

  // parts sheet
  const card = (s, v, cls, word, fx) => {
    const SU = ['Action', 'Target', 'Modifier'], G = { 2: '++', 1: '+', 0: '0', '-1': '−', '-2': '−−', V: '?' };
    const tone = v === 'V' ? 'v-v' : v > 0 ? 'pos' : v < 0 ? 'neg' : 'zero';
    const FS = { null: '×0', x2: '×2', shield: '≥0', flip: '×−1' };
    const face = `<b class="glyph ${tone}">${G[v]}</b>` + (fx ? `<span class="dymo fx-${fx}"><i class="m0"></i><i class="m1"></i><b>${FS[fx]}</b></span>` : '');
    return `<div class="card s-${s} ${fx ? 'has-fx' : ''} ${cls}"><div class="hd"><i class="sp"></i>${SU[s]}</div><div class="fx">${face}</div><span class="word">${word}</span></div>`;
  };
  const coins = n => '<i class="coin"></i>'.repeat(n);
  const sw = (name, v) => `<div class="sw"><i style="background:var(${v})"></i><b>${name}</b><span>${v}</span></div>`;
  const KIT = `<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400..900&family=Share+Tech+Mono&display=swap"><style>${KITCSS}
    html,body{min-height:0!important;height:auto!important} body{padding:22px 18px 28px} .kit{display:grid;gap:28px} .kit h4{margin:0 0 12px;font:800 11px/1 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--on-table-2)}
    .row{display:flex;flex-wrap:wrap;gap:16px 14px;align-items:flex-start} .play{margin:0;padding:18px 14px;background:transparent;box-shadow:none;overflow:visible}
    .note{font:600 12px/1.3 var(--f-body);color:var(--on-table-2);max-width:12ch;margin-top:6px}
    .sw{display:grid;grid-template-columns:34px auto;column-gap:10px;align-items:center;min-width:150px} .sw i{grid-row:span 2;width:34px;height:34px;border-radius:50%;box-shadow:0 0 0 2px rgba(0,0,0,.2),0 2px 4px rgba(0,0,0,.4)} .sw b{font:800 13px/1.1 var(--f-body)} .sw span{font:400 11px/1.2 var(--f-seg);color:var(--on-table-2)}
    .type{display:grid;gap:10px;background:var(--stock);color:var(--ink);border-radius:4px;padding:18px 20px;box-shadow:var(--lift)} .type .a{font:900 34px/1 var(--f-body);letter-spacing:-.03em} .type .b{font:400 15px/1.5 var(--f-body);max-width:60ch} .type .c{font:400 30px/1 var(--f-seg);background:var(--lcd);color:var(--lcd-ink);padding:6px 10px;border-radius:4px;width:max-content}
    .piece{display:grid;justify-items:center;gap:6px} .kback{width:88px;height:124px;border-radius:7px;display:grid;place-items:center;background:radial-gradient(circle,transparent 0 22px,var(--brand) 22.5px 26px,transparent 26.5px),repeating-linear-gradient(45deg,rgba(255,255,255,.12) 0 4px,transparent 4px 9px),var(--brand);box-shadow:inset 0 0 0 5px var(--stock),inset 0 0 0 6px rgba(0,0,0,.2),var(--lift);color:var(--brand-ink);font:900 17px/1 var(--f-body);letter-spacing:-.04em} .kback.r{transform:rotate(6deg)} .slot{animation:none!important} .slot::after{display:none}
  </style>
  <div class="kit">
    <section><h4>Values</h4><div class="play"><div class="row">${card(0, 2, '', 'Liquidate')}${card(1, 1, '', 'Interns')}${card(2, 0, '', 'Quietly')}${card(0, -1, '', 'Rightsize')}${card(1, -2, '', 'Union Relations')}${card(2, 'V', '', 'Allegedly')}</div></div></section>
    <section><h4>Effect Modifiers</h4><div class="play"><div class="row">${card(2, -1, '', 'With Thoughts and Prayers', 'null')}${card(2, -2, '', 'Retroactively', 'x2')}${card(2, -1, '', "Per Legal's Advice", 'shield')}${card(2, 0, '', 'Without Consultation', 'flip')}</div></div></section>
    <section><h4>Coins</h4><div class="play"><div class="row" style="align-items:center;gap:26px">
      <div class="piece"><span class="purse">${coins(3)}</span><span class="note">Full purse</span></div>
      <div class="piece"><span class="purse">${coins(1)}<i class="coin spent"></i><i class="coin spent"></i></span><span class="note">Two spent</span></div>
      <div class="piece"><div class="slot">${card(1, 1, '', 'Interns').replace('<div class="hd">', '<span class="tag">' + coins(2) + '</span><div class="hd">')}</div><span class="note">Price to swap in</span></div>
      <div class="piece"><div class="slot">${card(0, 2, 'shown', 'Liquidate').replace('<div class="hd">', '<i class="eye"></i><span class="coins paid">' + coins(2) + '</span><div class="hd">')}</div><span class="note">Paid, and shown to the table</span></div>
      <div class="piece"><div class="slot">${card(2, 2, 'broke', 'In Perpetuity').replace('<div class="hd">', '<span class="tag">' + coins(3) + '</span><div class="hd">')}</div><span class="note">Can't afford</span></div>
    </div></div></section>
    <section><h4>Brand objects</h4><div class="row" style="align-items:center;gap:22px">
      <span class="logo-mark" style="width:56px;height:56px;font-size:19px"><span class="kmono">OP</span></span>
      <div class="kback"><b class="kmono">OP</b></div><div class="kback r"><b class="kmono">OP</b></div>
      <span class="logo-mark" style="width:40px;height:40px;border-radius:50% 46% 52% 48%;clip-path:polygon(0 0,46% 0,54% 40%,44% 60%,52% 100%,0 100%)"></span></div></section>
    <section><h4>Colour</h4><div class="row">${sw('Baize', '--baize')}${sw('Card stock', '--stock')}${sw('Ink', '--ink')}${sw('Red tape', '--red')}${sw('Good news', '--good')}${sw('Brass', '--gold')}${sw('Sunset', '--sunset')}${sw('Calculator', '--lcd')}${sw('Manila', '--env-manila')}${sw('Carbon copy', '--env-carbon')}</div></section>
    <section><h4>Type</h4><div class="type"><div class="a">Restructure the Orphanage</div><div class="b">Schibsted Grotesk carries everything people read. Shareholders are mildly pleased. Bonuses have been deferred.</div><div class="c">+18.0</div></div></section>
  </div>`;
  const kit = document.getElementById('kit');
  kit.addEventListener('load', () => { const fit = () => { kit.style.height = kit.contentDocument.body.offsetHeight + 'px'; }; fit(); setTimeout(fit, 600); kitBrand(); new ResizeObserver(fit).observe(kit.contentDocument.body); });
  kit.srcdoc = KIT;
})();
</script>
