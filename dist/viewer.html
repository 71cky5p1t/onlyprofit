x; border-radius: 50%; background: radial-gradient(circle at 38% 32%, #EF4A37, var(--red) 45%, var(--red-lo)); display: grid; place-items: center; font: 900 11px/1 var(--f-body); color: rgba(255,255,255,.75); box-shadow: 0 2px 5px rgba(0,0,0,.4) }\n\n/* ---------- paper on the table: bulletin board, ledger tape, staff ---------- */\n.feed { display: grid; background: var(--stock); color: var(--ink); border-radius: 4px; box-shadow: var(--lift); position: relative }\n.feed-item { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 10px; padding: 10px 16px; border-top: 1px solid var(--stock-3); font-size: 14px }\n.feed-item:first-child { border-top: 0 }\n.feed-item .q { font: 800 11px/20px var(--f-body); color: var(--ink-3) }\n.feed-item.memo .txt::before { content: \"“\" } .feed-item.memo .txt::after { content: \"”\" }\n.feed-item .who { font-weight: 800 }\n.feed-item.system { color: var(--ink-2); font-size: 13px }\n.feed-empty { padding: 14px 16px; color: var(--ink-3); font-size: 13px }\n.lie, .true { font: 800 10px/1 var(--f-body); color: #fff; background: var(--red); padding: 3px 5px; border-radius: 2px; margin-left: 6px; letter-spacing: .06em }\n.true { background: var(--good) }\ndetails.rules summary { color: var(--on-table) }\n.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 30px; align-items: start }\n@media (max-width: 760px) { .two { grid-template-columns: minmax(0, 1fr) } }\ntable.ledger { width: 100%; border-collapse: collapse; font: 400 14px/1.35 var(--f-seg); background: #F6F3EA; color: #26261F; box-shadow: var(--lift); border-radius: 0 0 3px 3px;\n  -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,.35), #000 40px); mask-image: linear-gradient(to bottom, rgba(0,0,0,.35), #000 40px) }\ntable.ledger td, table.ledger th { padding: 8px 12px; text-align: left; vertical-align: top; border-bottom: 1px dotted rgba(0,0,0,.2) }\ntable.ledger th { font: 400 11px/1 var(--f-seg); letter-spacing: .12em; text-transform: uppercase; color: #77736A; padding-top: 16px }\ntable.ledger td.n { text-align: right; white-space: nowrap }\ntable.ledger tfoot td { border-bottom: 0; border-top: 2px dashed #26261F; font-size: 16px }\ntable.ledger tr.new td { animation: print .5s steps(4) both }\n@keyframes print { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }\ntable.ledger .muted { color: #9B968A }\n.sub-mono { font: 400 13px/1.35 var(--f-seg); color: #26261F }\ntable.ledger .sub-mono + .muted { font-family: var(--f-body); font-size: 11.5px !important }\n.staff { display: grid; background: var(--stock); color: var(--ink); border-radius: 4px; box-shadow: var(--lift); padding: 4px 14px }\n.staff-row { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 10px; padding: 9px 0; border-bottom: 1px solid var(--stock-3); align-items: center }\n.staff-row:last-child { border-bottom: 0 }\n.staff-name { font-weight: 800 }\n.staff-meta { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: flex-end }\n.staff .pill:not(.red):not(.green):not(.grey):not(.gold):not(.blue) { background: var(--ink); color: var(--stock); border-color: var(--ink) }\n.warn-pips { display: inline-flex; gap: 3px }\n.warn-pips i { width: 9px; height: 12px; border: 2px solid var(--red); display: block; border-radius: 1px }\n.warn-pips i.on { background: var(--red) }\n.board > section > .label, section > .label { color: var(--on-table-2) }\n.sched { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; margin-top: 10px }\n.sched div { background: rgba(241,233,212,.08); border-radius: 4px; padding: 7px 8px; font-size: 12.5px; min-width: 0; color: var(--on-table) }\n.sched div.now { background: var(--stock); color: var(--ink) }\n.sched .label { font-size: 10px; color: inherit; opacity: .7 }\n.sched .nm { display: block; overflow-wrap: break-word; hyphens: auto; font-size: 12.5px; line-height: 1.2; font-weight: 800 }\n\n/* observer */\n.observer { background: repeating-linear-gradient(-45deg, var(--stock) 0 12px, #EADFC2 12px 24px); color: var(--ink); border-radius: 4px; padding: 12px 14px; display: grid; gap: 10px; box-shadow: var(--lift) }\n.observer .section-head { color: var(--ink); border-color: var(--ink) }\n.observer .section-head .label { color: var(--ink-2) }\n.observer-grid { display: flex; flex-wrap: wrap; gap: 6px }\n.observer .pill { background: var(--stock) }\n\n/* setup: a letter on the table */\n.setup { max-width: 660px; margin: 48px auto; background: var(--stock); color: var(--ink); border-radius: 6px; box-shadow: 0 30px 50px -24px rgba(0,0,0,.8); overflow: hidden; position: relative }\n.setup::before { content: \"\"; display: block; height: 10px; background: linear-gradient(90deg, var(--gold) 0 25%, var(--sunset) 25% 50%, var(--rust) 50% 75%, var(--teak) 75%) }\n.setup-hero { padding: 26px 28px 22px; border-bottom: 2px solid var(--ink); display: grid; gap: 10px }\n.setup-hero .label { color: var(--red) }\n.setup-hero h1 { font-size: clamp(44px, 8vw, 68px); font-weight: 900; line-height: .9; letter-spacing: -.045em }\n.setup-hero p { margin: 0; color: var(--ink-2); max-width: 52ch; font-size: 15.5px }\n.setup-body { padding: 22px 28px 28px; display: grid; gap: 18px }\n.field { display: grid; gap: 7px }\n.seg { display: flex; flex-wrap: wrap; gap: 6px }\n.seg button { border: 1.5px solid var(--stock-3); background: #FBF6EA; border-radius: 5px; padding: 8px 13px; font: 800 13px/1 var(--f-body) }\n.seg button[aria-pressed=\"true\"] { background: var(--ink); color: var(--stock); border-color: var(--ink) }\n.setup-foot { display: flex; gap: 12px; align-items: center; flex-wrap: wrap }\n.setup details.rules summary { color: var(--ink) }\ndetails.rules { font-size: 13.5px; color: var(--ink-2) }\ndetails.rules summary { cursor: pointer; font: 800 11px/1.2 var(--f-body); letter-spacing: .1em; text-transform: uppercase }\ndetails.rules ol { padding-left: 18px; margin: 10px 0 0; display: grid; gap: 6px }\n.board details.rules { color: var(--on-table-2) }\n\n/* exit interview */\n.exit { display: grid; gap: 18px }\n.exit-round { display: grid; gap: 10px; background: var(--stock); color: var(--ink); border-radius: 4px; padding: 14px 16px; box-shadow: var(--lift) }\n.exit-round h3 { font-size: 17px; font-weight: 900; letter-spacing: -.02em; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap }\n.scroll-x { overflow-x: auto }\ntable.exit-t { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 640px }\ntable.exit-t td, table.exit-t th { padding: 7px 6px; border-bottom: 1px solid var(--stock-3); text-align: left; vertical-align: top }\ntable.exit-t td.nw { white-space: nowrap }\ntable.exit-t .pill { display: inline-block; vertical-align: 1px; margin-left: 4px }\ntable.exit-t th { font: 800 10px/1 var(--f-body); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3) }\ntable.exit-t tr.win td { background: #FBF6EA }\ntable.exit-t .sub-mono { font-family: var(--f-body); font-weight: 700 }\n.toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); transform: translateX(-50%); background: var(--ink); color: var(--stock); padding: 11px 16px; border-radius: 6px; font: 700 13.5px/1.2 var(--f-body); z-index: 30; box-shadow: 0 10px 24px -10px rgba(0,0,0,.6) }\n\n/* ---------- stripe wipe between phases ---------- */\n.wipe { position: fixed; inset: 0; z-index: 40; pointer-events: none; display: grid; place-items: center; transform: translateX(-101%);\n  background: linear-gradient(90deg, var(--gold) 0 25%, var(--sunset) 25% 50%, var(--rust) 50% 75%, var(--teak) 75%);\n  animation: wipe 1.25s cubic-bezier(.7,0,.3,1) both }\n.wipe span { display: inline-flex; font: 900 clamp(28px, 6vw, 64px)/1 var(--f-body); letter-spacing: -.03em; border-radius: 4px; overflow: hidden; box-shadow: 0 10px 30px -10px rgba(0,0,0,.5); animation: wtxt 1.25s ease both }\n.wipe b { background: var(--red); color: #fff; padding: .18em .3em }\n.wipe i { font-style: normal; background: var(--stock); color: var(--ink); padding: .18em .35em }\n@keyframes wipe { 0% { transform: translateX(-101%) } 36%, 58% { transform: translateX(0) } 100% { transform: translateX(101%) } }\n@keyframes wtxt { 0%, 26% { opacity: 0; transform: scale(.85) } 38%, 56% { opacity: 1; transform: none } 66%, 100% { opacity: 0 } }\n.deal .card { animation: deal .55s var(--bounce) both }\n@keyframes deal { from { transform: translateY(-40px) rotate(-8deg); opacity: 0 } to { transform: none; opacity: 1 } }\n.deal .card.spare { animation-name: deal-spare }\n@keyframes deal-spare { from { transform: translateY(-40px) rotate(-8deg) scale(.94); opacity: 0 } to { transform: scale(.94); opacity: .82 } }\n@media (prefers-reduced-motion: reduce) {\n  .wipe { display: none } .big-stamp, .deal .card, table.ledger tr.new td { animation: none }\n  button.env:hover, .env.sel { transform: none } .meter-fill { transition: none }\n}\n"</script>
<script>
(() => {
  const PROTO = JSON.parse(document.getElementById('proto').textContent);
  const KITCSS = JSON.parse(document.getElementById('kitcss').textContent);
  const SEED = 5, PLAYERS = 6;
  // The TV shows the shared board; the phone shows only your own desk.
  const TV_CSS = '.desk{display:none!important}.layout{grid-template-columns:minmax(0,1fr)!important}';
  const PHONE_CSS = '.board,.mast{display:none!important}.layout{padding-block:10px 30px!important}.wrap{padding-inline:8px!important}.desk{position:static!important;max-height:none!important;max-width:none!important}';
  const SPREADS = [
    { id: 'lobby', q: 'Q0', name: 'Lobby', say: 'Pick a table size and the bots. Seeded games replay exactly.', go: { ph: 'setup' }, only: 'tv' },
    { id: 'onboarding', q: 'Q0', name: 'Onboarding', say: 'Your employment letter tells you which side you are on. The TV shows the staff and the empty ledger.', go: { ph: 'brief' } },
    { id: 'work', q: 'Q1', name: 'Work', say: 'Your inherited policy floats on top. Drag a card up from your hand to swap it, tap one to show the CEO. Each costs coins.', go: { ph: 'work', r: 1 } },
    { id: 'pitch', q: 'Q1', name: 'Pitch + audit', say: 'Anonymous envelopes land on the board. The table votes to open one.', go: { ph: 'pitch', r: 1 } },
    { id: 'decide', q: 'Q1', name: 'Decide', say: 'You are CEO this quarter. Approve one envelope.', go: { ph: 'decide', r: 1 } },
    { id: 'reveal', q: 'Q1', name: 'Reveal', say: 'The approved policy is opened and stamped. The table may vote a Written Warning.', go: { ph: 'reveal', r: 1 } },
    { id: 'closed', q: 'Q1', name: 'Quarter closed', say: 'The ledger prints the quarter and the profit meter counts up.', go: { ph: 'review', r: 1 } },
    { id: 'deal', q: 'Q2', name: 'Next quarter', say: 'The stripe wipe clears, then the new hand is dealt in face down and flips.', go: { ph: 'work', r: 2 }, only: 'phone' },
    { id: 'whistle', q: 'Q5', name: 'Whistleblower', say: 'One last accusation. Right is +3, wrong is −3.', go: { ph: 'whistle' } },
    { id: 'exit', q: 'End', name: 'Exit interview', say: 'Everything that was hidden, quarter by quarter.', go: { ph: 'end' }, only: 'tv' },
  ];
  const $main = document.getElementById('main'), $jump = document.getElementById('jump');
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const device = (kind, s) => kind === 'tv'
    ? `<div class="tv"><div class="screen"><div class="vp" data-kind="tv" data-id="${s.id}"><div class="wait">PRINTING…</div></div></div><div class="stand"></div></div>`
    : `<div class="phone"><div class="screen"><div class="vp" data-kind="phone" data-id="${s.id}"><div class="wait">PRINTING…</div></div></div></div>`;
  $main.innerHTML = SPREADS.map(s => `<section class="spread ${s.only ? 'only-' + s.only : ''}" id="${s.id}">
      <div class="side"><span class="tab"><b>${s.q}</b><span>${s.name}</span></span><p>${s.say}</p><button class="replay" data-replay="${s.id}">↻ Replay</button></div>
      <div class="stage">${s.only !== 'phone' ? device('tv', s) : ''}${s.only !== 'tv' ? device('phone', s) : ''}</div></section>`).join('')
    + `<section class="spread kit" id="parts"><div class="side"><span class="tab"><b>Kit</b><span>Parts</span></span><p>Cards, coins, colours and type, as the game uses them.</p></div><div><iframe id="kit" title="Parts sheet"></iframe></div></section>`;
  $jump.innerHTML = SPREADS.concat({ id: 'parts', name: 'Parts' }).map(s => `<a href="#${s.id}">${s.name}</a>`).join('');

  // Plays a seeded game inside the frame until it reaches the moment this spread shows.
  async function drive(f, go) {
    const w = f.contentWindow, d = f.contentDocument;
    const click = sel => { const e = d.querySelector(sel); if (e && !e.disabled) { e.click(); return true; } return false; };
    if (go.ph === 'setup') return;
    click(`[data-a=set][data-k=players][data-v="${PLAYERS}"]`);
    const seed = d.getElementById('seed'); seed.value = SEED; seed.dispatchEvent(new Event('input', { bubbles: true }));
    click('[data-a=start]');
    for (let i = 0; i < 500; i++) {
      const S = w.__op && w.__op.S; if (!S) return;
      if (S.phase === go.ph && (go.r == null || S.r === go.r)) return;
      if (S.phase === 'brief') click('[data-a=begin]');
      else if (S.phase === 'work') { click('[data-a=stamp][data-v=Rec]'); click('[data-a=seal]'); }
      else if (!click('.desk [data-a=advance]')) { click('.desk .radio[data-a=sel]'); click('.desk .btn.primary'); }
      await sleep(12);
    }
  }
  function mount(vp) {
    const s = SPREADS.find(x => x.id === vp.dataset.id), tv = vp.dataset.kind === 'tv';
    const old = vp.querySelector('iframe'); if (old) old.remove();
    vp.classList.remove('live');
    const f = document.createElement('iframe');
    f.title = `${s.name}, ${tv ? 'TV' : 'phone'}`;
    const W = tv ? 1360 : 390;
    const fit = () => { const k = vp.clientWidth / W; f.style.width = W + 'px'; f.style.height = (vp.clientHeight / k) + 'px'; f.style.transform = `scale(${k})`; };
    fit(); new ResizeObserver(fit).observe(vp);
    f.addEventListener('load', async () => {
      try { await drive(f, s.go); } catch (e) { console.log('drive', e); }
      vp.classList.add('live');
    }, { once: true });
    f.srcdoc = PROTO + `<style>${tv ? TV_CSS : PHONE_CSS}</style>`;
    vp.appendChild(f);
  }
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { io.unobserve(e.target); mount(e.target); } }), { rootMargin: '400px 0px' });
  document.querySelectorAll('.vp').forEach(vp => io.observe(vp));
  document.addEventListener('click', ev => {
    const b = ev.target.closest('[data-replay]'); if (!b) return;
    document.querySelectorAll(`.vp[data-id="${b.dataset.replay}"]`).forEach(mount);
  });

  // parts sheet
  const card = (s, v, cls, word, fx) => {
    const SU = ['Action', 'Target', 'Modifier'], G = { 2: '++', 1: '+', 0: '0', '-1': '−', '-2': '−−', V: '?' };
    const tone = v === 'V' ? 'v-v' : v > 0 ? 'pos' : v < 0 ? 'neg' : 'zero';
    const FS = { null: ['∅', 'Cancels the rest'], x2: ['×2', 'Doubles the rest'], shield: ['≥0', "Rest can't lose"], flip: ['⇅', 'Flips the rest'] };
    const face = fx ? `<div class="split"><b class="glyph ${tone}">${G[v]}</b><b class="eff fx-${fx}">${FS[fx][0]}</b></div><span class="amt">${FS[fx][1]}</span>` : `<b class="glyph ${tone}">${G[v]}</b>`;
    return `<div class="card s-${s} ${fx ? 'has-fx' : ''} ${cls}"><div class="hd"><i class="sp"></i>${SU[s]}</div><div class="fx">${face}</div><span class="word">${word}</span></div>`;
  };
  const coins = n => '<i class="coin"></i>'.repeat(n);
  const sw = (name, v) => `<div class="sw"><i style="background:var(${v})"></i><b>${name}</b><span>${v}</span></div>`;
  const KIT = `<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400..900&family=Share+Tech+Mono&display=swap"><style>${KITCSS}
    html,body{min-height:0!important;height:auto!important} body{padding:22px 18px 28px} .kit{display:grid;gap:28px} .kit h4{margin:0 0 12px;font:800 11px/1 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--on-table-2)}
    .row{display:flex;flex-wrap:wrap;gap:16px 14px;align-items:flex-start} .play{margin:0;padding:18px 14px;background:transparent;box-shadow:none;overflow:visible}
    .note{font:600 12px/1.3 var(--f-body);color:var(--on-table-2);max-width:12ch;margin-top:6px}
    .sw{display:grid;grid-template-columns:34px auto;column-gap:10px;align-items:center;min-width:150px} .sw i{grid-row:span 2;width:34px;height:34px;border-radius:50%;box-shadow:0 0 0 2px rgba(0,0,0,.2),0 2px 4px rgba(0,0,0,.4)} .sw b{font:800 13px/1.1 var(--f-body)} .sw span{font:400 11px/1.2 var(--f-seg);color:var(--on-table-2)}
    .type{display:grid;gap:10px;background:var(--stock);color:var(--ink);border-radius:4px;padding:18px 20px;box-shadow:var(--lift)} .type .a{font:900 34px/1 var(--f-body);letter-spacing:-.03em} .type .b{font:400 15px/1.5 var(--f-body);max-width:60ch} .type .c{font:400 30px/1 var(--f-seg);background:var(--lcd);color:var(--lcd-ink);padding:6px 10px;border-radius:4px;width:max-content}
    .piece{display:grid;justify-items:center;gap:6px} .slot{animation:none!important} .slot::after{display:none}
  </style>
  <div class="kit">
    <section><h4>Values</h4><div class="play"><div class="row">${card(0, 2, '', 'Liquidate')}${card(1, 1, '', 'Interns')}${card(2, 0, '', 'Quietly')}${card(0, -1, '', 'Rightsize')}${card(1, -2, '', 'Union Relations')}${card(2, 'V', '', 'Allegedly')}</div></div></section>
    <section><h4>Effect Modifiers · own value left, effect right</h4><div class="play"><div class="row">${card(2, -1, '', 'With Thoughts and Prayers', 'null')}${card(2, -2, '', 'Retroactively', 'x2')}${card(2, -1, '', "Per Legal's Advice", 'shield')}${card(2, 0, '', 'Without Consultation', 'flip')}</div></div></section>
    <section><h4>Coins</h4><div class="play"><div class="row" style="align-items:center;gap:26px">
      <div class="piece"><span class="purse">${coins(3)}</span><span class="note">Full purse</span></div>
