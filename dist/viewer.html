: 'Certificate', font: 'serif', align: 'center', art: 'planet' }};\n  const FONTS = { grotesk: 'Grotesk', typewriter: 'Typewriter', comic: 'Comic', serif: 'Serif', poster: 'Poster' };\n  const FW = { poster: .58, grotesk: .6, typewriter: .62, comic: .56, serif: .6 };\n  const hash = t => { let h = 7; for (const ch of String(t)) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return h; };\n  function lookOf(e) {\n    const st = e.style || {}, tpl = TPL[st.tpl] ? st.tpl : 'memo', d = TPL[tpl];\n    // bots don't pick clip-art; theirs is dealt from the subject line\n    return { tpl, font: FONTS[st.font] ? st.font : d.font, align: st.align || d.align, art: ART.includes(st.art) ? st.art : ART[hash(e.subject) % ART.length] };\n  }\n  // the subject sized to fill its box: short ones get big, no word wider than the box\n  function subjHTML(text, font, align, base, w, h) {\n    const long = Math.max(...text.split(/\\s+/).map(x => x.length)), W = FW[font];\n    const fs = Math.max(12, Math.min(base * 1.7, Math.sqrt(w * h / (Math.max(6, text.length) * W * 1.2)), w / (long * W * 1.08)));\n    return `<div class=\"cp-subj f-${font}\" style=\"text-align:${align};font-size:${fs.toFixed(1)}px\">${esc(text)}<\/div>`;\n  }\n  // WordArt: short lines, each on a gentle arc in one solid colour with a block shadow\n  function arcHTML(text, font) {\n    const words = text.split(' ');\n    let max = 14, lines;\n    do {\n      lines = [];\n      for (const w of words) { const l = lines[lines.length - 1]; if (l && (l + ' ' + w).length <= max) lines[lines.length - 1] = l + ' ' + w; else lines.push(w); }\n      max += 3;\n    } while (lines.length > 5);\n    const W = FW[font], long = Math.max(...lines.map(l => l.length)), fs = Math.max(14, Math.min(40, 236 / (W * long)));\n    const R = 300, gap = fs * 1.2, sag = R - Math.sqrt(R * R - 118 * 118);\n    const out = lines.map((line, li) => {\n      const step = (fs * W * 1.06) / R, start = -((line.length - 1) * step) / 2;\n      return [...line].map((c, k) => {\n        const t = start + k * step, x = 128 + R * Math.sin(t), y = fs / 2 + li * gap + R * (1 - Math.cos(t));\n        return `<span class=\"l${li % 3}\" style=\"left:${x.toFixed(1)}px;top:${y.toFixed(1)}px;transform:translate(-50%,-50%) rotate(${(t * 180 / Math.PI).toFixed(1)}deg)\">${esc(c)}<\/span>`;\n      }).join('');\n    }).join('');\n    return `<div class=\"cp-arc f-${font}\" role=\"img\" aria-label=\"${esc(text)}\" style=\"font-size:${fs.toFixed(1)}px;height:${(lines.length * gap + sag).toFixed(0)}px\">${out}<\/div>`;\n  }\n  const artBox = (id, cls) => `<span class=\"cp-art ${cls || ''}\">${artSVG(id)}<\/span>`;\n  const redact = w => `<i class=\"cp-redact\" style=\"width:${w}\"><\/i>`;\n  function coverInner(e, L) {\n    const s = e.subject, q = `Q${Math.max(1, S ? S.r : 1)}`, b = brand();\n    const sub = (base, w, h) => subjHTML(s, L.font, L.align, base, w, h);\n    switch (L.tpl) {\n      case 'fax': return `<div class=\"cp-in\"><div class=\"fax-h\">FAX COVER SHEET<\/div>\n        <div class=\"fax-g\"><b>TO:<\/b><span>The CEO<\/span><b>FROM:<\/b>${redact('100%')}<b>PAGES:<\/b><span>3 (incl. this one)<\/span><\/div>\n        <div class=\"grow\">${sub(23, 236, 150)}<\/div><div class=\"fax-f\">If you received this in error, please shred yourself.<\/div><\/div>`;\n      case 'memo': return `<div class=\"cp-in\"><div class=\"memo-h\"><span class=\"memo-seal\">${brandMark()}<\/span><span>${esc(b.name)}<small>${esc(b.suffix)}<\/small><\/span><\/div>\n        <div class=\"memo-t\">MEMORANDUM<\/div><div class=\"memo-g\"><b>TO<\/b><span>All staff<\/span><b>FROM<\/b>${redact('70%')}<b>DATE<\/b><span>${q}<\/span><\/div>\n        <div class=\"grow ruled\">${sub(24, 236, 140)}<\/div><div class=\"memo-lines\"><i><\/i><i><\/i><i><\/i><\/div><\/div>`;\n      case 'wordart': return `<div class=\"cp-in center\">${arcHTML(s, L.font)}<div class=\"grow\">${artBox(L.art, 'big')}<\/div><\/div>`;\n      case 'clipart': return `<div class=\"cp-in center\"><div class=\"clip-h\">Good news!<\/div>${artBox(L.art, 'big')}<div class=\"grow\">${sub(22, 236, 120)}<\/div><\/div>`;\n      case 'report': return `<div class=\"cp-in report\"><div class=\"rep-h\">QUARTERLY REPORT<\/div><div class=\"rep-box\">${sub(23, 164, 110)}<\/div>\n        <div class=\"grow\">${artBox(L.art, 'big')}<\/div><div class=\"rep-f\">${q} · PREPARED BY ${redact('70px')}<\/div><\/div>`;\n      case 'dossier': return `<div class=\"cp-in dos\"><div class=\"dos-stamp\">CONFIDENTIAL<\/div><div class=\"dos-ref\"><span>FILE NO. ${String(hash(s) % 9000 + 1000)}-B<\/span><span>EYES ONLY<\/span><\/div>\n        <div class=\"grow\">${sub(22, 236, 130)}<\/div><div class=\"dos-bars\">${redact('100%')}${redact('64%')}${redact('82%')}<\/div><\/div>`;\n      case 'overhead': return `<div class=\"cp-in oh\">${sub(25, 182, 110)}<div class=\"oh-rule\"><\/div><div class=\"oh-list\"><span>• Profit<\/span><span>• More profit<\/span><span>• Questions (none)<\/span><\/div>\n        <div class=\"grow end\">${artBox(L.art, 'small')}<\/div><\/div>`;\n      default: return `<div class=\"cp-in center cert\"><div class=\"cert-h\">CERTIFICATE OF POLICY<\/div><div class=\"cert-i\">this is to certify that<\/div>\n        <div class=\"grow\">${sub(24, 220, 120)}<\/div><div class=\"cert-i\">is a good idea<\/div><div class=\"cert-seal\">${artBox(L.art, 'small')}<\/div><\/div>`;\n    }\n  }\n  // the page itself: sticky note with the proposal's office icon, stamp in the corner\n  function coverHTML(e, o) {\n    o = o || {};\n    const L = lookOf(e), tilt = o.tilt == null ? ((hash(e.id + e.subject) % 7) - 3) * .6 : o.tilt;\n    return `<div class=\"cp-w\" style=\"${o.k ? `--k:${o.k};` : ''}--t:${tilt}deg\"><div class=\"cp t-${L.tpl}\">${coverInner(e, L)}\n      ${o.note === false ? '' : `<span class=\"cp-note\">${icon(e.id, o.list)}<\/span>`}<span class=\"env-stamp cp-stamp ${e.stamp}\">${STAMP[e.stamp]}<\/span>\n      ${e.approved ? `<span class=\"big-stamp${o.fresh ? '' : ' no-anim'}\" aria-hidden=\"true\">Approved<\/span>` : ''}<\/div><\/div>`;\n  }\n  // ---------- the policy as one sentence: Action, Target, Modifier, highlighted in suit colours ----------\n  const FXSFX = { null: 'pfft.', x2: 'KA-CHING!', shield: 'CLANG!', flip: 'FWOOMP!' };\n  const sfxOf = (c, v) => c.fx ? FXSFX[c.fx] : v > 0 ? 'DING!' : v < 0 ? 'BWAMP.' : 'meh.';\n  // what the Modifier does to the other two\n  const after = (fx, v) => fx === 'null' ? 0 : fx === 'x2' ? 2 * v : fx === 'shield' ? Math.max(0, v) : fx === 'flip' ? -v : v;\n  const val = v => v === 'V' ? '?' : v > 2 || v < -2 ? fmt(v) : GLYPH[v];\n  function lineHTML(e, o) {\n    o = o || {};\n    const all = o.all || e.audited || e.autopilot || e.approved || ui.debug || (mine() && e.author === ME);\n    const vis = su => all || e.revealed.includes(su);\n    if (![0, 1, 2].some(vis)) return '';\n    const fx = e.cards[2].fx, live = o.anim && e.resolved;\n    const ph = e.cards.map((c, su) => {\n      if (!vis(su)) return `<span class=\"ph s-${su} hid\"><mark aria-label=\"Hidden ${OP.SUITS[su]}\">${'█'.repeat(5)}<\/mark><\/span>`;\n      const v = e.resolved ? e.resolved[su] : c.v;\n      const change = live && su < 2 && fx && after(fx, v) !== v;\n      const mark = change ? `<b class=\"v ${tone(v)} was\">${val(v)}<\/b><b class=\"v ${tone(after(fx, v))} now\">${val(after(fx, v))}<\/b>` : `<b class=\"v ${tone(v)}\">${val(v)}<\/b>`;\n      return `<span class=\"ph s-${su}${su === 2 ? ' mod' : ''}\"><mark>${esc(c.w)}<\/mark>${mark}${c.fx ? `<i class=\"fxs\">${FXSYM[c.fx]}<\/i>` : ''}${su === 2 && live ? `<i class=\"sfx\" aria-hidden=\"true\">${sfxOf(c, v)}<\/i>` : ''}<\/span>`;\n    }).join(' ');\n    const sum = e.resolved ? `<b class=\"sum ${tone(OP.total(e.resolved, e.cards))}\">= ${fmt(OP.total(e.resolved, e.cards))}<\/b>` : '';\n    return `<p class=\"line${live ? ' go' : ''}\">${ph}${sum}<\/p>`;\n  }\n\n  function observerHTML() {\n    if (!ui.debug) return '';\n    const sus = S.P.map(p => `<span class=\"pill ${p.sab ? 'red' : 'green'}\">${esc(p.name)} · ${p.sab ? (p.ruthless ? 'SAB · ruthless' : 'SAB') : `LOYAL · ${OP.PERS_SAY[p.pers]}`} · sus ${OP.suspicion(S, p).toFixed(1)}<\/span>`).join('');\n    return `<section class=\"observer\"><div class=\"section-head\" style=\"margin:0;border-bottom-width:1px\"><h2>Observer view<\/h2><span class=\"label\">Hidden from players<\/span><\/div>\n      <div style=\"font-size:13.5px\">Headcount Memo: <b>${S.nSab} saboteur${S.nSab === 1 ? '' : 's'}<\/b>. Loyal bots play <b>${TIER[S.loyalTier]}<\/b>; saboteur bots play <b>${TIER[S.sabTier]}<\/b>. Seed <span class=\"mono\">${S.seed}<\/span>.\n      ${S.nextStyle ? ` Designer has set next quarter: ${S.nextStyle.tpl} in ${S.nextStyle.font}.` : ''}<\/div>\n      <div class=\"observer-grid\">${sus}<\/div>\n      <div class=\"hint\">Debug strips show allegiance · bot mode (loyal, good = saboteur playing clean, disguised, bad) · true value · what the table would estimate · tokens spent. \"sus\" is the end-of-game Whistleblower score the bots use.<\/div><\/section>`;\n  }\n  function exitHTML() {\n    const rounds = S.history.map(h => {\n      const rows = h.envs.slice().sort((a, b) => a.id.localeCompare(b.id)).map(e => {\n        const p = S.P[e.author];\n        const vals = e.cards.map((c, k) => `<span class=\"${tone(e.resolved ? e.resolved[k] : c.v)}\">${fmt(e.resolved ? e.resolved[k] : c.v)}${c.fx ? ' ' + FXSYM[c.fx] : ''}<\/span>`).join(' ');\n        const tot = e.resolved ? OP.total(e.resolved, e.cards) : evs(e.cards);\n        return `<tr class=\"${e.id === h.pick ? 'win' : ''}\"><td class=\"num nw\"><b class=\"ico-cell\">${icon(e.id, h.envs)}<\/b>${e.id === h.pick ? ' ✓' : ''}${e.id === h.audit ? ' <span class=\"pill blue\">aud<\/span>' : ''}<\/td>\n          <td class=\"nw\">${e.autopilot ? 'Autopilot · ' : ''}${esc(p.name)} <span class=\"pill ${p.sab ? 'red' : 'green'}\">${p.sab ? 'Sab' : 'Loyal'}<\/span><\/td>\n          <td class=\"muted\">${OP.DEPTS[e.dept]}<\/td><td class=\"sub-mono\">${esc(e.subject)}<\/td><td>${STAMP[e.stamp]}<\/td><td class=\"num nw\">${vals}<\/td><td class=\"num ${tone(tot)}\"><b>${fmt(tot)}<\/b><\/td><\/tr>`;\n      }).join('');\n      const memos = h.memos.filter(m => m.kind === 'report').map(m => `${esc(nm(m.by))} accused ${esc(nm(m.target))}${m.truthful ? '' : ' <span class=\"lie\">LIE<\/span>'}`).join(' · ');\n      return `<div class=\"exit-round\"><h3>Q${h.r}<span class=\"label\">CEO ${esc(nm(h.ceo))}<\/span>${h.warn && h.warn.passed ? `<span class=\"label\">Warning: ${esc(nm(h.warn.target))}<\/span>` : ''}<\/h3>\n        <div class=\"scroll-x\"><table class=\"exit-t\"><thead><tr><th>Page<\/th><th>Author<\/th><th>Dept<\/th><th>Subject<\/th><th>Stamp<\/th><th>Cards<\/th><th>Value<\/th><\/tr><\/thead><tbody>${rows}<\/tbody><\/table><\/div>\n        ${memos ? `<div class=\"hint\">${memos}<\/div>` : ''}<\/div>`;\n    }).join('');\n    return `<section><div class=\"section-head\"><h2>Exit interview<\/h2><\/div><div class=\"exit\">${rounds}<\/div><\/section>`;\n  }\n\n  // ---------- pieces ----------\n  function meter() {\n    const lo = Math.min(-6, S.profit), hi = Math.max(S.target + 4, S.profit + 1), pct = v => ((v - lo) / (hi - lo)) * 100;\n    const z = pct(0), p = pct(S.profit), left = Math.min(z, p), w = Math.abs(p - z);\n    return `<div class=\"meter\" aria-label=\"Profit ${fmt(S.profit)} of target ${S.target}\">\n      <div class=\"meter-lcd\"><span class=\"ann\"><span>PROFIT<\/span><span>TARGET +${S.target}<\/span><\/span><span class=\"v\" id=\"lcd-profit\">${lcd(ui.shown == null ? S.profit : ui.shown)}<\/span><\/div>\n      <div class=\"meter-track\"><div class=\"bar\"><div class=\"meter-zero\" style=\"left:${z}%\"><\/div><div class=\"meter-fill ${S.profit < 0 ? 'neg' : ''}\" style=\"left:${left}%;width:${w}%\"><\/div><div class=\"meter-tick\" style=\"left:calc(${pct(S.target)}% - 1px)\"><\/div><\/div><div class=\"lbl\"><span>Q${Math.max(1, S.r)}/5<\/span><span>Target<\/span><\/div><\/div><\/div>`;\n  }\n  function mast() {\n    const stats = S ? `<span class=\"tab\"><b>Q${Math.max(1, S.r)}<\/b><span>${PHASE[S.phase]}<\/span><\/span>\n      <div class=\"stat\"><span class=\"label\">CEO<\/span><b>${S.r ? esc(nm(S.ceo)) : '—'}<\/b><\/div>${meter()}` : '';\n    return `<header class=\"mast\"><div class=\"wrap\">\n      <div class=\"logo\"><span class=\"logo-mark\" aria-hidden=\"true\">${brandMark()}<\/span><span class=\"logo-type\"><span class=\"brand-name\">${esc(brand().name)}<\/span><small>${esc(brand().suffix)}<\/small><\/span><\/div>\n      <div class=\"mast-stats\">${stats}<div class=\"tools\">\n        <button class=\"chip-btn\" data-a=\"debug\" aria-pressed=\"${ui.debug}\" title=\"Show hidden roles, proposal contents and bot reasoning\">Observer<\/button>\n        ${S ? '<button class=\"chip-btn\" data-a=\"quit\">New game<\/button>' : ''}<\/div><\/div><\/div><\/header>`;\n  }\n  // longest word sets the type size so no word is ever broken\n  const fit = w => { const L = Math.max(...w.split(/\\s+/).map(x => x.length)); return Math.min(1, 10.5 / L, Math.sqrt(30 / Math.max(30, w.length))).toFixed(2); };\n  function cardHTML(c, cls, extra, attrs) {\n    const face = c.fx ? `${glyph(c.v)}<span class=\"dymo\" title=\"${FXSAY[c.fx]}\"><i class=\"m0\"><\/i><i class=\"m1\"><\/i><b>${FXSYM[c.fx]}<\/b><\/span>` : glyph(c.v);\n    return `<div class=\"card s-${c.s} ${c.fx ? 'has-fx' : ''} ${cls || ''}\" ${attrs || ''}><div class=\"cf\" style=\"--fit:${fit(c.w)}\"><span class=\"word\">${esc(c.w)}<\/span><div class=\"fx\">${face}<\/div><\/div>${extra || ''}<\/div>`;\n  }\n  // the table is a shared screen: authors appear only once approved\n  const authorVisible = e => e.approved || ui.debug;\n  // one proposal on the TV: the cover page, its sentence once anything is shown, then the paperwork\n  function pageHTML(e, opt) {\n    opt = opt || {};\n    const who = authorVisible(e) ? (e.autopilot ? 'Autopilot' : (mine() && e.author === ME ? 'You' : nm(e.author))) : null;\n    const dept = authorVisible(e) ? OP.DEPTS[e.dept] : null;\n    const tags = [];\n    if (e.audited) tags.push('<span class=\"pill blue\">Audited<\/span>');\n    if (e.autopilot) tags.push('<span class=\"pill grey\">Autopilot<\/span>');\n    if (e.unmasked && !e.approved) tags.push(`<span class=\"pill red\">Overruled · ${e.author === S.ceo ? 'the CEO’s own' : esc(nm(e.author))}<\/span>`);\n    const dbg = ui.debug ? `<div class=\"env-dbg\">${S.P[e.author].sab ? 'SAB' : 'LOYAL'} · ${esc(e.mode)} · true ${fmt(evs(e.cards))} · table est ${OP.estimate(e, S.loyalTier, false).toFixed(1)} · spent ${e.cost}${e.redeal ? ' · re-dealt' : ''}<\/div>` : '';\n    const tag = opt.click ? 'button' : 'div';\n    const fresh = e.approved && ui.stamped !== `${S.r}${e.id}`;\n    if (fresh) ui.stamped = `${S.r}${e.id}`;\n    return `<${tag} class=\"pg ${ui.sel === e.id ? 'sel' : ''} ${opt.faded ? 'faded' : ''} ${opt.motion || ''}\" ${opt.click ? `data-a=\"${opt.click}\" data-id=\"${e.id}\" aria-pressed=\"${ui.sel === e.id}\" aria-label=\"${ICON_NAMES[iconIdx(e.id)]}: ${esc(e.subject)}\"` : ''}>\n      ${coverHTML(e, { fresh })}<div class=\"pg-under\">${lineHTML(e, { anim: opt.motion === 'pull' })}\n      ${who ? `<div class=\"pg-from\">From <b>${esc(who)}<\/b>${dept ? ` · ${esc(dept)}` : ''}<\/div>` : ''}${tags.length ? `<div class=\"pg-tags\">${tags.join('')}<\/div>` : ''}${dbg}<\/div><\/${tag}>`;\n  }\n\n  function feedHTML() {\n    const item = f => {\n      const q = `<span class=\"q\">Q${f.r}<\/span>`;\n      if (f.kind === 'memo') {\n        const flag = ui.debug ? (f.truthful ? '<span class=\"true\">TRUE<\/span>' : '<span class=\"lie\">LIE<\/span>') : '';\n        return `<div class=\"feed-item memo\">${q}<div><span class=\"who\">${esc(nm(f.by))}:<\/span> <span class=\"txt\">${esc(f.text)}<\/span>${flag}<\/div><\/div>`;\n      }\n      return `<div class=\"feed-item ${f.kind}\">${q}<div>${esc(f.text)}<\/div><\/div>`;\n    };\n    const cur = S.feed.filter(f => f.r === S.r), old = S.feed.filter(f => f.r !== S.r && f.r > 0);\n    return `<section><div class=\"section-head\"><h2>Bulletin board<\/h2><\/div>\n      <div class=\"feed\">${cur.length ? cur.map(item).join('') : '<div class=\"feed-empty\">Nothing posted this quarter yet.<\/div>'}<\/div>\n      ${old.length ? `<details class=\"rules\" style=\"margin-top:10px\"><summary>Earlier quarters (${old.length})<\/summary><div class=\"feed\" style=\"margin-top:8px\">${old.map(item).join('')}<\/div><\/details>` : ''}<\/section>`;\n  }\n  // the ledger is a till roll: one line printed per quarter, torn off at the total\n  function ledgerHTML() {\n    const rows = [1, 2, 3, 4, 5].map(r => {\n      const l = S.ledger.find(x => x.r === r);\n      if (!l) return `<div class=\"tr-row muted\"><span>Q${r}<\/span><span>${r === S.r ? '. . .' : ''}<\/span><b><\/b><\/div>`;\n      const fresh = r === S.r && ui.printed !== r && (S.phase === 'reveal' || S.phase === 'review');\n      if (fresh) ui.printed = r;\n      return `<div class=\"tr-row${fresh ? ' new' : ''}\"><span>Q${r}<\/span><span>${esc(l.subject)}<small>${l.autopilot ? 'AUTOPILOT' : esc(nm(l.author)).toUpperCase()} · ${esc(STAMP[l.stamp]).toUpperCase()}<\/small><\/span><b class=\"${tone(l.actual)}\">${fmt(l.actual)}<\/b><\/div>`;\n    }).join('');\n    const wb = S.whistle && S.whistle.named != null ? `<div class=\"tr-row\"><span>WB<\/span><span>${S.whistle.correct && S.whistle.clawed.length ? `CLAWBACK ${S.whistle.clawed.map(c => 'Q' + c.r).join(' ')}` : 'WHISTLEBLOWER'}<small>${esc(nm(S.whistle.named)).toUpperCase()}<\/small><\/span><b class=\"${S.whistle.correct ? 'pos' : 'neg'}\">${fmt(S.whistle.swing)}<\/b><\/div>` : '';\n    return `<section class=\"till\" aria-label=\"Ledger\"><div class=\"tr-paper\"><div class=\"tr-head\">${esc(brand().name).toUpperCase()}<small>${esc(brand().suffix).toUpperCase()} · LEDGER<\/small><\/div>\n      ${rows}${wb}<div class=\"tr-total\"><span>TOTAL<\/span><b class=\"${S.profit < 0 ? 'neg' : ''}\">${fmt(S.profit)}<\/b><\/div>\n      <div class=\"tr-foot\">TARGET +${S.target}${S.easy ? ' (EASY)' : ''}<br>** THANK YOU FOR YOUR SERVICE **<\/div><\/div><\/section>`;\n  }\n  // staff are the name tags from the phone; the CEO rotation is a row of desk name plates\n  function staffHTML() {\n    const live = S.phase !== 'end' && S.phase !== 'whistle';\n    const tags = S.P.map(p => {\n      const meta = [];\n      if (S.r && S.ceo === p.id && live) meta.push('<i class=\"tag-tape\">CEO<\/i>');\n      if (p.leave) meta.push('<i class=\"tag-tape grey\">Stood down<\/i>');\n      if (p.spec && ui.debug) meta.push(`<i class=\"tag-tape gold\">${p.spec}<\/i>`);\n      if (ui.debug || S.phase === 'end') meta.push(`<i class=\"tag-tape ${p.sab ? 'red' : 'green'}\">${p.sab ? 'Saboteur' : 'Loyal'}<\/i>`);\n      const dept = S.r && ui.debug ? `<small class=\"tag-dept\">${OP.DEPTS[p.dept]}<\/small>` : '';\n      return `<div class=\"nametag staff-tag${p.leave ? ' down' : ''}\" style=\"--r:${((p.id * 5) % 7 - 3) * .7}deg\"><span class=\"hello\">Hello<small>my name is<\/small><\/span>\n        <b>${p.id === ME && mine() && ui.badge ? `<img class=\"ink-name\" src=\"${ui.badge}\" alt=\"You\">` : esc(p.name)}<\/b>${dept}${meta.length ? `<span class=\"tag-tapes\">${meta.join('')}<\/span>` : ''}${stickers(p)}<\/div>`;\n    }).join('');\n    const plates = OP.ceoSchedule(S).map(c => `<div class=\"plate-n${c.r === S.r && live ? ' now' : c.r < S.r ? ' past' : ''}\"><small>Q${c.r}<\/small><b>${c.who == null ? esc(c.note) : esc(nm(c.who))}<\/b><\/div>`).join('');\n    return `<section class=\"staff-desk\" aria-label=\"Staff\"><div class=\"staff-tags\">${tags}<\/div><div class=\"plates\" aria-label=\"CEO rotation\">${plates}<\/div><\/section>`;\n  }\n  function pilesHTML() {\n    const ph = S.phase;\n    if (ph === 'work') {\n      const sealed = S.envs.length;\n      const cells = S.P.map((p, i) => i < sealed ? '<div class=\"placeholder sealed\">Handed in<\/div>' : '<div class=\"placeholder\"><\/div>').join('');\n      return `<section><div class=\"pages n${S.n}\">${cells}<\/div><\/section>`;\n    }\n    if (!['decide', 'board', 'reveal', 'review'].includes(ph)) return '';\n    const click = ph === 'decide' && isCEO() ? 'sel' : null;\n    const envs = S.envs.slice().sort((a, b) => a.id.localeCompare(b.id));\n    const animKey = `${S.r}|${ph}`, anim = ui.envAnim !== animKey && !still();\n    ui.envAnim = animKey;\n    const motion = e => !anim ? '' : ph === 'board' ? (e.id === S.nominee ? 'pick' : 'fall') : ph === 'reveal' && e.approved ? 'pull' : '';\n    return `<section><div class=\"pages n${envs.length}\">${envs.map(e => pageHTML(e, { motion: motion(e), click, faded: ((ph === 'reveal' || ph === 'review') && !e.approved) || (ph === 'board' && e.id !== S.nominee) })).join('')}<\/div><\/section>`;\n  }\n\n  // ---------- desk: your phone. Objects on the felt, same as the TV; almost no prose ----------\n  // a bakelite header bar (nameplate, time card, timer tape) and a footer bar that holds the one key that matters\n  function deskWrap(title, body, o) {\n    o = o || {};\n    return `<aside class=\"desk\" aria-label=\"Your desk\"><div class=\"desk-head\"><div class=\"bar-row\"><h3 class=\"plate\">${title}<\/h3>${o.right || ''}<\/div>${o.fuse || ''}<\/div>\n      <div class=\"desk-body\">${body}${err ? `<div class=\"err\" role=\"alert\">${esc(err)}<\/div>` : ''}<\/div>${o.foot ? `<div class=\"desk-foot\">${o.foot}<\/div>` : ''}<\/aside>`;\n  }\n  const slip = html => `<span class=\"slip\">${html}<\/span>`;\n  const stampMark = k => `<span class=\"env-stamp ${k}\">${STAMP[k]}<\/span>`;\n  const key = (a, label, on) => `<button class=\"btn primary wide\" data-a=\"${a}\" ${on === false ? 'disabled' : ''}>${label}<\/button>`;\n  const hrs = n => `<i class=\"hrs\">${n}h<\/i>`;\n  function inhSource(inh) {\n    if (inh.kind === 'legacy') return 'Legacy';\n    if (inh.kind === 'cleanup') return `Leftovers <b>${inh.author === ME ? 'yours' : esc(nm(inh.author))}<\/b>`;\n    if (inh.kind === 'autopilot') return 'Autopilot';\n    return `From <b>${inh.author === ME ? 'yourself' : esc(nm(inh.author))}<\/b>${stampMark(inh.stamp)}`;\n  }\n\n  // the cover page: pick a template, then dress it. One timer across both\n  const mockPage = p => ({ id: '·', style: draft.style, subject: subjectOf(draft), stamp: draft.stamp || 'Rec', revealed: [], author: ME, dept: p.dept });\n  function deskTemplates(p) {\n    const arrive = ui.arrive ? ' arrive' : ''; ui.arrive = false;\n    const tiles = OP.TEMPLATES.map(t => `<button class=\"tpl\" data-a=\"tpl\" data-v=\"${t}\" aria-pressed=\"${draft.style.tpl === t}\" aria-label=\"${TPL[t].name}\">${coverHTML(Object.assign(mockPage(p), { style: { tpl: t, art: draft.artSet ? draft.style.art : TPL[t].art } }), { k: .35, note: false })}<\/button>`).join('');\n    return deskWrap(OP.DEPTS[p.dept], `<div class=\"tpls${arrive}\">${tiles}<\/div>`, { fuse: fuse(`${S.r}-dress`, TIME.dress, seal), foot: '<button class=\"btn back wide\" data-a=\"back\">‹ Cards<\/button>' });\n  }\n  const ALIGN = { left: 'M3 5h14M3 10h9M3 15h12', center: 'M3 5h14M6 10h8M4 15h12', right: 'M3 5h14M8 10h9M5 15h12' };\n  function deskTweak(p) {\n    const locked = !!S.reqStyle, L = lookOf(mockPage(p));\n    const arrive = ui.arrive ? ' arrive' : ''; ui.arrive = false;\n    const designer = p.spec === 'Designer' ? `<label class=\"drop\"><select id=\"next-style\" data-in=\"nextStyle\" aria-label=\"Next quarter's cover page\"><option value=\"\">Next quarter: any cover page<\/option>${OP.TEMPLATES.flatMap(t => OP.FONTS.map(f => `<option value=\"${t}/${f}\" ${draft.nextStyle && draft.nextStyle.tpl === t && draft.nextStyle.font === f ? 'selected' : ''}>Next quarter: ${TPL[t].name} · ${FONTS[f]}<\/option>`)).join('')}<\/select><\/label>` : '';\n    const fonts = OP.FONTS.map(f => `<button class=\"chip f-${f}\" data-a=\"font\" data-v=\"${f}\" aria-pressed=\"${L.font === f}\" aria-label=\"${FONTS[f]}\" ${locked ? 'disabled' : ''}>Aa<\/button>`).join('');\n    const aligns = Object.keys(ALIGN).map(a => `<button class=\"chip\" data-a=\"align\" data-v=\"${a}\" aria-pressed=\"${L.align === a}\" aria-label=\"Align ${a}\"><svg viewBox=\"0 0 20 20\" aria-hidden=\"true\"><path d=\"${ALIGN[a]}\"/><\/svg><\/button>`).join('');\n    const wheel = `<div class=\"wheel\"><div class=\"wheel-in\" role=\"listbox\" aria-label=\"Clip-art\" data-wheel>${ART.map(id => `<button class=\"px-opt\" role=\"option\" data-a=\"art\" data-v=\"${id}\" aria-selected=\"${L.art === id}\" aria-label=\"${id.replace(/-/g, ' ')}\">${artSVG(id)}<\/button>`).join('')}<\/div><i class=\"wheel-frame\" aria-hidden=\"true\"><\/i><\/div>`;\n    const body = `<div class=\"preview${arrive}\">${coverHTML(mockPage(p), { k: .6, tilt: -1.2 })}<\/div>\n      <div class=\"subj\">${draft.words.map((k, i) => `<button class=\"subj-word\" data-a=\"reroll\" data-i=\"${i}\" ${draft.useCustom ? 'disabled' : ''}>${esc((S.subj || OP.SUBJ)[i][k])}<\/button>`).join('')}<\/div>\n      <input class=\"input\" id=\"custom-subject\" data-in=\"custom\" maxlength=\"80\" placeholder=\"Or write your own…\" value=\"${esc(draft.custom)}\">\n      <div class=\"dress-row\"><div class=\"chips fonts\">${fonts}<\/div><div class=\"chips aligns\">${aligns}<\/div><\/div>${wheel}${designer}`;\n    return deskWrap(OP.DEPTS[p.dept], body, { fuse: fuse(`${S.r}-dress`, TIME.dress, seal), foot: `<div class=\"two-keys\"><button class=\"btn back\" data-a=\"back\">‹ ${locked ? 'Cards' : 'Templates'}<\/button>${key('seal', 'Hand it in')}<\/div>` });\n  }\n  // the preview and the wheel change in place, so typing and swiping aren't interrupted\n  function refreshPreview() {\n    const pv = document.querySelector('.desk .preview'); if (pv && draft) pv.innerHTML = coverHTML(mockPage(me()), { k: .6, tilt: -1.2 });\n  }\n  const WHEEL = 60;\n  function syncWheel() {\n    const w = document.querySelector('[data-wheel]'); if (!w || !draft) return;\n    w.scrollLeft = Math.max(0, ART.indexOf(lookOf(mockPage(me())).art)) * WHEEL;\n  }\n  function onWheel(w) {\n    const id = ART[Math.max(0, Math.min(ART.length - 1, Math.round(w.scrollLeft / WHEEL)))];\n    if (!draft || draft.style.art === id) return;\n    draft.style.art = id; draft.artSet = true;\n    w.querySelectorAll('[aria-selected=\"true\"]').forEach(b => b.setAttribute('aria-selected', 'false'));\n    const b = w.querySelector(`[data-v=\"${id}\"]`); if (b) b.setAttribute('aria-selected', 'true');\n    refreshPreview();\n  }\n\n  function deskSpectate() {\n    const ph = S.phase;\n    if (ph === 'end') return deskEnd();\n    const label = { decide: 'See the decision', review: S.r < 5 ? `Start Q${S.r + 1}` : 'Whistleblower' }[ph];\n    const bits = [];\n    if (ph === 'review') bits.push(boardSlip(), resultSlip());\n    if (S.warn && ph === 'review') bits.push(slip(S.warn.target == null ? 'No warning' : `Warning · <b>${esc(nm(S.warn.target))}<\/b> ${S.warn.passed ? 'passed' : 'failed'}`));\n    return deskWrap('Observing', `<div class=\"slips\">${bits.join('')}<\/div>`, { foot: label ? key('advance', label) : '' });\n  }\n  function deskEnd() {\n    const sabs = S.P.filter(p => p.sab);\n    const youWon = mine() ? (me().sab ? !S.win : S.win) : null;\n    const line = S.win ? 'Shareholders are mildly pleased. Bonuses have been deferred.' : sabs.length ? 'The company sank, with help.' : 'The company failed entirely on its own merits.';\n    const body = `<div class=\"sheet letter\"><div class=\"role ${S.win ? 'loyal' : 'sab'}\">${youWon == null ? (S.win ? 'Target met' : 'Target missed') : youWon ? 'You win' : 'You lose'}<\/div>\n      <div class=\"num big\">${fmt(S.profit)} <small>/ +${S.target}<\/small><\/div><div>${line}<\/div>\n      <div class=\"hint\">${sabs.length ? `Saboteur${sabs.length > 1 ? 's' : ''}: <b>${sabs.map(p => esc(p.name)).join(', ')}<\/b>` : 'No saboteur'}<\/div><\/div>`;\n    return deskWrap('Final figures', body, { foot: `<div class=\"two-keys\"><button class=\"btn back\" data-a=\"quit\">Settings<\/button>${key('again', 'Again')}<\/div>` });\n  }\n  function desk() {\n    if (S.spectate) return deskSpectate();\n    const p = me(), ph = S.phase;\n    if (ph === 'brief') {\n      // a typed memo on letterhead; the only thing that matters is the rubber stamp\n      const fine = p.sab ? 'Make sure it misses. Quietly.' : S.n >= 6 ? 'Up to two saboteurs. Possibly none.' : 'Possibly a saboteur. Possibly not.';\n      const body = `<div class=\"memo-sheet\">\n        <div class=\"lh\"><span class=\"logo-mark\" aria-hidden=\"true\">${brandMark()}<\/span><span class=\"lh-name\"><span class=\"brand-name\">${esc(brand().name)}<\/span> ${esc(brand().suffix)}<small>People &amp; Culture<\/small><\/span><span class=\"lh-ref\">Q0 / HR / ${String(S.seed % 1000).padStart(3, '0')}<\/span><\/div>\n        <div class=\"memo-row\"><span>To<\/span>${ui.badge ? `<img class=\"ink-name\" src=\"${ui.badge}\" alt=\"You\">` : '<b>You<\/b>'}<\/div>\n        <div class=\"memo-row\"><span>Re<\/span><b>Your allegiance<\/b><\/div>\n        <div class=\"memo-row\"><span>Target<\/span><b>+${S.target}<\/b> by Q5<\/div>\n        <div class=\"memo-stamp ${p.sab ? 'sab' : 'loyal'}\">${p.sab ? 'Saboteur' : 'Loyal'}<\/div>\n        ${p.spec ? `<div class=\"memo-spec\">${p.spec}<small>${p.spec === 'Auditor' ? 'you see who wrote every proposal' : 'you choose next quarter’s cover page'}<\/small><\/div>` : ''}\n        <div class=\"memo-fine\">${fine}<\/div>\n        <svg class=\"memo-sig\" viewBox=\"0 0 160 40\" aria-hidden=\"true\"><path d=\"M4 30c10-18 18-24 22-16s-8 18 2 12 14-22 20-16-6 20 4 14 10-14 16-10 2 12 10 8 12-10 20-8 6 8 14 4 14-6 20-4\"/><\/svg>\n      <\/div>`;\n      return deskWrap('Strictly confidential', body, { foot: key('begin', 'Start Q1') });\n    }\n    if (ph === 'work' && draft) return deskWork();\n    const leave = p.leave ? slip('Stood down') : '';\n    if (ph === 'decide') {\n      if (isCEO()) return deskWrap('You are CEO', `${minis(S.envs.slice().sort((a, b) => a.id.localeCompare(b.id)), ui.sel)}`, { foot: key('approve', ui.sel ? `Nominate ${icon(ui.sel)}` : 'Nominate', !!ui.sel) });\n      const own = S.envs.find(e => !e.autopilot && e.author === ME);\n      return deskWrap(`${esc(nm(S.ceo))} is CEO`, `${leave}${auditor() ? minis(S.envs.slice().sort((a, b) => a.id.localeCompare(b.id)), null) : own ? `<div class=\"board-nom own\">${coverHTML(own, { k: .6 })}${lineHTML(own)}<\/div>` : ''}`, { foot: key('advance', 'See the decision') });\n    }\n    if (ph === 'board') {\n      const nom = S.envs.find(e => e.id === S.nominee);\n      const body = `<div class=\"slips\">${slip(`${esc(nm(S.ceo))} nominated ${icon(S.nominee)}${auditor() && !nom.autopilot ? ` · by <b>${nom.author === ME ? 'you' : esc(nm(nom.author))}<\/b>` : ''}`)}<\/div><div class=\"board-nom\">${coverHTML(nom, { k: .6 })}${lineHTML(nom, { all: nom.openTo && nom.openTo.includes(ME) })}<\/div>\n        <div class=\"bar3 two\" role=\"radiogroup\" aria-label=\"Board vote\">${['ratify', 'open'].map(v => `<button class=\"b-${v}\" role=\"radio\" data-a=\"sel\" data-id=\"${v}\" aria-checked=\"${ui.sel === v}\" aria-pressed=\"${ui.sel === v}\"><span>${v === 'ratify' ? 'Rubber-stamp' : 'Open it'}<\/span><\/button>`).join('')}<\/div>`;\n      return deskWrap('Board vote', `${leave}${body}${signHTML('board', ui.sel === 'ratify' || ui.sel === 'open')}`);\n    }\n    if (ph === 'reveal') {\n      const list = S.P.filter(q => q.id !== ME && !q.leave);\n      const won = S.envs.find(e => e.approved), go = won && ui.lineAnim !== S.r && !still();\n      if (go) ui.lineAnim = S.r;\n      return deskWrap('Written Warning', `<div class=\"slips\">${boardSlip()}${resultSlip()}<\/div>${won ? lineHTML(won, { anim: go }) : ''}${nameTags(list, ui.sel, 'Nobody')}${signHTML('warn', ui.sel != null)}`);\n    }\n    if (ph === 'review') {\n      const w = S.warn;\n      const won = S.envs.find(e => e.approved), got = stickers(p, S.r);\n      return deskWrap('Quarter closed', `<div class=\"slips\">${resultSlip()}${sli     kitBrand();
  });
  try { brandId = localStorage.getItem('op-viewer-brand') || brandId; } catch (e) {}
  const $brands = document.getElementById('brands');
  const drawBrands = () => { $brands.innerHTML = BRANDS.map(b => `<button data-brand="${b.id}" aria-pressed="${b.id === brandId}" style="--c:${b.color}"><i></i>${b.name}</button>`).join(''); };
  drawBrands();
  // the parts sheet is the game itself, printing its own pieces
  function kitBrand() {
    const f = document.getElementById('kit'), w = f.contentWindow;
    if (!w || !w.__op || !w.__op.look) return;
    w.__op.look(brandId, cardSet); f.contentDocument.getElementById('app').innerHTML = kitHTML(w.__op);
  }
  $brands.addEventListener('click', ev => {
    const btn = ev.target.closest('[data-brand]'); if (!btn) return;
    brandId = btn.dataset.brand; drawBrands();
    try { localStorage.setItem('op-viewer-brand', brandId); } catch (e) {}
    // the deal itself uses the company's words, so frames already printed are dealt again
    document.querySelectorAll('.vp').forEach(vp => { if (vp.querySelector('iframe')) mount(vp); });
    kitBrand();
  });
  const $main = document.getElementById('main'), $jump = document.getElementById('jump');
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const device = (kind, s) => kind === 'tv'
    ? `<div class="tv"><div class="screen"><div class="vp" data-kind="tv" data-id="${s.id}"><div class="wait">PRINTING…</div></div></div><div class="stand"></div></div>`
    : `<div class="phone"><div class="screen"><div class="vp" data-kind="phone" data-id="${s.id}"><div class="wait">PRINTING…</div></div></div></div>`;
  $main.innerHTML = SPREADS.map(s => `<section class="spread ${s.only ? 'only-' + s.only : ''}" id="${s.id}">
      <div class="side"><span class="tab"><b>${s.q}</b><span>${s.name}</span></span><button class="replay" data-replay="${s.id}" aria-label="Replay ${s.name}">↻</button></div>
      <div class="stage">${s.only !== 'phone' ? device('tv', s) : ''}${s.only !== 'tv' ? device('phone', s) : ''}</div></section>`).join('')
    + `<section class="spread kit" id="parts"><div class="side"><span class="tab"><b>Kit</b><span>Parts</span></span></div><div><iframe id="kit" title="Parts sheet"></iframe></div></section>`;
  $jump.innerHTML = SPREADS.concat({ id: 'parts', name: 'Parts' }).map(s => `<a href="#${s.id}">${s.name}</a>`).join('');

  // Plays a seeded game inside the frame until it reaches the moment this spread shows.
  async function drive(f, go) {
    const w = f.contentWindow, d = f.contentDocument;
    const click = sel => { const e = d.querySelector(sel); if (e && !e.disabled) { e.click(); return true; } return false; };
    if (go.ph === 'setup') return;
    if (go.ph === 'induction') { w.__op.induction(); return; }
    click(`[data-a=set][data-k=players][data-v="${PLAYERS}"]`);
    w.__opSkipName = go.ph !== 'naming';
    if (go.ph === 'naming') {
      click('[data-a=start]'); await sleep(50);
      const inp = d.getElementById('name-in'); inp.value = 'Joel'; inp.dispatchEvent(new Event('input', { bubbles: true }));
      click('[data-a="name-go"]'); await sleep(400); return;
    }
    const seed = d.getElementById('seed'); seed.value = SEED; seed.dispatchEvent(new Event('input', { bubbles: true }));
    click('[data-a=start]');
    for (let i = 0; i < 500; i++) {
      const S = w.__op && w.__op.S; if (!S) return;
      if (S.phase === go.ph && (go.r == null || S.r === go.r) && !go.page) return;
      if (S.phase === 'brief') click('[data-a=begin]');
      else if (S.phase === 'work') {
        if (click('[data-a=seal]')) { await sleep(20); continue; }
        if (go.page && S.r === go.r) { click('[data-a=finalise]'); await sleep(1500); if (go.page === 3) { click('[data-a=tpl][data-v=wordart]'); await sleep(700); } return; }
        if (click('[data-a=tpl]')) { await sleep(20); continue; }
        click('[data-a=stamp][data-v=Rec]'); click('[data-a=finalise]'); await sleep(1300); }
      else if (!click('.desk [data-a=advance]')) { click('.desk [data-a=sel]'); if (!click('.desk .btn.primary')) w.__op.sign(); }
      await sleep(12);
    }
  }
  function mount(vp) {
    const s = SPREADS.find(x => x.id === vp.dataset.id), tv = vp.dataset.kind === 'tv';
    const old = vp.querySelector('iframe'); if (old) old.remove();
    vp.classList.remove('live');
    const f = document.createElement('iframe');
    f.title = `${s.name}, ${tv ? 'TV' : 'phone'}`;
    const W = tv ? 1360 : 390;
    const fit = () => { const k = vp.clientWidth / W; f.style.width = W + 'px'; f.style.height = (vp.clientHeight / k) + 'px'; f.style.transform = `scale(${k})`; };
    fit(); new ResizeObserver(fit).observe(vp);
    f.addEventListener('load', async () => {
      try { await drive(f, s.go); } catch (e) { console.log('drive', e); }
      vp.classList.add('live');
    }, { once: true });
    f.srcdoc = `<script>window.__opFreeze = true; window.__opBrand = ${JSON.stringify(brandId)}; window.__opCards = ${JSON.stringify(cardSet)}<\/script>` + PROTO + `<style>${tv ? TV_CSS : PHONE_CSS}</style>`;
    vp.appendChild(f);
  }
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { io.unobserve(e.target); mount(e.target); } }), { rootMargin: '400px 0px' });
  document.querySelectorAll('.vp').forEach(vp => io.observe(vp));
  document.addEventListener('click', ev => {
    const b = ev.target.closest('[data-replay]'); if (!b) return;
    document.querySelectorAll(`.vp[data-id="${b.dataset.replay}"]`).forEach(mount);
  });

const KIT_CSS = `html,body{min-height:0!important;height:auto!important} body{padding:22px 18px 28px} .kit{display:grid;gap:28px} .kit h4{margin:0 0 12px;font:800 11px/1 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--on-table-2)}
    .row{display:flex;flex-wrap:wrap;gap:22px 16px;align-items:flex-start} .play{margin:0;padding:18px 14px;background:transparent;box-shadow:none;overflow:visible}
    .note{font:600 12px/1.3 var(--f-body);color:var(--on-table-2);max-width:14ch;margin-top:6px;text-align:center}
    .sw{display:grid;grid-template-columns:34px auto;column-gap:10px;align-items:center;min-width:150px} .sw i{grid-row:span 2;width:34px;height:34px;border-radius:50%;box-shadow:0 0 0 2px rgba(0,0,0,.2),0 2px 4px rgba(0,0,0,.4)} .sw b{font:800 13px/1.1 var(--f-body)} .sw span{font:400 11px/1.2 var(--f-seg);color:var(--on-table-2)}
    .type{display:grid;gap:10px;background:var(--stock);color:var(--ink);border-radius:4px;padding:18px 20px;box-shadow:var(--lift)} .type .a{font:900 34px/1 var(--f-body);letter-spacing:-.03em} .type .b{font:400 15px/1.5 var(--f-body);max-width:60ch} .type .c{font:400 30px/1 var(--f-seg);background:var(--lcd);color:var(--lcd-ink);padding:6px 10px;border-radius:4px;width:max-content}
    .piece{display:grid;justify-items:center;gap:6px} .slot{animation:none!important;width:96px;height:134px} .slot::after{display:none} .pages .pg{width:212px} .pages .pg .cp-w{--k:.74} .line{max-width:340px}
    .kback{width:88px;height:124px;border-radius:7px;display:grid;place-items:center;background:var(--mark) center / 40% no-repeat,radial-gradient(circle,transparent 0 22px,var(--brand) 22.5px 26px,transparent 26.5px),repeating-linear-gradient(45deg,rgba(255,255,255,.12) 0 4px,transparent 4px 9px),var(--brand);box-shadow:inset 0 0 0 5px var(--stock),inset 0 0 0 6px rgba(0,0,0,.2),var(--lift)} .kback.r{transform:rotate(6deg)}`;
  function kitHTML(op) {
    const C = (s, v, w, fx) => ({ s, v, w, fx });
    const card = (c, cls, extra) => op.cardHTML(c, cls, extra);
    const hrs = n => `<i class="hrs">${n}h</i>`, purse = left => `<span class="purse">${[0, 1, 2].map(k => `<i class="slotbox${k >= left ? ' punched' : ''}">${k + 1}</i>`).join('')}</span>`;
    const sw = (name, v) => `<div class="sw"><i style="background:var(${v})"></i><b>${name}</b><span>${v}</span></div>`;
    const page = (tpl, subject, stamp, art) => ({ id: '·', subject, stamp, style: { tpl, art }, revealed: [] });
    const SUBJ = { fax: 'Fwd: Pension Agility — Revised', memo: 'Synergy Alert: Customer Delight for Q3', wordart: 'Action Required: Break Room Monetisation', clipart: 'Low-Hanging Fruit: Bingo Night Synergies',
      report: 'Circling Back: Morale Recovery (Pilot)', dossier: 'Confidential: Inheritance Matchmaking', overhead: 'Granny Retention Drive', certificate: 'Speed Dating (90+) Going Forward' };
    const stamps = ['Risky', 'Rec', 'Rec', 'Risky', 'Rec', 'Not', 'Risky', 'Rec'];
    const pages = Object.keys(SUBJ).map((t, k) => `<div class="pg">${op.coverHTML(page(t, SUBJ[t], stamps[k]), { list: [{ id: '·' }] })}</div>`).join('');
    const said = { id: '·', revealed: [], audited: true, cards: [C(0, 2, 'Restructure'), C(1, 1, 'Next of Kin'), C(2, -2, 'Retroactively', 'x2')], resolved: [2, 1, -2] };
    const part = { id: '·', revealed: [0, 2], cards: [C(0, 2, 'Offshore'), C(1, 1, 'the Regional Office'), C(2, 2, 'In Perpetuity')] };
    return `<style>${KIT_CSS}</style><div class="kit">
    <section><h4>Values</h4><div class="play"><div class="row">${card(C(0, 2, 'Liquidate'))}${card(C(1, 1, 'Interns'))}${card(C(2, 0, 'Quietly'))}${card(C(0, -1, 'Rightsize'))}${card(C(1, -2, 'Union Relations'))}${card(C(2, 'V', 'Allegedly'))}</div></div></section>
    <section><h4>Effect Modifiers</h4><div class="play"><div class="row">${card(C(2, -1, 'With Thoughts and Prayers', 'null'))}${card(C(2, -2, 'Retroactively', 'x2'))}${card(C(2, -1, "Per Legal's Advice", 'shield'))}${card(C(2, 0, 'Without Consultation', 'flip'))}</div></div></section>
    <section><h4>Overtime</h4><div class="play"><div class="row" style="align-items:center;gap:26px">
      <div class="piece">${purse(3)}<span class="note">Three hours to give</span></div><div class="piece">${purse(1)}<span class="note">Two punched</span></div>
      <div class="piece"><div class="slot">${card(C(1, 1, 'Interns'), '', `<span class="tag">${hrs(2)}</span>`)}</div><span class="note">Price to swap in</span></div>
      <div class="piece"><div class="slot">${card(C(0, 2, 'Liquidate'), 'shown', `<span class="paid">${hrs(2)}</span>`)}</div><span class="note">Paid, and shown to the table</span></div>
      <div class="piece"><div class="slot">${card(C(2, 2, 'In Perpetuity'), 'broke', `<span class="tag">${hrs(3)}</span>`)}</div><span class="note">Can't afford</span></div></div></div></section>
    <section><h4>Cover pages</h4><div class="pages" style="justify-content:flex-start">${pages}</div></section>
    <section><h4>The policy, read out</h4><div class="row" style="align-items:center">${op.lineHTML(part)}${op.lineHTML(said, { all: true })}</div></section>
    <section><h4>Clip-art (${op.ART.length})</h4><div class="row" style="gap:10px">${op.ART.map(id => `<span style="display:grid;width:40px;height:40px;padding:4px;background:var(--stock);border-radius:2px">${op.artSVG(id)}</span>`).join('')}</div></section>
    <section><h4>Brand objects</h4><div class="row" style="align-items:center;gap:22px"><span class="logo-mark" style="width:56px;height:56px">${op.brandMark()}</span><div class="kback"></div><div class="kback r"></div><div class="placeholder sealed" style="width:146px;height:206px"></div></div></section>
    <section><h4>Colour</h4><div class="row">${sw('Baize', '--baize')}${sw('Card stock', '--stock')}${sw('Ink', '--ink')}${sw('Red tape', '--red')}${sw('Good news', '--good')}${sw('Brass', '--gold')}${sw('Action', '--suit-0')}${sw('Target', '--suit-1')}${sw('Modifier', '--suit-2')}${sw('Company', '--brand')}</div></section>
    <section><h4>Type</h4><div class="type"><div class="a">Restructure the Orphanage</div><div class="b">Schibsted Grotesk carries everything people read. Shareholders are mildly pleased. Bonuses have been deferred.</div><div class="c">+18.0</div></div></section></div>`;
  }
  const kit = document.getElementById('kit');
  kit.addEventListener('load', () => {
    kitBrand();
    const fit = () => { kit.style.height = kit.contentDocument.body.offsetHeight + 'px'; }; fit(); setTimeout(fit, 800); new ResizeObserver(fit).observe(kit.contentDocument.body);
  });
  kit.srcdoc = `<script>window.__opFreeze = true; window.__opBrand = ${JSON.stringify(brandId)}; window.__opCards = ${JSON.stringify(cardSet)}<\/script>` + PROTO;

})();
</script>
