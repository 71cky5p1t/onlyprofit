<!doctype html>
<meta charset="utf-8">
<title>Petty Cash</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400..900&family=Share+Tech+Mono&family=Courier+Prime:wght@400;700&family=Caveat:wght@700&display=swap">
<style>
/* Layout: the scene fills the screen; the TV strip and table sit on it, your desk is docked at the bottom. One look, no dark variant. */
:root {
  color-scheme: light;
  --paper: #F3ECDA; --paper-2: #E6DCC1; --thermal: #FBFAF5; --rule: #CFC3A4;
  --ink: #1C1B19; --ink-2: #5E5A50; --ink-3: #8C8576;
  --red: #C8241B; --red-lo: #8E160F; --good: #2C6A4E; --gold: #C9A227; --halo: #E9C46A;
  --who: #3F63B8; --what: #C9A227; --act: #C8241B; --cash: #2C6A4E;
  --lcd: #AEBB9E; --lcd-ink: #1E261A; --housing: #2B2C2A;
  --wood: #6E4A2E; --wood-hi: #8A5E3B; --wood-lo: #4A3020;
  --lift: 0 1px 0 rgba(0,0,0,.18), 0 10px 18px -10px rgba(0,0,0,.6);
  --f-body: "Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif;
  --f-seg: "Share Tech Mono", ui-monospace, Menlo, monospace;
  --f-type: "Courier Prime", "Courier New", monospace;
  --f-hand: "Caveat", "Comic Sans MS", cursive;
  --bounce: cubic-bezier(.34, 1.56, .64, 1);
}
* { box-sizing: border-box }
html, body { height: 100% }
body { margin: 0; background: #22392F; color: var(--paper); font: 15px/1.45 var(--f-body); -webkit-font-smoothing: antialiased; overflow-x: hidden }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0 }
button:focus-visible, input:focus-visible { outline: 2px solid var(--halo); outline-offset: 2px }
button:disabled { cursor: default; opacity: .45 }
.num { font-family: var(--f-seg); font-variant-numeric: tabular-nums }
.label { font: 700 11px/1.2 var(--f-type); letter-spacing: .1em; text-transform: uppercase }
#app { position: relative; min-height: 100%; display: flex; flex-direction: column;
  padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px)) }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important } }
/* Company scene: colours per company, light per time of day. Hooks: body[data-co], body[data-tod]. Scene art can replace .scene later. */
.scene { position: fixed; inset: 0; z-index: -1; background: var(--sky); transition: background 1.2s ease }
.scene::before { content: ""; position: absolute; inset: 0; background: var(--motif); opacity: .5 }
.scene::after { content: ""; position: absolute; inset: 0; background: var(--tod, transparent); transition: background 1.2s ease; mix-blend-mode: multiply }
body { --sky: radial-gradient(120% 90% at 50% 0%, #46705F, #35574A 45%, #22392F); --motif: none; --accent: var(--halo) }
body[data-co="party"] { --sky: radial-gradient(120% 90% at 50% 0%, #F6B6C8, #E86F8F 40%, #8E2F5A);
  --motif: repeating-conic-gradient(from 0deg at 50% -40%, rgba(255,255,255,.12) 0 6deg, transparent 6deg 12deg); --accent: #FFD23F }
body[data-co="funeral"] { --sky: radial-gradient(120% 90% at 50% 0%, #6B6A75, #3D3C46 45%, #1E1D24);
  --motif: repeating-linear-gradient(90deg, rgba(255,255,255,.035) 0 40px, transparent 40px 80px); --accent: #C9B37E }
body[data-co="mining"] { --sky: radial-gradient(120% 90% at 50% 0%, #E9A15B, #B4552B 45%, #4A2414);
  --motif: repeating-linear-gradient(-12deg, rgba(0,0,0,.08) 0 14px, transparent 14px 46px); --accent: #F2D04B }
body[data-tod="morning"] { --tod: linear-gradient(180deg, rgba(255,240,200,.25), transparent) }
body[data-tod="smoko"] { --tod: transparent }
body[data-tod="lunch"] { --tod: linear-gradient(180deg, rgba(255,255,255,.12), transparent) }
body[data-tod="arvo"] { --tod: linear-gradient(180deg, rgba(255,170,90,.35), rgba(120,60,20,.15)) }
body[data-tod="knockoff"] { --tod: linear-gradient(180deg, rgba(120,70,140,.55), rgba(60,20,40,.35)) }
body[data-tod="late"] { --tod: linear-gradient(180deg, rgba(20,24,60,.75), rgba(10,10,25,.6)) }
/* The table: letterhead strip, name tags, the in tray and the till roll. */
.game { width: 100%; max-width: 1040px; margin: 0 auto; height: 100vh; height: 100dvh; display: grid; gap: 12px; padding: max(12px, env(safe-area-inset-top, 0px)) 0 0;
  grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto minmax(0, 1fr) auto auto; grid-template-areas: "tv" "tags" "tray" "till" "desk" }
@media (min-width: 820px) { .game { grid-template-columns: minmax(0, 1fr) 280px; grid-template-rows: auto auto minmax(0, 1fr) auto; grid-template-areas: "tv tv" "tags tags" "tray till" "desk desk" } }

.tv { grid-area: tv }
.tags { grid-area: tags }
.tray { grid-area: tray }
.till { grid-area: till }
.desk { grid-area: desk }

/* letterhead strip */
.tv { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 14px; padding: 10px 12px 10px 16px;
  background: linear-gradient(#FFFDF6, var(--paper)); color: var(--ink); border-radius: 4px; box-shadow: var(--lift); border-top: 5px solid var(--accent) }
.tv .co b { display: block; font: 800 clamp(16px, 2.6vw, 22px)/1.05 var(--f-body); letter-spacing: -.01em }
.tv .co span { font: 12px var(--f-type); color: var(--ink-2) }
.tv .rent { text-align: right }
.tv .rent b { display: block; font-size: 20px }
.tv .label { color: var(--ink-3) }
.tin { background: var(--housing); border-radius: 6px; padding: 6px 9px 7px; box-shadow: inset 0 1px 0 rgba(255,255,255,.12), 0 2px 0 #111; min-width: 132px }
.tin .label { color: #9a9a90; font-size: 9px; display: block }
.tin .lcd { display: block; background: var(--lcd); color: var(--lcd-ink); padding: 2px 8px; border-radius: 2px; font-size: 22px; text-align: right;
  box-shadow: inset 0 2px 3px rgba(0,0,0,.35) }
.tin .gauge { display: block; height: 3px; margin-top: 5px; background: #444 }
.tin .gauge i { display: block; height: 100%; background: var(--lcd); transition: width .6s ease }
.tin.low .lcd { animation: lowtin 1.2s steps(2) infinite }
.tin.low .gauge i { background: var(--red) }
@keyframes lowtin { 50% { color: var(--red-lo) } }

/* name tags */
.tags { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 8px; scrollbar-width: none }
.tags::-webkit-scrollbar { display: none }
.tag { position: relative; flex: 1 0 104px; max-width: 170px; text-align: left; padding: 14px 10px 8px; background: var(--paper); color: var(--ink);
  border-radius: 6px; box-shadow: var(--lift); transition: transform .25s var(--bounce), box-shadow .25s }
.tag::before { content: ""; position: absolute; top: 5px; left: 50%; width: 22px; height: 4px; margin-left: -11px; border-radius: 3px; background: rgba(0,0,0,.18); box-shadow: inset 0 1px 1px rgba(0,0,0,.3) }
.tag .nm { display: block; font: 700 14px var(--f-body) }
.tag b { display: block; font-size: 19px; line-height: 1.1 }
.tag.debt b { color: var(--red) }
.tag .marks { display: flex; flex-wrap: wrap; gap: 3px; min-height: 16px; margin-top: 3px; align-items: center }
.tag .cards { font: 11px var(--f-type); color: var(--ink-3) }
.tag.me { background: #FFFDF6 }
.tag.turn { transform: translateY(-4px) rotate(-1deg); box-shadow: 0 0 0 3px var(--accent), 0 16px 22px -12px rgba(0,0,0,.7) }
.tag.pickable { cursor: pointer; animation: pickme 1s ease-in-out infinite }
@keyframes pickme { 50% { box-shadow: 0 0 0 3px var(--red), var(--lift) } }
i.halo { width: 14px; height: 9px; border: 2.5px solid var(--halo); border-radius: 50%; box-shadow: 0 0 6px var(--halo) }
i.caught, i.letter { font: 700 9px/1 var(--f-type); text-transform: uppercase; letter-spacing: .06em; padding: 2px 4px; border: 1.5px solid currentColor; border-radius: 2px; color: var(--red); transform: rotate(-3deg) }
i.letter { color: var(--ink-2) }

/* the in tray */
.tray { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 4px 0 12px; min-height: 0; overflow-y: auto; scrollbar-width: none }
.status { margin: 0; font: 700 clamp(16px, 2.4vw, 20px)/1.25 var(--f-body); text-align: center; text-shadow: 0 1px 2px rgba(0,0,0,.35); color: #fff; max-width: 32ch }
.rcpt { position: relative; width: min(330px, 92%); padding: 16px 18px 26px; background: var(--thermal); color: var(--ink); font-family: var(--f-type);
  box-shadow: 0 18px 30px -16px rgba(0,0,0,.7), 0 2px 0 rgba(0,0,0,.08);
  -webkit-mask: conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) 50% / 14px 100%;
  mask: conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) 50% / 14px 100%;
  animation: printin .5s var(--bounce) both; transform-origin: top }
@keyframes printin { from { transform: translateY(-14px) scaleY(.9); opacity: 0 } }
.rcpt.old { opacity: .82; transform: rotate(1.2deg) scale(.97); animation: none }
.rcpt.lodging { animation: lodge .7s ease-in forwards }
@keyframes lodge { to { transform: translateY(-30px) rotate(-3deg); opacity: .4 } }
.rcpt header { display: flex; justify-content: space-between; border-bottom: 1px dashed var(--ink-3); padding-bottom: 6px; font-size: 12px }
.rcpt .by { margin: 10px 0 0; font-size: 13px; color: var(--ink-2) }
.rcpt .item { margin: 2px 0 10px; font: 800 22px/1.15 var(--f-body); letter-spacing: -.01em; text-wrap: balance }
.rcpt .item .w { color: var(--who) }
.wi { font-family: var(--f-hand); font-weight: 700; font-size: 1.15em; letter-spacing: 0 }
.rcpt dl { display: grid; grid-template-columns: 1fr auto; gap: 3px 10px; margin: 0; font-size: 14px }
.rcpt dt { color: var(--ink-2) }
.rcpt dd { margin: 0; text-align: right }
.redact { color: var(--ink); letter-spacing: -2px; font-family: var(--f-body) }
.rcpt .total { display: flex; justify-content: space-between; align-items: baseline; margin-top: 10px; padding-top: 8px; border-top: 2px solid var(--ink) }
.rcpt .total b { font-size: 26px }
.rcpt.empty { text-align: center; color: var(--ink-3) }
.stamp { position: absolute; left: 50%; top: 52%; padding: 6px 12px; border: 4px solid currentColor; border-radius: 6px; font: 900 22px/1 var(--f-body);
  text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; transform: translate(-50%, -50%) rotate(-12deg); mix-blend-mode: multiply; opacity: .88;
  animation: slam .35s cubic-bezier(.2, 1.6, .4, 1) both; pointer-events: none;
  -webkit-mask: radial-gradient(circle at 30% 40%, #000 60%, rgba(0,0,0,.75) 61%) }
.s-caught { color: var(--red) }
.s-halo { color: #B8901C }
.s-shredded { color: var(--ink-2) }
.s-paid { color: var(--good); font-size: 18px }
.rcpt.old .stamp { animation: none }
@keyframes slam { from { transform: translate(-50%, -50%) rotate(-12deg) scale(2.4); opacity: 0 } }
.rcpt.shredded { background: repeating-linear-gradient(90deg, var(--thermal) 0 18px, #E9E6DA 18px 20px) }

/* sign or audit, on your desk */
.auditbar { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; max-width: 420px }
.stampbtn { padding: 14px 8px; border-radius: 8px; font: 900 18px var(--f-body); text-transform: uppercase; letter-spacing: .05em; color: #fff;
  box-shadow: 0 4px 0 rgba(0,0,0,.35), var(--lift); transition: transform .1s }
.stampbtn:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.35) }
.stampbtn.sign { background: var(--good) }
.stampbtn.audit { background: var(--red) }
.risk { grid-column: 1 / -1; margin: 0; text-align: center; font-size: 13px; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.4) }
.peek { margin-left: 6px; padding: 3px 8px; border-radius: 4px; background: var(--paper); color: var(--ink); font-weight: 700; font-size: 12px }

/* till roll */
.till { align-self: start; padding: 10px 12px 14px; background: var(--thermal); color: var(--ink-2); font: 12.5px/1.4 var(--f-type); border-radius: 2px;
  box-shadow: var(--lift); max-height: 340px; overflow: hidden }
.till p { margin: 0 0 6px; padding-bottom: 6px; border-bottom: 1px dotted var(--rule) }
.till p:last-child { border: 0; margin: 0 }
.till p.top { color: var(--ink); animation: printin .4s ease both }
.till .k-caught, .till .k-debt, .till .k-bust { color: var(--red) }
.till .k-halo { color: #8C6A10 }
.till .k-lap { font-weight: 700; color: var(--ink); text-transform: uppercase; letter-spacing: .06em }
.till .k-bounty, .till .k-win { color: var(--good) }
@media (max-width: 819px) { .till { padding: 6px 10px; font-size: 12px } .till p:nth-child(n+3) { display: none } .till p { margin-bottom: 3px; padding-bottom: 3px } }

/* wide: staff down the left, till on the right */
@media (min-width: 1000px) {
  .game { max-width: 1180px; grid-template-columns: 190px minmax(0, 1fr) 280px; grid-template-rows: auto minmax(0, 1fr) auto; grid-template-areas: "tv tv tv" "tags tray till" "desk desk desk" }
  .tags { flex-direction: column; overflow-y: auto; padding: 4px 8px 8px 0; gap: 6px }
  .tag { flex: 0 0 auto; max-width: none; padding: 11px 10px 6px }
  .tag .cards { display: none }
  .tag.turn { transform: translateX(6px) rotate(-1deg) }
}/* Hand cards: blue who/how, gold what, red action. Write-ins in handwriting. */
.card { position: relative; flex: 0 0 auto; width: 112px; min-height: 150px; padding: 0 9px 9px; display: flex; flex-direction: column; text-align: left;
  background: var(--paper); color: var(--ink); border-radius: 9px; box-shadow: 0 1px 0 rgba(0,0,0,.25), 0 10px 14px -8px rgba(0,0,0,.65);
  transition: transform .2s var(--bounce), box-shadow .2s; --band: var(--ink-3) }
.card::before { content: ""; height: 7px; margin: 0 -9px 8px; border-radius: 9px 9px 0 0; background: var(--band) }
.card .label { font-size: 9px; color: var(--band) }
.card .nm { margin-top: 4px; font: 800 16px/1.12 var(--f-body); letter-spacing: -.01em; overflow-wrap: break-word }
.card .nm .wi { font-size: 22px; line-height: .95; font-weight: 700 }
/* squeeze long words to fit rather than break them */
.card { container-type: inline-size }
.card.long .nm { font-size: min(16px, calc((100cqi - 20px) / (var(--len) * .64))) }
.card.long .nm .wi { font-size: min(22px, calc((100cqi - 20px) / (var(--len) * .42))) }
.card .v { margin-top: auto; padding-top: 6px; font-size: 18px; color: var(--band) }
.card .desc { margin-top: 5px; font: 12px/1.3 var(--f-body); color: var(--ink-2) }
.card.k-who { --band: var(--who) }
.card.k-what { --band: #9C7B12 }
.card.k-what::before { background: var(--what) }
.card.k-act { --band: var(--act); background: #FFF6EE }
.card:hover { transform: translateY(-4px) }
.card.sel { transform: translateY(-12px) rotate(-1.5deg); box-shadow: 0 0 0 3px var(--accent), 0 20px 20px -10px rgba(0,0,0,.7) }
.card.new { animation: dealt .55s var(--bounce) both }
.card.new:nth-child(2n) { animation-delay: .08s }
@keyframes dealt { from { transform: translate(40px, -60px) rotate(14deg) scale(.7); opacity: 0 } }
/* Your desk: a slab of wood docked at the bottom, with real depth. */
.desk { position: relative; margin: 0 -14px; padding: 12px 14px max(14px, env(safe-area-inset-bottom, 0px));
  background: linear-gradient(180deg, var(--wood-hi), var(--wood) 14px, var(--wood-lo)),
    repeating-linear-gradient(90deg, rgba(0,0,0,.05) 0 2px, transparent 2px 9px);
  background-blend-mode: multiply; border-radius: 14px 14px 0 0;
  box-shadow: 0 -2px 0 rgba(255,255,255,.12) inset, 0 -18px 30px -16px rgba(0,0,0,.65) }
@media (min-width: 1068px) { .desk { margin: 0; border-radius: 14px 14px 0 0 } }
.dhead { display: flex; align-items: center; gap: 10px }
.mybank, .mydue { padding: 6px 12px; background: var(--paper); color: var(--ink); border-radius: 5px; box-shadow: var(--lift) }
.mybank b { display: block; font-size: 24px; line-height: 1.05 }
.mybank.debt b { color: var(--red) }
.mydue b { display: block; font-size: 17px }
.mybank .label, .mydue .label { font-size: 9px; color: var(--ink-3) }
.die { margin-left: auto; display: flex; align-items: center; gap: 8px; padding: 6px 14px 6px 8px; border-radius: 10px; background: var(--paper); color: var(--ink);
  box-shadow: 0 4px 0 #B9AE92, var(--lift); transition: transform .12s }
.die .face { font-size: 38px; line-height: 1 }
.die.ready { background: #FFFDF6; box-shadow: 0 0 0 3px var(--accent), 0 4px 0 #B9AE92, var(--lift); animation: nudge 1.6s ease-in-out infinite }
.die:disabled { opacity: .7 }
.die.rolling .face { animation: tumble .65s cubic-bezier(.3, .7, .4, 1) }
@keyframes tumble { 0% { transform: rotate(0) } 40% { transform: rotate(400deg) translateY(-10px) } 100% { transform: rotate(720deg) } }
@keyframes nudge { 50% { transform: translateY(-2px) } }
.hand { display: flex; gap: 8px; overflow-x: auto; padding: 18px 2px 10px; margin: 0 -2px; scrollbar-width: thin }
.emptyhand { color: rgba(255,255,255,.7); font-style: italic; margin: 20px 0 }
.ctl { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; min-height: 8px }
.ctl:empty { display: none }
.ask { flex: 1 1 100%; margin: 0; color: #fff; font-size: 15px; text-shadow: 0 1px 1px rgba(0,0,0,.4) }
.note { margin: 0; color: rgba(255,255,255,.75); font-size: 13px }
.go { padding: 12px 22px; border-radius: 8px; background: var(--accent); color: var(--ink); font: 800 16px var(--f-body);
  box-shadow: 0 4px 0 rgba(0,0,0,.3), var(--lift); transition: transform .1s }
.go:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.3) }
.ghost { padding: 10px 12px; color: rgba(255,255,255,.85); font-weight: 600; text-decoration: underline; text-underline-offset: 3px }
.amount { display: flex; align-items: stretch; gap: 6px }
.amount label { display: flex; flex-direction: column; padding: 4px 10px; background: var(--lcd); color: var(--lcd-ink); border-radius: 4px; box-shadow: inset 0 2px 4px rgba(0,0,0,.35) }
.amount .label { font-size: 9px }
.amount input { width: 120px; border: 0; background: none; color: inherit; font-size: 26px; padding: 0; outline: none }
.step { width: 44px; border-radius: 6px; background: var(--paper); color: var(--ink); font: 800 24px var(--f-body); box-shadow: 0 3px 0 #B9AE92 }
.chips { display: flex; gap: 6px; flex-wrap: wrap }
.chip { display: flex; flex-direction: column; align-items: flex-start; padding: 5px 9px; border-radius: 6px; background: rgba(243,236,218,.92); color: var(--ink); font: 700 11px var(--f-type); text-transform: uppercase; letter-spacing: .05em }
.chip .num { font-size: 14px; letter-spacing: 0 }
.after { flex: 1 1 100%; margin: 0; color: #fff; font-size: 14px }
.after .neg { color: #FFB3A8 }
.nephew { flex: 1 1 100%; color: #fff; font-size: 14px; display: flex; gap: 8px; align-items: center }
/* phones: keep the table and the desk on one screen */
@media (max-width: 560px) {
  .game { gap: 8px }
  .tv { gap: 8px; padding: 7px 8px 7px 12px }
  .tv .co b { font-size: 15px }
  .tv .co span { font-size: 11px }
  .tin { min-width: 0; padding: 4px 6px 5px }
  .tin .lcd { font-size: 17px; padding: 1px 6px }
  .tags { gap: 6px; padding-bottom: 4px }
  .tag { flex: 1 1 0; min-width: 58px; padding: 10px 6px 5px }
  .tag .nm { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
  .tag b { font-size: 14px }
  .tag .marks { min-height: 10px }
  .tag .cards { display: none }
  .desk.busy .hand { display: none }
  .desk.busy .ctl { margin-top: 10px }
  .tray { min-height: 0; gap: 8px }
  .rcpt { padding: 12px 14px 22px }
  .rcpt .item { font-size: 19px; margin-bottom: 6px }
  .rcpt dl { font-size: 13px }
  .rcpt .total b { font-size: 22px }
  .card { width: 100px; min-height: 128px }
  .card .nm { font-size: 13.5px }
  .card .nm .wi { font-size: 20px }
  .card .desc { font-size: 11px }
  .hand { padding-top: 14px }
  .mybank b { font-size: 20px }
  .die .face { font-size: 32px }
}
/* Title, the quick-fire round, the employer reveal, and overlays. */
.title, .quick, .reveal { flex: 1; width: 100%; max-width: 560px; margin: 0 auto; padding: 48px 0 40px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 14px }
.title h1 { margin: 0; font: 900 clamp(46px, 11vw, 78px)/.9 var(--f-body); letter-spacing: -.04em; text-shadow: 0 3px 0 rgba(0,0,0,.25) }
.sub { margin: 0; font: 18px var(--f-type); opacity: .85 }
.tinhero { position: relative; width: 120px; height: 84px; border-radius: 10px 10px 6px 6px; background: linear-gradient(#A9B0B3, #6F777B); box-shadow: inset 0 2px 0 rgba(255,255,255,.4), 0 12px 18px -8px rgba(0,0,0,.7);
  display: grid; place-items: center; transform: rotate(-4deg) }

// Petty Cash bots: pad to make rent, audit claims that look steep, lie low when the tin is nearly empty.
const PC_BOTS = (() => {
  const C = typeof PC_CARDS !== 'undefined' ? PC_CARDS : require('./cards.js');
  const { SUR } = C;
  const SMAX = Math.max(...SUR.map(x => x[1]));
  const q = (guide, c) => SUR.filter(x => guide * x[1] < c).length / SUR.length;
  const has = (p, key) => p.hand.find(c => c.k === 'act' && c.v === key);
  const leader = (s, i) => s.P.every(o => o.id === i || o.bank <= s.P[i].bank);
  const r5 = x => Math.max(0, Math.round(x / 5) * 5);

  function auditCall(s, i, r) {
    const c = s.cur, p = s.P[i], o = s.P[c.seat];
    const form = o.caught * 0.15 - o.halo * 0.1;
    let pa = Math.max(0, (q(c.guide, c.claim) - 0.55) / 0.45) * 0.7 + form;
    // a big claim from the leader is worth checking when the tin is low
    if (s.tin < s.tin0 * 0.3 && leader(s, c.seat)) pa += 0.15;
    if (p.key) pa *= 1.4;
    pa = Math.max(0, Math.min(0.9, pa));
    if (pa > 0.15 && has(p, 'peek')) return 'peek';
    return r < pa ? 'audit' : 'sign';
  }
  function plays(s, i) {
    const p = s.P[i], out = [];
    const cr = has(p, 'creative'); if (cr) out.push({ type: 'play', card: cr.id });
    const k = has(p, 'key'); if (k && !p.key) out.push({ type: 'play', card: k.id });
    const lt = has(p, 'letter');
    if (lt) { const rich = s.P.filter(o => o.id !== i).sort((a, b) => b.bank - a.bank)[0]; out.push({ type: 'play', card: lt.id, target: rich.id }); }
    const fz = has(p, 'freeze'); if (fz && s.freeze !== s.lap && p.bank < s.rent0) out.push({ type: 'play', card: fz.id });
    return out;

    s.P = range(n).map(i => ({ id: i, name: i === 0 && !s.spectate ? 'You' : names[i], human: i === 0 && !s.spectate, bank: 0, hand: [], halo: 0, caught: 0, weasels: 0, key: false, letter: false, claims: 0, pads: 0, greed: 0.2 + 0.6 * rand(s) }));
    // bots answer the quick-fire
    for (const p of s.P) if (!p.human) for (let k = 0; k < 2 + ri(s, 2); k++) s.answers.push({ by: p.id, q: ri(s, PROMPTS.length), text: pickOne(s, ANSWERS) });
    s.start = s.turn = ri(s, n);
    if (s.spectate) deal(s, []);
    return s;
  }
  const card = (s, k, name, v, extra) => Object.assign({ id: 'c' + (s.nid = (s.nid || 0) + 1), k, name, v }, extra || {});
  function deal(s, E) {
    const co = CO[s.co], A = avgGuide(co), pile = [];
    for (const [w, m] of co.who) for (let k = 0; k < 2; k++) pile.push(card(s, 'who', w, m));
    for (const [w, b] of co.what) pile.push(card(s, 'what', w, b));
    for (const a of s.answers) { const t = PROMPTS[a.q][1]; pile.push(card(s, 'what', tidy(a.text), co.tiers[t], { by: a.by, tier: t })); }
    const cashN = Math.round(T.cash * s.n * 2);
    for (let k = 0; k < cashN; k++) pile.push(card(s, 'cash', 'Wages', round5(A * [0.25, 0.5, 0.5, 0.75, 1][k % 5])));
    for (const key of Object.keys(ACTIONS)) for (let k = 0; k < T.act; k++) pile.push(card(s, 'act', ACTIONS[key][0], key));
    s.pile = shuffle(s, pile);
    // everyone starts with two of each receipt half
    for (const p of s.P) for (const k of ['who', 'who', 'what', 'what']) {
      const at = s.pile.findIndex(c => c.k === k); p.hand.push(s.pile.splice(at, 1)[0]);
    }
    s.phase = 'roll';
    log(s, E, 'lap', `Lap 1. Rent is $${rentFor(s, 0)}.`);
  }
  const tidy = t => { t = String(t || '').trim().replace(/\s+/g, ' ').slice(0, 40); return t ? t[0].toUpperCase() + t.slice(1) : 'Something'; };
  function draw(s) {
    if (!s.pile.length) { s.pile = shuffle(s, s.disc); s.disc = []; }
    return s.pile.pop();
  }
  const who = (s, i) => s.P[i].name;
  // 'You' reads right in the feed
  const poss = (s, i) => s.P[i].human ? 'Your' : s.P[i].name + "'s";
  const vb = (s, i, he, you) => s.P[i].human ? you : he;
  function log(s, E, kind, text, extra) { const e = Object.assign({ lap: s.lap, kind, text }, extra || {}); s.feed.push(e); E.push(e); }
  const take = (p, id) => { const at = p.hand.findIndex(c => c.id === id); return at < 0 ? null : p.hand.splice(at, 1)[0]; };
  const has = (p, key) => p.hand.find(c => c.k === 'act' && c.v === key);

  // ---------- turn ----------
  function roll(s, E) {
    const p = s.P[s.turn], k = pickOne(s, DIE), got = [];
    for (let j = 0; j < k; j++) {
      const c = draw(s); if (!c) break;
      if (c.k === 'cash') { p.bank += c.v; s.disc.push(c); } else p.hand.push(c);
      got.push(c);
    }
    s.lastRoll = { seat: s.turn, k, got: got.map(c => c.id) };
    log(s, E, 'roll', `${who(s, s.turn)} rolled ${k}.`, { seat: s.turn, k, cash: got.filter(c => c.k === 'cash').reduce((a, c) => a + c.v, 0) });
    s.phase = 'pick';
  }
  function play(s, i, a, E) {
    const p = s.P[i], c = p.hand.find(x => x.id === a.card);
    if (!c || c.k !== 'act') return 'Not an action card.';
    const key = c.v;
    if (key === 'freeze') { s.freeze = s.lap; log(s, E, 'action', `${who(s, i)} froze the rent this lap.`, { seat: i, key }); }
    else if (key === 'letter') {
      const t = +a.target; if (!(t >= 0 && t < s.n) || t === i) return 'Pick someone else.';
      s.P[t].letter = true; log(s, E, 'action', `${who(s, i)} sent ${who(s, t)} a Landlord's Letter. Double rent.`, { seat: i, key, target: t });
    } else if (key === 'creative') {
      const amt = round5(s.rent0 * 0.5); s.tin -= amt; p.bank += amt;
      log(s, E, 'action', `${who(s, i)} did some Creative Accounting. $${amt} left the tin.`, { seat: i, key });
    } else if (key === 'key') { p.key = true; log(s, E, 'action', `${who(s, i)} pocketed the Petty Cash Key.`, { seat: i, key }); }
    else if (key === 'peek') {
      if (s.phase !== 'audit' || !s.cur || s.cur.seat === i) return 'Use it while a claim is open.';
      s.cur.peeks.push(i); log(s, E, 'peek', 'Payroll Peek.', { seat: i, key, to: i });
    } else return 'That card plays itself at the right time.';
    take(p, c.id); s.disc.push(c);
    if (s.tin < 0) return finish(s, E, true);
    return null;
  }
  function pick(s, a, E) {
    const p = s.P[s.turn];
    if (a.skip) { log(s, E, 'skip', `${who(s, s.turn)} had nothing to claim.`, { seat: s.turn }); return toRent(s, E); }
    const what = p.hand.find(c => c.id === a.what && c.k === 'what');
    const whoC = a.who ? p.hand.find(c => c.id === a.who && c.k === 'who') : null;
    if (!what) return 'Pick a what card.';
    if (a.who && !whoC) return 'Pick a who/how card.';
    take(p, what.id); if (whoC) take(p, whoC.id);
    const sur = pickOne(s, SUR), guide = guideOf(whoC, what);
    s.cur = { seat: s.turn, who: whoC, what, item: itemOf(whoC, what), guide, sur: sur[0], m: sur[1], real: round5(guide * sur[1]), claim: null, calls: {}, peeks: [], nephew: false, outcome: null };
    s.phase = 'claim';
    return null;
  }
  function claim(s, a, E) {
    const c = s.cur, p = s.P[c.seat];
    const amt = round5(+a.amount);
    if (!(amt >= 0) || amt > c.guide * SMAX * 3) return 'Pick an amount.';
    c.claim = amt; p.claims++; if (amt > c.real) p.pads++;
    if (a.nephew) { const n = has(p, 'nephew'); if (!n) return 'No Nephew card.'; take(p, n.id); s.disc.push(n); c.nephew = true; }
    s.claims.push(c);
    log(s, E, 'claim', `${who(s, c.seat)} claimed $${amt} for ${c.item}.`, { seat: c.seat, item: c.item, amount: amt, guide: c.guide, nephew: c.nephew });
    if (c.nephew) return settle(s, E);
    s.phase = 'audit';
    for (const q of s.P) if (q.id !== c.seat && !q.human) {
      let call = B.auditCall(s, q.id, rand(s));
      // a bot peeks, then calls it straight
      if (call === 'peek') { const k = has(q, 'peek'); take(q, k.id); s.disc.push(k); c.peeks.push(q.id); call = c.claim > c.real ? 'audit' : 'sign'; }
      c.calls[q.id] = call;
    }
    if (!needsHuman(s)) return settle(s, E);
    return null;
  }
  function settle(s, E) {
    const c = s.cur, p = s.P[c.seat];
    const willing = Object.keys(c.calls).filter(k => c.calls[k] === 'audit').map(Number);
    const padded = c.claim > c.real;
    if (!willing.length || c.nephew) { pay(s, c.seat, c.claim); c.outcome = 'paid'; }
    else {
      if (c.auditor == null) c.auditor = pickOne(s, willing.sort((x, y) => x - y));
      const sh = has(p, 'shred');
      if (sh && !p.human && padded) return shred(s, true, E);
      if (sh && p.human && !c.noShred) { s.phase = 'shred'; return null; }
      const aud = s.P[c.auditor];
      if (padded) {
        s.tin -= c.real; p.bank += c.real - (c.claim - c.real); aud.bank += c.claim - c.real; p.caught++; c.outcome = 'caught';
        log(s, E, 'caught', `CAUGHT PADDING. ${poss(s, c.seat)} ${c.item} really cost $${c.real}.`, { seat: c.seat, real: c.real, amount: c.claim, sur: c.sur });
        log(s, E, 'bounty', `Your audit paid off: $${c.claim - c.real} bounty.`, { to: c.auditor });
      } else {
        let fine = Math.round(c.claim * T.weasel / 5) * 5;
        if (aud.key) { aud.key = false; fine = 0; }
        s.tin -= c.claim; p.bank += c.claim + fine; aud.bank -= fine; p.halo++; aud.weasels++; c.outcome = 'halo';
        log(s, E, 'halo', `${who(s, c.seat)} ${vb(s, c.seat, 'was', 'were')} investigated and cleared. The ${c.item} really did cost $${c.real}.`, { seat: c.seat, real: c.real, sur: c.sur });
        log(s, E, 'weasel', fine ? `You bad little weasel. $${fine} fine.` : 'You bad little weasel. The Petty Cash Key covered the fine.', { to: c.auditor, fine });
      }
    }
    if (s.tin < 0) return finish(s, E, true);
    return toRent(s, E);
  }
  function pay(s, i, amt) { s.tin -= amt; s.P[i].bank += amt; }
  function shred(s, use, E) {
    const c = s.cur, p = s.P[c.seat];
    if (!use) { c.noShred = true; return settle(s, E); }
    const sh = has(p, 'shred'); take(p, sh.id); s.disc.push(sh);
    pay(s, c.seat, c.guide); c.outcome = 'shredded';
    log(s, E, 'shred', `${who(s, c.seat)} shredded the records. Paid the guide price, $${c.guide}. Nobody will ever know.`, { seat: c.seat });
    if (s.tin < 0) return finish(s, E, true);
    return toRent(s, E);
  }
  function toRent(s, E) {
    s.phase = 'rent';
    const p = s.P[s.turn];
    if (!(p.human && has(p, 'free'))) return payRent(s, p.human ? false : B.useFree(s, s.turn, rentFor(s, s.turn)), E);
    return null;
  }
  function payRent(s, free, E) {
    const i = s.turn, p = s.P[i], due = rentFor(s, i);
    if (free) { const f = has(p, 'free'); if (f) { take(p, f.id); s.disc.push(f); log(s, E, 'rent', `${who(s, i)} played Free Rent.`, { seat: i, free: true }); } else free = false; }
    if (!free) {
      p.bank -= due;
      log(s, E, p.bank < 0 ? 'debt' : 'rent', p.bank < 0 ? `${who(s, i)} couldn't make rent. $${-p.bank} on the tab.` : `${who(s, i)} paid $${due} rent.`, { seat: i, due });
    }
    p.letter = false;
    // hand limit
    while (p.hand.length > T.hand) s.disc.push(p.hand.splice(0, 1)[0]);
    return nextTurn(s, E);
  }
  function nextTurn(s, E) {
    s.cur = null;
    s.turn = (s.turn + 1) % s.n;
    if (s.turn === s.start) {
      s.lap++;
      if (s.lap > T.laps) return finish(s, E, false);
      log(s, E, 'lap', `Lap ${s.lap}. Rent is $${rentFor(s, s.turn)}${s.lap === T.laps ? '. Last lap' : ''}.`);
    }
    s.phase = 'roll';
    return null;
  }
  function finish(s, E, bust) {
    const ranked = s.P.slice().sort((a, b) => b.bank - a.bank || a.id - b.id).map(p => p.id);
    s.end = { bust, ranked, winner: bust ? ranked[1] : ranked[0], jailed: bust ? ranked[0] : null };
    s.phase = 'end'; s.cur = null;
    if (bust) log(s, E, 'bust', `The tin is empty. Royal Commission. ${who(s, ranked[0])} ${vb(s, ranked[0], 'takes', 'take')} the fall. ${who(s, ranked[1])} ${vb(s, ranked[1], 'walks', 'walk')} away clean.`);
    else log(s, E, 'win', `The company survived the year. ${who(s, ranked[0])} ${vb(s, ranked[0], 'is', 'are')} Employee of the Year.`);
    return null;
  }

  // whose input the game is waiting for; -1 means a bot or the game itself
  function needsHuman(s) {
    if (s.spectate || s.phase === 'end') return false;
    if (s.phase === 'shop') return true;
    if (s.phase === 'audit') return s.cur.seat !== 0 && !(0 in s.cur.calls);
    if (['roll', 'pick', 'claim', 'shred', 'rent'].includes(s.phase)) return s.turn === 0;
    return false;
  }

  // ---------- the one entry point ----------
  function apply(state, seat, a) {
    const s = JSON.parse(JSON.stringify(state)), E = [];
    // the open claim and its ledger line are one object
    if (s.cur && s.cur.claim != null) s.claims[s.claims.length - 1] = s.cur;
    let err = null;
    const mine = !s.spectate && seat === 0;
    const myTurn = mine && s.turn === 0;
    switch (a.type) {
      case 'shop':
        if (s.phase !== 'shop' || !mine) { err = 'Not now.'; break; }
        for (const x of (a.answers || []).slice(0, 16)) if (x && PROMPTS[x.q] && String(x.text || '').trim()) s.answers.push({ by: 0, q: x.q, text: String(x.text) });
        deal(s, E); break;
      case 'roll': if (s.phase !== 'roll' || !myTurn) err = 'Not your roll.'; else roll(s, E); break;
      case 'play':
        if (!mine || !((s.phase === 'pick' && myTurn) || s.phase === 'audit')) { err = 'Not now.'; break; }
        err = play(s, 0, a, E); break;
      case 'pick': if (s.phase !== 'pick' || !myTurn) err = 'Not your turn.'; else err = pick(s, a, E); break;
      case 'claim': if (s.phase !== 'claim' || !myTurn) err = 'Not your claim.'; else err = claim(s, a, E); break;
      case 'audit':
        if (s.phase !== 'audit' || !mine || s.cur.seat === 0) { err = 'Nothing to audit.'; break; }
        s.cur.calls[0] = a.call === 'audit' ? 'audit' : 'sign'; err = settle(s, E); break;
      case 'shred': if (s.phase !== 'shred' || !myTurn) err = 'Not now.'; else err = shred(s, !!a.use, E); break;
      case 'rent': if (s.phase !== 'rent' || !myTurn) err = 'Not now.'; else err = payRent(s, !!a.free, E); break;
      case 'advance': err = advance(s, E); break;
      default: err = 'Unknown action.';
    }
    return err ? { error: err } : { state: s, events: E };
  }
  // one bot step for whoever the game is waiting on
  function advance(s, E) {
    if (needsHuman(s)) return 'Waiting for you.';
    const i = s.turn, p = s.P[i];
    switch (s.phase) {
      case 'roll': roll(s, E); return null;
      case 'pick': {
        for (const a of B.plays(s, i)) { const e = play(s, i, a, E); if (s.phase === 'end') return null; if (e) break; }
        return pick(s, B.pick(s, i), E);
      }
      case 'claim': return claim(s, B.claim(s, i, rand(s), rentFor(s, i)), E);
      case 'audit': return settle(s, E);
      case 'shred': return shred(s, true, E);
      case 'rent': return payRent(s, B.useFree(s, i, rentFor(s, i)), E);
      default: return 'Nothing to do.';
    }
  }

  return { T, apply, newGame, needsHuman, rentFor, honestQ, guideOf, itemOf, avgGuide, rand, CO, SUR, ACTIONS, PROMPTS, SMAX };
})();
</script>
<script>
(() => {
// Petty Cash UI: state, the bot driver, toasts. Screens live in the files after this one.
const app = document.getElementById('app');
const ov = document.getElementById('ov');
const ui = { screen: 'title', s: null, opts: { players: 5, co: 'mystery' }, sel: {}, amt: 0, seen: new Set(), hold: 0, rolling: false, busy: false };
const TOD = ['morning', 'smoko', 'lunch', 'arvo', 'knockoff', 'late'];
const TOD_NAME = { morning: 'Morning', smoko: 'Smoko', lunch: 'Lunch', arvo: 'Arvo', knockoff: 'Knock-off', late: 'After hours' };
const SPEED = /fast/.test(location.search) ? 0.25 : 1;
const FACES = ['', '⚀', '⚁', '⚂'];
const esc = t => String(t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = n => (n < 0 ? '−$' : '$') + Math.abs(Math.round(n)).toLocaleString('en-AU');
const co = () => PC.CO[ui.s.co];
const me = () => ui.s.P[0];
const has = (p, key) => p.hand.find(c => c.k === 'act' && c.v === key);
const shuffled = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

// ---------- engine plumbing ----------
function act(a) {
  const r = PC.apply(ui.s, 0, a);
  if (r.error) { toast(r.error); return false; }
  commit(r);
  return true;
}
function commit(r) {
  ui.s = r.state;
  onEvents(r.events);
  setScene();
  if (ui.s.phase === 'end') ui.screen = 'end';
  render();
  pump();
}
// bots move on a timer; outcomes hold the table a beat longer
let pumpT = null;
function pump() {
  clearTimeout(pumpT);
  const s = ui.s;
  if (!s || s.phase === 'end' || s.phase === 'shop' || PC.needsHuman(s)) return;
  const base = { roll: 650, pick: 1000, claim: 1200, audit: 900, shred: 900, rent: 600 }[s.phase] || 800;
  const d = Math.max(base, ui.hold - Date.now()) * SPEED;
  pumpT = setTimeout(() => {
    const r = PC.apply(ui.s, 0, { type: 'advance' });
    if (!r.error) commit(r);
  }, d);
}
function onEvents(E) {
  for (const e of E) {
    if (e.kind === 'caught' || e.kind === 'halo' || e.kind === 'shred') ui.hold = Date.now() + 2600;
    if (e.kind === 'lap') ui.hold = Math.max(ui.hold, Date.now() + 1200);
    if (e.to !== 0) {
      if (e.kind === 'roll' && e.seat === 0 && e.cash) toast(`Wages: +${money(e.cash)}`, 'cash');
      if (e.kind === 'action' && e.target === 0) toast("Landlord's Letter. Your rent is doubled this lap.", 'bad');
      continue;
    }
    if (e.kind === 'weasel') weasel(e);
    else if (e.kind === 'bounty') toast(e.text, 'cash');
    else if (e.kind === 'peek') toast('Payroll Peek: the real cost is on the receipt.');
  }
}
// the company and the time of day light the room
function setScene() {
  const s = ui.s;
  document.body.dataset.co = s && s.phase !== 'shop' ? s.co : '';
  document.body.dataset.tod = s && s.phase !== 'shop' ? TOD[Math.min(TOD.length, s.lap) - 1] : '';
}

// ---------- overlays ----------
function toast(text, tone) {
  const t = document.createElement('div');
  t.className = 'toast ' + (tone || '');
  t.textContent = text;
  ov.appendChild(t);
  setTimeout(() => t.classList.add('out'), 2600);
  setTimeout(() => t.remove(), 3100);
}
function weasel(e) {
  ui.hold = Date.now() + 3200;
  const d = document.createElement('div');
  d.className = 'weasel';
  d.innerHTML = `<div class="slip"><span class="label">Private and confidential</span><h2>You bad little weasel.</h2><p>They were honest. ${e.fine ? `That cost you ${money(e.fine)}.` : 'The Petty Cash Key covered the fine.'}</p></div>`;
  d.onclick = () => d.remove();
  ov.appendChild(d);
  setTimeout(() => d.remove(), 3400);
}

function render() {
  if (ui.screen === 'title') renderTitle();
  else if (ui.screen === 'quick') renderQuick();
  else if (ui.screen === 'reveal') renderReveal();
  else if (ui.screen === 'game') renderGame();
  else if (ui.screen === 'end') renderEnd();
}
// Title, the quick-fire round, and the company reveal.
const QUICK_SECS = +new URLSearchParams(location.search).get('quick') || 45;

function renderTitle() {
  const o = ui.opts;
  const seg = (key, vals) => vals.map(([v, l]) => `<button class="${o[key] === v ? 'on' : ''}" data-${key}="${v}">${l}</button>`).join('');
  app.innerHTML = `<main class="title">
    <div class="tinhero" aria-hidden="true"><i></i><span>PETTY CASH</span></div>
    <h1>Petty Cash</h1>
    <p class="sub">Claim it. Pad it. Make rent.</p>
    <div class="opts">
      <div class="opt"><span class="label">Staff</span><div class="seg">${seg('players', [[4, '4'], [5, '5'], [6, '6']])}</div></div>
      <div class="opt"><span class="label">Employer</span><div class="seg">${seg('co', [['mystery', 'Mystery'], ['party', 'Party hire'], ['funeral', 'Funeral'], ['mining', 'Mine']])}</div></div>
    </div>
    <button class="go" id="go">Clock on</button>
    <details class="how"><summary>How it works</summary><ol>
      <li>Answer quick-fire questions. Don't think too hard.</li>
      <li>Each turn, roll and draw that many cards. Wages go straight in your bank.</li>
      <li>Lodge a receipt from your hand. A secret surcharge sets what it really cost. Claim whatever you like.</li>
      <li>Anyone can audit. Padded: you're caught and the auditor pockets the difference. Honest: you get a halo and they pay a fine.</li>
      <li>Rent goes up every lap. Six laps. If the tin survives, the richest wins. If it runs dry, the richest takes the fall and second place wins.</li>
    </ol></details>
  </main>`;
  app.querySelectorAll('[data-players]').forEach(b => b.onclick = () => { o.players = +b.dataset.players; renderTitle(); });
  app.querySelectorAll('[data-co]').forEach(b => b.onclick = () => { o.co = b.dataset.co; renderTitle(); });
  app.querySelector('#go').onclick = startGame;
}

function startGame() {
  const keys = Object.keys(PC.CO);
  const pick = ui.opts.co === 'mystery' ? keys[Math.floor(Math.random() * keys.length)] : ui.opts.co;
  ui.s = PC.newGame({ players: ui.opts.players, co: pick, seed: (Date.now() ^ (Math.random() * 1e9)) >>> 0 });
  ui.seen = new Set(); ui.sel = {}; ui.hold = 0;
  ui.q = { order: shuffled(PC.PROMPTS.map((_, i) => i)), at: 0, answers: [], left: QUICK_SECS, started: false };
  ui.screen = 'quick';
  setScene();
  render();
}

// ---------- quick-fire: answer until the clock runs out ----------
function renderQuick() {
  const q = ui.q;
  if (!q.started) {
    app.innerHTML = `<main class="quick"><div class="qcard intro">
      <span class="label">Before you start</span>
      <h2>Quick-fire round.</h2>
      <p>${QUICK_SECS} seconds. Answer everything. First thing that comes to mind.</p>
      <button class="go" id="qs">Go</button></div></main>`;
    app.querySelector('#qs').onclick = () => { q.started = true; q.t0 = Date.now(); renderQuick(); tick(); };
    return;
  }
  const qi = q.order[q.at % q.order.length];
  app.innerHTML = `<main class="quick">
    <div class="qtop"><span class="label">Quick-fire</span><div class="fuse"><i id="fuse"></i></div><b class="num" id="qclock"></b></div>
    <div class="qcard" id="qcard">
      <span class="label">Question ${q.at + 1}</span>
      <h2>${esc(PC.PROMPTS[qi][0])}</h2>
      <form id="qf"><input id="qin" autocomplete="off" autocapitalize="sentences" maxlength="40" placeholder="Type anything" enterkeyhint="next"><button class="enter" aria-label="Answer">↵</button></form>
      <button class="pass" id="qp">Next question</button>
    </div>
    <div class="spike"><span class="label">${q.answers.length} answer${q.answers.length === 1 ? '' : 's'}</span>
      <div class="slips">${q.answers.slice(-6).map((a, k, arr) => `<span class="slip ${k === arr.length - 1 && q.fresh ? 'new' : ''}" style="--r:${(a.text.length * 7) % 9 - 4}deg">${esc(a.text)}</span>`).join('')}</div>
    </div>
  </main>`;
  q.fresh = false;
  const inp = app.querySelector('#qin');
  inp.focus();
  app.querySelector('#qf').onsubmit = ev => {
    ev.preventDefault();
    const t = inp.value.trim();
    if (!t) return;
    q.answers.push({ q: qi, text: t }); q.at++; q.fresh = true;
    renderQuick();
  };
  app.querySelector('#qp').onclick = () => { q.at++; renderQuick(); };
  paintClock();
}
function paintClock() {
  const q = ui.q, left = Math.max(0, QUICK_SECS - (Date.now() - q.t0) / 1000);
  const c = app.querySelector('#qclock'), f = app.querySelector('#fuse');
  if (c) c.textContent = '0:' + String(Math.ceil(left)).padStart(2, '0');
  if (f) { f.style.width = (left / QUICK_SECS * 100) + '%'; f.parentNode.classList.toggle('low', left < 10); }
  return left;
}
function tick() {
  if (ui.screen !== 'quick') return;
  if (paintClock() > 0) return void setTimeout(tick, 200);
  // keep a half-typed answer
  const inp = app.querySelector('#qin');
  if (inp && inp.value.trim()) ui.q.answers.push({ q: ui.q.order[ui.q.at % ui.q.order.length], text: inp.value.trim() });
  app.innerHTML = `<main class="quick"><div class="qcard intro timeup"><span class="label">Pens down</span><h2>Time's up.</h2></div></main>`;
  setTimeout(() => {
    const r = PC.apply(ui.s, 0, { type: 'shop', answers: ui.q.answers });
    ui.s = r.state;
    ui.screen = 'reveal';
    setScene();
    render();
  }, 1300);
}

// ---------- the mystery employer ----------
function renderReveal() {
  const c = co(), mine = ui.q.answers.slice(0, 16);
  const shown = shuffled(mine).slice(0, 3);
  app.innerHTML = `<main class="reveal">
    <span class="label">Your new employer</span>
    <div class="cosign"><h1>${esc(c.name)}</h1><p>${esc(c.tag)}</p></div>
    <p class="brief">${esc(c.prompt)}</p>
    ${shown.length ? `<p class="gotcha">Everything you just said is now a line item.</p>
    <div class="items">${shown.map((a, k) => `<div class="mini" style="--d:${0.9 + k * 0.35}s"><span class="wi">${esc(a.text)}</span><b class="num">${money(c.tiers[PC.PROMPTS[a.q][1]])}</b></div>`).join('')}</div>` : `<p class="gotcha">You said nothing. Very professional.</p>`}
    <button class="go" id="go">Start the year</button>
  </main>`;
  app.querySelector('#go').onclick = () => { ui.screen = 'game'; render(); pump(); };
}
// The table: TV strip, name tags, the in-tray receipt, the till roll.
function renderGame() {
  const s = ui.s;
  app.innerHTML = `<main class="game">${strip(s)}${tags(s)}<section class="tray">${tray(s)}</section>${till(s)}${desk(s)}</main>`;
  wireTable(s);
  wireDesk(s);
  for (const c of me().hand) ui.seen.add(c.id);
}

function strip(s) {
  const tod = TOD[Math.min(TOD.length, s.lap) - 1];
  const f = Math.max(0, s.tin / s.tin0);
  return `<header class="tv">
    <div class="co"><b>${esc(co().name)}</b><span>Lap ${Math.min(s.lap, PC.T.laps)} of ${PC.T.laps} · ${TOD_NAME[tod]}</span></div>
    <div class="tin ${f < 0.25 ? 'low' : ''}"><span class="label">Petty cash tin</span><b class="num lcd">${money(s.tin)}</b><i class="gauge"><i style="width:${f * 100}%"></i></i></div>
  </header>`;
}

function tags(s) {
  return `<section class="tags">${s.P.map(p => {
    const cls = ['tag', p.human ? 'me' : '', s.turn === p.id && s.phase !== 'end' ? 'turn' : '', p.bank < 0 ? 'debt' : '', ui.target && !p.human ? 'pickable' : ''].join(' ');
    return `<button class="${cls}" data-seat="${p.id}" ${ui.target && !p.human ? '' : 'tabindex="-1"'}>
      <span class="nm">${esc(p.name)}</span>
      <b class="num">${money(p.bank)}</b>
      <span class="marks">${'<i class="halo" title="Cleared"></i>'.repeat(Math.min(p.halo, 4))}${p.caught ? `<i class="caught">Padded${p.caught > 1 ? ' ×' + p.caught : ''}</i>` : ''}${p.letter ? '<i class="letter">2× rent</i>' : ''}</span>
      <span class="cards">${p.hand.length} cards</span>
    </button>`;
  }).join('')}</section>`;
}

// what's happening, in one line
function status(s) {
  const p = s.P[s.turn], you = p.human, n = esc(p.name);
  const r = s.lastRoll && s.lastRoll.seat === s.turn ? s.lastRoll.k : 0;
  switch (s.phase) {
    case 'roll': return you ? 'Your turn. Roll for cards.' : `${n} is rolling.`;
    case 'pick': return you ? `You rolled ${r}. Pick a receipt to lodge.` : `${n} rolled ${r} and is going through receipts.`;
    case 'claim': return you ? 'How much are you claiming?' : `${n} is filling in a claim.`;
    case 'audit': return s.cur.seat !== 0 && !(0 in s.cur.calls) ? `${n} wants ${money(s.cur.claim)}. Sign it or audit?` : 'With Accounts.';
    case 'shred': return you ? "You're being audited." : `${n} is being audited.`;
    case 'rent': return you ? 'Rent day.' : `${n} is paying rent.`;
    default: return '';
  }
}

function tray(s) {
  const c = s.cur && (s.cur.claim != null || s.cur.seat === 0) ? s.cur : s.claims[s.claims.length - 1];
  return `<p class="status">${status(s)}</p>
    ${c ? receipt(s, c, c !== s.cur) : `<div class="rcpt empty"><span class="label">In tray</span><p>No claims yet.</p></div>`}`;
}

// a thermal receipt; the real cost stays blacked out until someone finds out
function receipt(s, c, old) {
  const mine = c.seat === 0, no = s.claims.indexOf(c) + 1 || s.claims.length + 1;
  const peeked = c.peeks && c.peeks.includes(0);
  const known = mine || peeked || c.outcome === 'caught' || c.outcome === 'halo';
  const bar = '<span class="redact">██████</span>';
  const stamp = { caught: 'Caught padding', halo: 'Cleared', shredded: 'Shredded', paid: c.nephew ? 'Nephew of the CEO' : 'Signed' }[c.outcome] || '';
  const write = c.what.by != null ? 'wi' : '';
  return `<article class="rcpt ${old ? 'old' : ''} ${c.outcome || ''}">
    <header><span class="label">Expense claim</span><span class="num">No. ${String(no).padStart(4, '0')}</span></header>
    <p class="by">${esc(s.P[c.seat].name)}</p>
    <p class="item">${c.who ? `<span class="w">${esc(c.who.name)}</span> ` : ''}<span class="${write}">${esc(c.what.name)}</span></p>
    <dl>
      <dt>Guide price</dt><dd class="num">${money(c.guide)}</dd>
      <dt>Surcharge</dt><dd>${known ? `${esc(c.sur)} <span class="num">×${c.m}</span>` : bar}</dd>
      <dt>Real cost</dt><dd class="num">${known ? money(c.real) : bar}</dd>
    </dl>
    <div class="total"><span class="label">Claimed</span><b class="num">${c.claim != null ? money(c.claim) : '—'}</b></div>
    ${stamp ? `<div class="stamp s-${c.outcome}">${stamp}</div>` : ''}
  </article>`;
}

function auditBar(s) {
  const c = s.cur, fine = Math.round(c.claim * PC.T.weasel / 5) * 5, pk = has(me(), 'peek');
  return `<div class="auditbar">
    <button class="stampbtn sign" id="sign">Sign it</button>
    <button class="stampbtn audit" id="audit">Audit</button>
    <p class="risk">${me().key ? 'Wrong call is free: you hold the Key.' : `Wrong call costs you ${money(fine)}.`}${pk && !c.peeks.includes(0) ? ' <button class="peek" id="peek">Use Payroll Peek</button>' : ''}</p>
  </div>`;
}

function till(s) {
  const lines = s.feed.filter(e => e.to == null || e.to === 0).slice(-5).reverse();
  return `<section class="till" aria-live="polite">${lines.map((e, k) => `<p class="k-${e.kind} ${k ? '' : 'top'}">${esc(e.text)}</p>`).join('')}</section>`;
}

function wireTable(s) {
  const q = id => app.querySelector(id);
  if (q('#sign')) q('#sign').onclick = () => act({ type: 'audit', call: 'sign' });
  if (q('#audit')) q('#audit').onclick = () => act({ type: 'audit', call: 'audit' });
  if (q('#peek')) q('#peek').onclick = () => act({ type: 'play', card: has(me(), 'peek').id });
  if (ui.target) app.querySelectorAll('.tag.pickable').forEach(b => b.onclick = () => {
    const card = ui.target; ui.target = null; ui.sel = {};
    act({ type: 'play', card, target: +b.dataset.seat });
  });
}
// Your desk: bank, the die, your hand, and whatever the moment asks of you.
const PLAYABLE = { freeze: 1, letter: 1, creative: 1, key: 1 };

function desk(s) {
  const p = me(), myTurn = s.turn === 0;
  const rent = PC.rentFor(s, 0);
  const busy = (s.phase === 'claim' && myTurn) || (s.phase === 'audit' && s.cur.seat !== 0 && !(0 in s.cur.calls));
  return `<section class="desk ${busy ? 'busy' : ''}">
    <div class="dhead">
      <div class="mybank ${p.bank < 0 ? 'debt' : ''}"><span class="label">${p.bank < 0 ? 'On the tab' : 'Your bank'}</span><b class="num">${money(p.bank)}</b></div>
      <div class="mydue"><span class="label">Rent this lap</span><b class="num">${money(rent)}</b></div>
      ${dieBtn(s, myTurn)}
    </div>
    <div class="hand">${handCards(s)}</div>
    <div class="ctl">${control(s)}</div>
  </section>`;
}

function dieBtn(s, myTurn) {
  const k = s.lastRoll && s.lastRoll.seat === 0 ? s.lastRoll.k : 0;
  const can = myTurn && s.phase === 'roll';
  return `<button class="die ${can ? 'ready' : ''} ${ui.rolling ? 'rolling' : ''}" id="die" ${can ? '' : 'disabled'} aria-label="Roll">
    <span class="face">${FACES[k] || '⚄'}</span><span class="label">${can ? 'Roll' : k ? `Drew ${k}` : 'Die'}</span></button>`;
}

function cardHtml(c) {
  const sel = ui.sel.who === c.id || ui.sel.what === c.id || ui.sel.act === c.id;
  const fresh = !ui.seen.has(c.id);
  const k = { who: 'Who / how', what: 'What', act: 'Action' }[c.k];
  let v = '', nm = esc(c.name), sub = '';
  if (c.k === 'who') v = '×' + c.v;
  if (c.k === 'what') { v = money(c.v); if (c.by != null) nm = `<span class="wi">${nm}</span>`; }
  if (c.k === 'act') sub = `<span class="desc">${esc(PC.ACTIONS[c.v][1])}</span>`;
  const len = Math.max(...String(c.name).split(/\s+/).map(w => w.length));
  return `<button class="card k-${c.k} ${len > 9 ? 'long' : ''} ${sel ? 'sel' : ''} ${fresh ? 'new' : ''}" data-card="${c.id}" style="--len:${len}">
    <span class="label">${k}</span><span class="nm">${nm}</span>${sub}${v ? `<span class="v num">${v}</span>` : ''}</button>`;
}

function handCards(s) {
  const order = { who: 0, what: 1, act: 2 };
  const h = me().hand.slice().sort((a, b) => order[a.k] - order[b.k] || (a.k === 'act' ? 0 : b.v - a.v));
  return h.length ? h.map(cardHtml).join('') : '<p class="emptyhand">Nothing in your hand.</p>';
}

// one control at a time, depending on the phase
function control(s) {
  const p = me(), myTurn = s.turn === 0;
  if (ui.target) return `<p class="ask">Pick who gets the Landlord's Letter.</p><button class="ghost" id="cancel">Never mind</button>`;
  const a = ui.sel.act && p.hand.find(c => c.id === ui.sel.act);
  if (a) {
    const can = PLAYABLE[a.v] && myTurn && s.phase === 'pick';
    const when = { shred: 'It plays when you get audited.', nephew: 'It plays when you lodge a claim.', peek: 'It plays while someone else has a claim open.', free: 'It plays on rent day.' }[a.v];
    return `<p class="ask"><b>${esc(PC.ACTIONS[a.v][0])}.</b> ${esc(PC.ACTIONS[a.v][1])}</p>
      ${can ? `<button class="go" id="playact">Play it</button>` : `<p class="note">${when || 'Play it on your turn, after you roll.'}</p>`}
      <button class="ghost" id="cancel">Put it back</button>`;
  }
  if (s.phase === 'audit' && s.cur.seat !== 0 && !(0 in s.cur.calls)) return auditBar(s);
  if (!myTurn) return '';
  if (s.phase === 'pick') {
    const who = p.hand.find(c => c.id === ui.sel.who), what = p.hand.find(c => c.id === ui.sel.what);
    const g = what ? PC.guideOf(who, what) : 0;
    return `<p class="ask">${what ? `<b>${esc(PC.itemOf(who, what))}</b> · guide <span class="num">${money(g)}</span>` : 'Pick a what, and a who/how if you like.'}</p>
      <button class="go" id="lodge" ${what ? '' : 'disabled'}>Lodge receipt</button>
      <button class="ghost" id="skip">Nothing to claim</button>`;
  }
  if (s.phase === 'claim') return claimCtl(s);
  if (s.phase === 'shred') return `<p class="ask">Someone's auditing your claim.</p>
    <button class="go" id="shredy">Shred the records</button><button class="ghost" id="shredn">Let them look</button>`;
  if (s.phase === 'rent') return `<p class="ask">Rent's due: <span class="num">${money(PC.rentFor(s, 0))}</span>.</p>
    <button class="go" id="freey">Play Free Rent</button><button class="ghost" id="freen">Pay it</button>`;
  return '';
}

function claimCtl(s) {
  const c = s.cur, p = me();
  if (ui.amt == null || ui.amtFor !== c.item + c.guide) { ui.amt = c.real; ui.amtFor = c.item + c.guide; ui.nephew = false; }
  const chips = [['Honest', c.real], ['Guide', c.guide], ['+50%', c.real * 1.5], ['Double', c.real * 2]]
    .map(([l, v]) => `<button class="chip" data-amt="${Math.round(v / 5) * 5}">${l}<span class="num">${money(Math.round(v / 5) * 5)}</span></button>`).join('');
  return `<div class="amount">
      <button class="step" data-step="-1" aria-label="Less">−</button>
      <label><span class="label">Claim</span><input id="amt" class="num" inputmode="numeric" value="${ui.amt}"></label>
      <button class="step" data-step="1" aria-label="More">+</button>
    </div>
    <div class="chips">${chips}</div>
    <p class="after" id="after">${afterLine(s)}</p>
    ${has(p, 'nephew') ? `<label class="nephew"><input type="checkbox" id="neph" ${ui.nephew ? 'checked' : ''}> Lodge with Nephew of the CEO (no audits)</label>` : ''}
    <button class="go" id="claim">Lodge claim</button>`;
}
function afterLine(s) {
  const c = s.cur, pad = ui.amt - c.real, left = me().bank + ui.amt - PC.rentFor(s, 0);
  return `${pad > 0 ? `Padding <b class="num">${money(pad)}</b>.` : pad < 0 ? `Under by <b class="num">${money(-pad)}</b>.` : 'Honest.'} After rent you'd have <b class="num ${left < 0 ? 'neg' : ''}">${money(left)}</b>.`;
}

function wireDesk(s) {
  const q = id => app.querySelector(id), on = (id, f) => { const b = q(id); if (b) b.onclick = f; };
  const p = me();
  app.querySelectorAll('.hand .card').forEach(b => b.onclick = () => {
    const c = p.hand.find(x => x.id === b.dataset.card);
    if (c.k === 'act') ui.sel = { act: ui.sel.act === c.id ? null : c.id };
    else {
      if (ui.sel.act) ui.sel = {};
      if (!(s.turn === 0 && s.phase === 'pick')) { toast(s.turn !== 0 ? 'Wait for your turn.' : s.phase === 'roll' ? 'Roll first.' : 'Not now.'); return; }
      ui.sel[c.k] = ui.sel[c.k] === c.id ? null : c.id;
    }
    render();
  });
  on('#die', () => {
    ui.rolling = true; render();
    setTimeout(() => { ui.rolling = false; act({ type: 'roll' }); }, 650);
  });
  on('#cancel', () => { ui.sel = {}; ui.target = null; render(); });
  on('#playact', () => {
    const c = p.hand.find(x => x.id === ui.sel.act);
    if (c.v === 'letter') { ui.target = c.id; ui.sel = { act: c.id }; render(); return; }
    ui.sel = {}; act({ type: 'play', card: c.id });
  });
  on('#lodge', () => { const a = { type: 'pick', what: ui.sel.what, who: ui.sel.who || null }; ui.sel = {}; ui.amt = null; act(a); });
  on('#skip', () => { ui.sel = {}; act({ type: 'pick', skip: true }); });
  on('#shredy', () => act({ type: 'shred', use: true }));
  on('#shredn', () => act({ type: 'shred', use: false }));
  on('#freey', () => act({ type: 'rent', free: true }));
  on('#freen', () => act({ type: 'rent', free: false }));
  // the claim
  const amt = q('#amt');
  if (!amt) return;
  const set = v => { ui.amt = Math.max(0, Math.round(v / 5) * 5); amt.value = ui.amt; q('#after').innerHTML = afterLine(s); };
  amt.oninput = () => { const v = parseInt(amt.value.replace(/\D/g, ''), 10) || 0; ui.amt = v; q('#after').innerHTML = afterLine(s); };
  amt.onblur = () => set(ui.amt);
  const step = Math.max(5, Math.round(s.cur.guide * 0.1 / 5) * 5);
  app.querySelectorAll('.step').forEach(b => b.onclick = () => set(ui.amt + step * +b.dataset.step));
  app.querySelectorAll('.chip').forEach(b => b.onclick = () => set(+b.dataset.amt));
  on('#neph', () => { ui.nephew = q('#neph').checked; });
  on('#claim', () => {
    if (ui.busy) return;
    set(ui.amt);
    ui.busy = true;
    q('.tray .rcpt').classList.add('lodging');
    q('#claim').disabled = true;
    setTimeout(() => { ui.busy = false; act({ type: 'claim', amount: ui.amt, nephew: ui.nephew }); }, 700);
  });
}
// End of the financial year: the verdict, the rankings, and everybody's receipts.
function renderEnd() {
  const s = ui.s, e = s.end, P = s.P;
  const nm = i => esc(P[i].name);
  const lap = Math.min(s.lap, PC.T.laps);
  const verdict = e.bust
    ? `<span class="label">Lap ${lap} · the tin is empty</span><h1>Royal Commission</h1><p>${nm(e.jailed)} had the most money, so ${P[e.jailed].human ? 'you take' : nm(e.jailed) + ' takes'} the fall. ${nm(e.winner)} ${P[e.winner].human ? 'walk' : 'walks'} away clean.</p>`
    : `<span class="label">End of financial year</span><h1>${P[e.winner].human ? 'Employee of the Year' : nm(e.winner) + ' wins'}</h1><p>The tin survived with ${money(s.tin)} left. ${P[e.winner].human ? 'Nobody suspects a thing.' : 'Richest at the end takes it.'}</p>`;
  const rows = e.ranked.map((i, k) => {
    const p = P[i], tag = i === e.winner ? 'Winner' : i === e.jailed ? 'Jailed' : '';
    return `<li class="${p.human ? 'me' : ''} ${tag.toLowerCase()}"><span class="pl num">${k + 1}</span><span class="nm">${nm(i)}</span>
      <span class="st">${p.pads}/${p.claims} padded${p.caught ? ` · caught ${p.caught}` : ''}${p.halo ? ` · ${p.halo} halo${p.halo > 1 ? 's' : ''}` : ''}</span>
      <b class="num">${money(p.bank)}</b>${tag ? `<i class="badge">${tag}</i>` : ''}</li>`;
  }).join('');
  const out = c => {
    const pad = c.claim - c.real;
    if (c.outcome === 'caught') return '<i class="o caught">Caught</i>';
    if (c.outcome === 'halo') return '<i class="o halo">Cleared</i>';
    if (c.outcome === 'shredded') return `<i class="o shred">Shredded</i>`;
    return pad > 0 ? `<i class="o pad">Got away with ${money(pad)}</i>` : '<i class="o ok">Honest</i>';
  };
  const ledger = s.claims.map((c, k) => `<tr class="${c.claim > c.real ? 'padded' : ''}">
      <td class="num">${k + 1}</td><td>${nm(c.seat)}</td><td class="it">${c.who ? esc(c.who.name) + ' ' : ''}<span class="${c.what.by != null ? 'wi' : ''}">${esc(c.what.name)}</span><small>${esc(c.sur)}</small></td>
      <td class="num">${money(c.claim)}</td><td class="num">${money(c.real)}</td><td>${out(c)}</td></tr>`).join('');
  app.innerHTML = `<main class="end">
    <section class="verdict ${e.bust ? 'bust' : 'ok'}">${verdict}</section>
    <ol class="rank">${rows}</ol>
    <section class="ledger"><h2>Everybody's receipts</h2>
      <div class="scroll"><table><thead><tr><th>#</th><th>Who</th><th>Item</th><th>Claimed</th><th>Real</th><th></th></tr></thead><tbody>${ledger}</tbody></table></div>
    </section>
    <div class="again"><button class="go" id="again">Another year</button><button class="ghost" id="home">Change staff</button></div>
  </main>`;
  app.querySelector('#again').onclick = startGame;
  app.querySelector('#home').onclick = () => { ui.screen = 'title'; ui.s = null; setScene(); render(); };
}
// Start on the title card.
setScene();
render();
})();
</script>
